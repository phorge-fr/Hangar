[Service]
# The kube-apiserver of k0s runs as the user kube-apiserver, which cannot create a directory under /var/lib: this one holds its audit log
# (docs/kubernetes-audit.md). Run with full rights (the +) and without failing the start (the -) on a new node where k0s has not created
# the user yet; the next start then finds it.
ExecStartPre=-+/usr/bin/install -d -o kube-apiserver -g kube-apiserver -m 0750 /var/lib/k0s-audit
