# Audit policy of the kube-apiserver of the three clusters (control, core, svc), uploaded by k0sctl to /etc/k0s/audit-policy.yaml
# (see docs/kubernetes-audit.md). The first rule that matches a request decides its level. Nothing here records the body of a
# secret or of a configmap: those are never more than Metadata (who, what, when, from where, with which result).
apiVersion: audit.k8s.io/v1
kind: Policy
# One record per request, when it is answered. RequestReceived would double the volume, and ResponseStarted (only for the
# long requests: watches, exec) would do it again for the ones that last.
omitStages:
    - RequestReceived
    - ResponseStarted
# The copies of the objects in the events keep the managed fields, which are long and of no use here
omitManagedFields: true
rules:
    # Health, metrics, version and API discovery: polled all the time by probes, Prometheus and every client
    - level: None
      nonResourceURLs:
          - /healthz*
          - /livez*
          - /readyz*
          - /version
          - /metrics
          - /openapi*
          - /api
          - /api/*
          - /apis
          - /apis/*

    # The control plane talking to itself, and the kubelets: thousands of requests an hour, no decision of a person
    - level: None
      users:
          - system:kube-proxy
          - system:kube-scheduler
          - system:kube-controller-manager
          - system:apiserver
    - level: None
      userGroups:
          - system:nodes

    # Churn that says nothing about who did what: events, leases, endpoints and the status of what the controllers keep updating
    - level: None
      resources:
          - group: ""
            resources: ["events", "endpoints", "pods/status", "nodes/status"]
          - group: "events.k8s.io"
            resources: ["events"]
          - group: "coordination.k8s.io"
            resources: ["leases"]
          - group: "discovery.k8s.io"
            resources: ["endpointslices"]
    # The status that the controllers write back on their own objects (Flux, Longhorn, Crossplane, the workload controllers):
    # constant, and the work of a program, not a decision. What they change in the spec is kept, below. A new kind of
    # object that is not listed here shows up in the log, which is the cue to add its group.
    - level: None
      userGroups:
          - system:serviceaccounts
      verbs: ["create", "update", "patch", "apply"]
      resources:
          - group: ""
            resources: ["*/status"]
          - group: "apps"
            resources: ["*/status"]
          - group: "batch"
            resources: ["*/status"]
          - group: "longhorn.io"
            resources: ["*/status"]
          - group: "helm.toolkit.fluxcd.io"
            resources: ["*/status"]
          - group: "kustomize.toolkit.fluxcd.io"
            resources: ["*/status"]
          - group: "source.toolkit.fluxcd.io"
            resources: ["*/status"]
          - group: "notification.toolkit.fluxcd.io"
            resources: ["*/status"]
          - group: "cert-manager.io"
            resources: ["*/status"]
          - group: "acme.cert-manager.io"
            resources: ["*/status"]
          - group: "pkg.crossplane.io"
            resources: ["*/status"]
          - group: "apiextensions.crossplane.io"
            resources: ["*/status"]
          - group: "phorge.fr"
            resources: ["*/status"]
          - group: "cluster.incus.crossplane.io"
            resources: ["*/status"]
          - group: "network.incus.crossplane.io"
            resources: ["*/status"]
          - group: "project.incus.m.crossplane.io"
            resources: ["*/status"]
          - group: "profile.incus.m.crossplane.io"
            resources: ["*/status"]
          - group: "network.incus.m.crossplane.io"
            resources: ["*/status"]
    # The checks that the apiserver makes of tokens and permissions for other components
    - level: None
      resources:
          - group: "authentication.k8s.io"
            resources: ["tokenreviews"]
          - group: "authorization.k8s.io"
            resources: ["subjectaccessreviews", "selfsubjectaccessreviews", "selfsubjectrulesreviews", "localsubjectaccessreviews"]

    # Secrets: every access, by anybody, but never the content (Metadata)
    - level: Metadata
      resources:
          - group: ""
            resources: ["secrets", "serviceaccounts/token"]

    # Reading by the service accounts of the applications (Flux, Crossplane, Cilium, cert-manager...) is routine and constant:
    # only what they change is kept, below. A person reading with kubectl is kept.
    - level: None
      userGroups:
          - system:serviceaccounts
      verbs: ["get", "list", "watch"]

    # Who gets permissions: the whole request and the response, for every change
    - level: RequestResponse
      resources:
          - group: "rbac.authorization.k8s.io"
            resources: ["roles", "rolebindings", "clusterroles", "clusterrolebindings"]
      verbs: ["create", "update", "patch", "delete", "deletecollection"]

    # A shell or a tunnel into a pod: the request (the command is in the URI), no output
    - level: Request
      resources:
          - group: ""
            resources: ["pods/exec", "pods/attach", "pods/portforward", "pods/ephemeralcontainers"]

    # Everything else, reads by people included: who, what, when, from where, result
    - level: Metadata
