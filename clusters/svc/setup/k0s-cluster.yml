apiVersion: k0sctl.k0sproject.io/v1beta1
kind: Cluster
metadata:
    name: svc
    user: phorge-admin
spec:
    k0s:
        version: 1.36.4+k0s.0
        config:
            apiVersion: k0s.k0sproject.io/v1beta1
            kind: Cluster
            metadata:
                name: k0s
            spec:
                api:
                    k0sApiPort: 9443
                    port: 6443
                    sans:
                        - 10.3.0.4
                    extraArgs:
                        # See clusters/control/setup/k0s-cluster.yml: same tuning, validated there
                        # first (apiserver RSS 0.87-1.27 GiB before, sustained 0.85-0.95 GiB after,
                        # cluster healthy throughout). Real object counts here never exceed a few
                        # hundred per type; the default reserves 100 per type regardless.
                        default-watch-cache-size: "20"
                        # Audit log of the API server (docs/kubernetes-audit.md): who did what, to what, from where. The policy is
                        # clusters/audit-policy.yaml, uploaded to every node below. The file is only a buffer (3 files of 100 MiB at most,
                        # 3 days): Alloy ships it to Loki, which is the record.
                        audit-policy-file: /etc/k0s/audit-policy.yaml
                        audit-log-path: /var/lib/k0s-audit/audit.log
                        audit-log-maxsize: "100"
                        audit-log-maxbackup: "3"
                        audit-log-maxage: "3"
                network:
                    provider: custom
                    kubeProxy:
                        disabled: true
                    podCIDR: 10.244.0.0/16
                    serviceCIDR: 10.96.0.0/12
                    controlPlaneLoadBalancing:
                        enabled: true
                        type: Keepalived
                        keepalived:
                            vrrpInstances:
                                - virtualIPs:
                                      - 10.3.0.4/24
                                  authPass: ENC[AES256_GCM,data:HKzzKiFYg9o=,iv:xsuPxiJbab5UGtnfiEzY1erW2imzCasZiIQi7SoICoM=,tag:OmRxs+uwRJHxd11RvJm+Sg==,type:str]
                                  interface: end0
                    nodeLocalLoadBalancing:
                        enabled: true
                        type: Traefik
                storage:
                    type: etcd
                    etcd:
                        extraArgs:
                            listen-peer-urls: https://0.0.0.0:2380
                            listen-client-urls: https://0.0.0.0:2379
                            listen-metrics-urls: http://127.0.0.1:2381
                telemetry:
                    enabled: false
    hosts:
        - ssh:
              address: 10.3.0.1
              user: root
              port: 22
          role: controller+worker
          installFlags:
              - --disable-components=konnectivity-server
              - --kubelet-extra-args=--image-gc-high-threshold=50 --image-gc-low-threshold=45
          noTaints: true
          privateAddress: 10.3.0.1
          privateInterface: end0
          # Caps the Go heap of everything k0s spawns on the node (kube-apiserver is the one that
          # matters). Only read when k0scontroller starts: after changing the value, restart the
          # service on one node at a time. See the README of this directory.
          files:
              - name: k0scontroller-gomemlimit
                src: k0scontroller-gomemlimit.conf
                dst: /etc/systemd/system/k0scontroller.service.d/gomemlimit.conf
                perm: "0644"
                dirPerm: "0755"
              - name: k0s-audit-policy
                src: ../../audit-policy.yaml
                dst: /etc/k0s/audit-policy.yaml
                perm: "0644"
                dirPerm: "0755"
              - name: k0scontroller-audit-dir
                src: ../../k0scontroller-audit-dir.conf
                dst: /etc/systemd/system/k0scontroller.service.d/audit-dir.conf
                perm: "0644"
                dirPerm: "0755"
        - ssh:
              address: 10.3.0.2
              user: root
              port: 22
          role: controller+worker
          installFlags:
              - --disable-components=konnectivity-server
              - --kubelet-extra-args=--image-gc-high-threshold=50 --image-gc-low-threshold=45
          noTaints: true
          privateAddress: 10.3.0.2
          privateInterface: end0
          # Caps the Go heap of everything k0s spawns on the node (kube-apiserver is the one that
          # matters). Only read when k0scontroller starts: after changing the value, restart the
          # service on one node at a time. See the README of this directory.
          files:
              - name: k0scontroller-gomemlimit
                src: k0scontroller-gomemlimit.conf
                dst: /etc/systemd/system/k0scontroller.service.d/gomemlimit.conf
                perm: "0644"
                dirPerm: "0755"
              - name: k0s-audit-policy
                src: ../../audit-policy.yaml
                dst: /etc/k0s/audit-policy.yaml
                perm: "0644"
                dirPerm: "0755"
              - name: k0scontroller-audit-dir
                src: ../../k0scontroller-audit-dir.conf
                dst: /etc/systemd/system/k0scontroller.service.d/audit-dir.conf
                perm: "0644"
                dirPerm: "0755"
        - ssh:
              address: 10.3.0.3
              user: root
              port: 22
          role: controller+worker
          installFlags:
              - --disable-components=konnectivity-server
              - --kubelet-extra-args=--image-gc-high-threshold=50 --image-gc-low-threshold=45
          noTaints: true
          privateAddress: 10.3.0.3
          privateInterface: end0
          # Caps the Go heap of everything k0s spawns on the node (kube-apiserver is the one that
          # matters). Only read when k0scontroller starts: after changing the value, restart the
          # service on one node at a time. See the README of this directory.
          files:
              - name: k0scontroller-gomemlimit
                src: k0scontroller-gomemlimit.conf
                dst: /etc/systemd/system/k0scontroller.service.d/gomemlimit.conf
                perm: "0644"
                dirPerm: "0755"
              - name: k0s-audit-policy
                src: ../../audit-policy.yaml
                dst: /etc/k0s/audit-policy.yaml
                perm: "0644"
                dirPerm: "0755"
              - name: k0scontroller-audit-dir
                src: ../../k0scontroller-audit-dir.conf
                dst: /etc/systemd/system/k0scontroller.service.d/audit-dir.conf
                perm: "0644"
                dirPerm: "0755"
