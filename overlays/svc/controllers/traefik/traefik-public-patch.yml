apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
    name: traefik-public
    namespace: traefik
spec:
    values:
        # One pod on every node (a new one is ready before the old one stops) and externalTrafficPolicy Local: with Cluster the
        # node that answers for the address of the service (Cilium L2 announcement) rewrites the source of a connection whose pod
        # is on another node, so the PROXY header of the edge HAProxy comes from an address that is not in trustedIPs and is
        # ignored (every client showed up as the address of a node). With Local a node without a local pod drops the traffic, hence
        # the DaemonSet. See docs/explanation/authentik-sign-in-hardening.md, "The client address".
        deployment:
            kind: DaemonSet
        service:
            annotations:
                lbipam.cilium.io/ips: 10.3.0.11
            spec:
                externalTrafficPolicy: Local
        ports:
            websecure:
                proxyProtocol:
                    trustedIPs:
                        - 10.3.0.254/32
