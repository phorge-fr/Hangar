# ProviderConfig for provider-authentik. The token is the one of the service account crossplane-provider, created by
# overlays/core/apps/authentik/blueprint-crossplane.yml: the same value is in the Secret authentik-crossplane-provider of
# core, which authentik reads. The API is on authentik.core.phorge (traefik-local of core, certificate of the local CA):
# ca_cert in the credentials is the public part of local-root-ca, as for provider-openfga. Same reachability note as
# provider-openfga-providerconfig.yml: the control nodes reach 10.2.0.10:443 through the Alloy rule of the Network repository.
apiVersion: authentik.crossplane.io/v1beta1
kind: ProviderConfig
metadata:
    name: default
spec:
    credentials:
        source: Secret
        secretRef:
            namespace: crossplane-system
            name: provider-authentik-creds
            key: credentials
