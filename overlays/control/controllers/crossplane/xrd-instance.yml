# An Instance is a virtual machine in a tenant's Incus project (containers are blocked). It runs from an
# Image of the same tenant (spec.imageRef), never from a bare image name, see xrd-image.yml.
# Its size is a profile of the tenant (spec.profile) or custom cpu, memory and disk, and it is attached to
# Networks of the tenant (spec.networks, one NIC each), see xrd-network.yml. The cpu, memory and disk bounds are per
# instance, the limits of the tenant (composition-tenant.yml) are enforced on top of them by the Incus project.
#
# Secure boot and the SSH keys have no default here, on purpose: the profile (spec.profile) can carry them (xrd-profile.yml), and a
# default of the XRD would be written into every Instance and override the profile's. What the instance says wins; what it does
# not say is the profile's, and without one, the default of the composition (secure boot on, no key). Nesting keeps its default
# (false) and is the instance's alone: the tenant's project blocks it on a profile. The values in force are in status.nesting,
# status.secureBoot and status.sshPublicKeys.
#
# Lives in the tenant's own namespace ("t-<name>"), the Incus project is that same name.
apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
    name: instances.phorge.fr
spec:
    scope: Namespaced
    group: phorge.fr
    names:
        kind: Instance
        plural: instances
    versions:
        - name: v1alpha1
          served: true
          referenceable: true
          schema:
              openAPIV3Schema:
                  type: object
                  properties:
                      spec:
                          type: object
                          properties:
                              imageRef:
                                  description: Image of the same tenant to start from.
                                  type: object
                                  properties:
                                      name:
                                          type: string
                                          minLength: 1
                                  required:
                                      - name
                              nesting:
                                  description: >-
                                      Allow running VMs or containers inside this VM (security.nesting). Not a setting of a
                                      profile: the tenant's project does not allow it there.
                                  type: boolean
                                  default: false
                              secureBoot:
                                  description: >-
                                      UEFI secure boot (security.secureboot). Some cloud images do not boot with it
                                      (Incus then refuses to start them: "incompatible with secureboot", seen with
                                      alpine/3.22/cloud): set it to false for those. Without it, the profile's, and without
                                      one, true. See status.secureBoot for the value in force.
                                  type: boolean
                              profile:
                                  description: >-
                                      Size of the instance: a profile of the tenant (s, m, l, or one the user made), which
                                      carries the CPU, the memory and the root disk. Give it or give cpu, memoryMiB and
                                      diskGiB, not both.
                                  type: string
                                  pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,62}$'
                              network:
                                  description: >-
                                      Deprecated, give networks. The one network of the same tenant that the instance is
                                      attached to (eth0), the same as networks with this single name.
                                  type: string
                                  pattern: '^[a-z][a-z0-9-]{0,14}$'
                              networks:
                                  description: >-
                                      Networks of the same tenant that the instance is attached to, one NIC each in this
                                      order (eth0, eth1, ...), without duplicate. The tenant's limit (2 networks)
                                      is on how many networks the tenant has, not on how many an instance joins.
                                  type: array
                                  minItems: 1
                                  maxItems: 8
                                  x-kubernetes-list-type: set
                                  items:
                                      type: string
                                      pattern: '^[a-z][a-z0-9-]{0,14}$'
                              cpu:
                                  description: Custom size, with memoryMiB and diskGiB, when there is no profile.
                                  type: integer
                                  minimum: 1
                                  maximum: 16
                              memoryMiB:
                                  type: integer
                                  minimum: 256
                                  maximum: 65536
                              diskGiB:
                                  type: integer
                                  minimum: 1
                                  maximum: 500
                              running:
                                  type: boolean
                                  default: true
                              sshPublicKeys:
                                  description: >-
                                      Injected with cloud-init, so the image must be a cloud variant (e.g. debian/13/cloud).
                                      Keys given here replace the profile's, they do not add to them. Without the field, the
                                      profile's keys, and without one, none. See status.sshPublicKeys for the keys in force.
                                  type: array
                                  maxItems: 20
                                  items:
                                      type: string
                                      maxLength: 1024
                                      # Same shape as the Phorge API accepts. A key is written into the cloud-init
                                      # user data, so a line break or a stray YAML character must never get through.
                                      x-kubernetes-validations:
                                          - rule: "self.matches('^(ssh-ed25519|ssh-rsa|ecdsa-sha2-nistp(256|384|521)|sk-ssh-ed25519@openssh[.]com|sk-ecdsa-sha2-nistp256@openssh[.]com) [A-Za-z0-9+/]{16,}={0,3}( [A-Za-z0-9@._+=/-]{1,100})?$')"
                                            message: "each key must be '<type> <base64 key>' with at most a one word comment of letters, digits and @._+=/-"
                          x-kubernetes-validations:
                              - rule: "!has(self.profile) || !(has(self.cpu) || has(self.memoryMiB) || has(self.diskGiB))"
                                message: "give a profile or cpu, memoryMiB and diskGiB, not both"
                              - rule: "has(self.profile) || (has(self.cpu) && has(self.memoryMiB) && has(self.diskGiB))"
                                message: "without a profile, cpu, memoryMiB and diskGiB are all required"
                              - rule: "has(self.network) != has(self.networks)"
                                message: "give networks (or the deprecated network), one of the two"
                          required:
                              - imageRef
                      status:
                          type: object
                          properties:
                              problems:
                                  type: string
                                  description: What is wrong with the composed resources, empty when everything is up.
                              state:
                                  type: string
                              nesting:
                                  description: >-
                                      Nesting in force: the instance's, false by default.
                                  type: boolean
                              secureBoot:
                                  description: >-
                                      Secure boot in force: the instance's, else its profile's, else true.
                                  type: boolean
                              sshPublicKeys:
                                  description: >-
                                      SSH public keys in force: the instance's, else its profile's, else none.
                                  type: array
                                  items:
                                      type: string
                              ipv4:
                                  type: string
                              networks:
                                  description: The address of the instance on each network, in the order of spec.networks.
                                  type: array
                                  items:
                                      type: object
                                      properties:
                                          network:
                                              type: string
                                          ipv4:
                                              type: string
                                          ipv6:
                                              type: string
