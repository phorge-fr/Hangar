apiVersion: v1
kind: Namespace
metadata:
    name: crossplane-system
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
    name: crossplane
    namespace: crossplane-system
spec:
    interval: 1m0s
    timeout: 15m0s
    url: https://charts.crossplane.io/stable
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
    name: crossplane
    namespace: crossplane-system
spec:
    chart:
        spec:
            chart: crossplane
            sourceRef:
                kind: HelmRepository
                name: crossplane
            version: '2.4.3'
    interval: 1m0s
