# A Network is an OVN network a user deploys in their tenant's Incus project, managed by Crossplane.
# A tenant comes without one (see composition-tenant.yml): instances are attached to a network of the
# tenant (Instance.spec.network), which is what makes them reachable. The network is NATed on the
# UPLINK and there is no field to turn that off: a tenant cannot route its own subnet (the project blocks
# restricted.networks.subnets), and an OVN network without NAT on this uplink is created in the "Errored" state by
# Incus while Crossplane reads Ready (verified live 2026-11-08). Its addresses are the user's choice (spec.ipv4, and the local
# spec.ipv6), or Incus's when none is given: the provider does not report the range Incus chose, so the status only says an
# address that was asked for. Both can change in place, which Incus accepts on a network that VMs use; the VMs on it are
# disturbed (docs/reference/phorge-api-kinds.md says how), so what guards that is the API.
# The tenant's plan limits how many networks there can be.
#
# Lives in the tenant's own namespace ("t-<name>"), the Incus project is that same name.
apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
    name: networks.phorge.fr
spec:
    scope: Namespaced
    group: phorge.fr
    names:
        kind: Network
        plural: networks
    versions:
        - name: v1alpha1
          served: true
          referenceable: true
          schema:
              openAPIV3Schema:
                  type: object
                  # The name is the name of the Incus network, which is 15 characters at most.
                  x-kubernetes-validations:
                      - rule: "self.metadata.name.matches('^[a-z][a-z0-9-]{0,14}$')"
                        message: "name must be 1 to 15 characters: lowercase letters, digits and hyphens, starting with a letter"
                  properties:
                      spec:
                          type: object
                          # What was given to Incus stays there when the field is taken out (measured: the provider does not unset it,
                          # and the status would then say "Incus chose"), so a range can be changed and never removed.
                          x-kubernetes-validations:
                              - rule: "!has(oldSelf.ipv4) || has(self.ipv4)"
                                message: "ipv4 cannot be removed once given, give another range or delete the network"
                              - rule: "!has(oldSelf.ipv6) || has(self.ipv6)"
                                message: "ipv6 cannot be removed once given, give another range or delete the network"
                          properties:
                              description:
                                  type: string
                                  maxLength: 200
                              ipv4:
                                  description: >-
                                      The address of the network and its prefix, in the form Incus takes: the address of the
                                      gateway, "10.77.1.1/24". Without it Incus chooses one, which nothing reports back.
                                      Incus does not refuse two networks on the same range: the API does.
                                  type: string
                                  pattern: '^((25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])[.]){3}(25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])/(1[6-9]|2[0-9])$'
                              ipv6:
                                  description: >-
                                      The local IPv6 range of the network, as the address of the gateway in a unique local
                                      range (fd00::/8) with a /64 prefix: "fd00:7:8:9::1/64". Without it Incus chooses one. Incus
                                      accepts any address here, so the form is checked by this rule: a global prefix or another
                                      prefix length would be taken and break the network.
                                  type: string
                                  pattern: '^fd[0-9a-f]{2}:[0-9a-f]{1,4}:[0-9a-f]{1,4}:[0-9a-f]{1,4}::1/64$'
                      status:
                          type: object
                          properties:
                              problems:
                                  type: string
                                  description: What is wrong with the composed resources, empty when everything is up.
                              ipv4:
                                  type: string
                                  description: The address that was asked for (spec.ipv4), empty when Incus chose.
                              ipv6:
                                  type: string
                                  description: The IPv6 range that was asked for (spec.ipv6), empty when Incus chose.
