# Renders nothing but the status of an ApiKey, see xrd-apikey.yml. A key is its owner limited to its scopes: the
# API checks the scope and asks OpenFGA about the owner at every request, so there is no tuple to write, and none
# to remove when the key expires or is deleted. What Crossplane adds is the guard on the namespace and the status
# the API shows (the id of the key, whether its date has passed).
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
    name: apikey.phorge.fr
spec:
    compositeTypeRef:
        apiVersion: phorge.fr/v1alpha1
        kind: ApiKey
    mode: Pipeline
    pipeline:
        - step: render
          functionRef:
              name: function-go-templating
          input:
              apiVersion: gotemplating.fn.crossplane.io/v1beta1
              kind: GoTemplate
              source: Inline
              inline:
                  template: |
                      {{- $xr := .observed.composite.resource -}}
                      {{- if ne $xr.metadata.namespace "phorge-keys" -}}
                      {{- fail (printf "an ApiKey belongs in the namespace phorge-keys (it is a person's, not a tenant's), not %q" $xr.metadata.namespace) -}}
                      {{- end -}}
                      {{- /* An expired key grants nothing. The API checks the date itself at every request, this is
                               what it shows in the list. */ -}}
                      {{- $expired := false -}}
                      {{- if $xr.spec.expiresAt -}}
                      {{- if (now).After (toDate "2006-01-02T15:04:05Z07:00" $xr.spec.expiresAt) -}}{{- $expired = true -}}{{- end -}}
                      {{- end -}}
                      ---
                      apiVersion: phorge.fr/v1alpha1
                      kind: ApiKey
                      status:
                        keyId: {{ $xr.metadata.name | quote }}
                        expired: {{ $expired }}
                        problems: ""
