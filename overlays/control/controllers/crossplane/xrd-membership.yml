# A Membership gives one user, or one group, a role on a tenant. The role is an Incus project role
# (OpenFGA relation on project:t-<name> in the store Incus authorizes against), so Incus enforces it
# itself, through this API as well as through its own UI and CLI:
#   admin    everything in the project, including its configuration
#   operator manage the project's instances, images and networks
#   user     use and create instances
#   viewer   read-only
#
# Lives in the tenant's own namespace ("t-<name>"): the tenant is that namespace. A User is
# identified by its email, the OIDC claim Incus matches users on (oidc.claim). Group members are
# resolved by Incus from the token's groups claim when oidc.groups.claim is set on the cluster.
apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
    name: memberships.phorge.fr
spec:
    scope: Namespaced
    group: phorge.fr
    names:
        kind: Membership
        plural: memberships
    versions:
        - name: v1alpha1
          served: true
          referenceable: true
          schema:
              openAPIV3Schema:
                  type: object
                  properties:
                      spec:
                          type: object
                          properties:
                              subject:
                                  type: object
                                  # A tuple cannot be edited in OpenFGA: a new subject or role means destroying one
                                  # tuple and writing another, which provider-openfga refuses
                                  # (lifecycle.prevent_destroy). The change would then stay Synced=False on the tuple while
                                  # the Membership reads Ready, and the old right would keep being granted. Refused up
                                  # front instead: delete the Membership and create another. The rule is on these two
                                  # fields, not on the whole spec: Crossplane writes its own fields under spec
                                  # (composition references) and an object-wide rule would block it.
                                  x-kubernetes-validations:
                                      - rule: "self == oldSelf"
                                        message: "a Membership cannot be edited: delete it and create another (a tuple cannot be changed in place)"
                                      - rule: "self.kind != 'User' || self.name.matches('^[^@\\\\s]+@[^@\\\\s]+$')"
                                        message: "a User subject is identified by its email address"
                                  properties:
                                      kind:
                                          type: string
                                          enum: [User, Group]
                                      name:
                                          type: string
                                          minLength: 1
                                  required:
                                      - kind
                                      - name
                              role:
                                  type: string
                                  enum: [admin, operator, user, viewer]
                                  x-kubernetes-validations:
                                      - rule: "self == oldSelf"
                                        message: "a Membership cannot be edited: delete it and create another (a tuple cannot be changed in place)"
                          required:
                              - subject
                              - role
