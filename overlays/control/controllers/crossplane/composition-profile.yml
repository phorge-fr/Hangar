# Renders the Incus profile of a Profile, see xrd-profile.yml: the CPU and the memory as limits and the root disk with its size, as the
# profiles s, m and l of the Tenant composition are made. The project is the namespace's own name.
#
# A Usage keeps the tenant's namespace while the Incus profile exists, as for the networks and the images: provider-incus cannot reach
# Incus once the namespace terminates (phorge-fr/Hangar#185). An instance's own Usage keeps the profile while the instance uses it.
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
    name: profile.phorge.fr
spec:
    compositeTypeRef:
        apiVersion: phorge.fr/v1alpha1
        kind: Profile
    mode: Pipeline
    pipeline:
        - step: render
          functionRef:
              name: function-go-templating
          input:
              apiVersion: gotemplating.fn.crossplane.io/v1beta1
              kind: GoTemplate
              source: Inline
              inline:
                  template: |
                      {{- /* Ready only when the managed resource is Ready AND Synced: a failing reconcile
                               (Synced=False) must not read as Ready because its last good state was. */ -}}
                      {{- define "ready" -}}
                      {{- $ready := false -}}
                      {{- $synced := true -}}
                      {{- range (dig "resource" "status" "conditions" (list) .) -}}
                      {{- if and (eq .type "Ready") (eq .status "True") -}}{{- $ready = true -}}{{- end -}}
                      {{- if and (eq .type "Synced") (ne .status "True") -}}{{- $synced = false -}}{{- end -}}
                      {{- end -}}
                      {{- if and $ready $synced -}}True{{- else -}}False{{- end -}}
                      {{- end -}}
                      {{- /* What is wrong with the composed resources, for status.problems. */ -}}
                      {{- $problems := list -}}
                      {{- range $rname, $res := (default (dict) .observed.resources) -}}
                      {{- range (dig "resource" "status" "conditions" (list) $res) -}}
                      {{- if and (or (eq .type "Ready") (eq .type "Synced") (eq .type "LastAsyncOperation")) (ne .status "True") -}}
                      {{- $problems = append $problems (printf "%s %s: %s" $rname .type (default "not ready" .message)) -}}
                      {{- end -}}
                      {{- end -}}
                      {{- end -}}
                      {{- $xr := .observed.composite.resource -}}
                      {{- if not (hasPrefix "t-" $xr.metadata.namespace) -}}
                      {{- fail (printf "a Profile belongs in a tenant namespace (t-<name>), not %q" $xr.metadata.namespace) -}}
                      {{- end -}}
                      {{- /* The namespace must belong to a Tenant: the Tenant composition creates it, but a
                               namespace named t-<x> can also be created by hand, and the namespace is used as the
                               Incus project name and in OpenFGA objects. The Tenant is asked for through
                               ExtraResources; until it is resolved nothing is decided, once resolved an empty answer
                               refuses the object. */ -}}
                      {{- $tenantName := trimPrefix "t-" $xr.metadata.namespace -}}
                      {{- $found := default (dict) .extraResources -}}
                      {{- $tenantItems := list -}}
                      {{- if hasKey $found "tenant" -}}
                      {{- $tenantItems = dig "items" (list) (default (dict) (index $found "tenant")) -}}
                      {{- if not $tenantItems -}}
                      {{- fail (printf "namespace %q has no Tenant %q in phorge-system: create the Tenant first" $xr.metadata.namespace $tenantName) -}}
                      {{- end -}}
                      {{- end -}}
                      {{- $name := $xr.metadata.name -}}
                      {{- $spec := $xr.spec -}}
                      {{- $obs := default (dict) .observed.resources -}}
                      {{- $prof := default (dict) (index $obs "profile") -}}
                      apiVersion: meta.gotemplating.fn.crossplane.io/v1alpha1
                      kind: ExtraResources
                      requirements:
                        tenant:
                          apiVersion: phorge.fr/v1alpha1
                          kind: Tenant
                          matchName: {{ $tenantName }}
                          namespace: phorge-system
                      ---
                      apiVersion: profile.incus.m.crossplane.io/v1alpha1
                      kind: Profile
                      metadata:
                        name: {{ $name }}
                        annotations:
                          crossplane.io/external-name: {{ $name }}
                          gotemplating.fn.crossplane.io/composition-resource-name: profile
                          gotemplating.fn.crossplane.io/ready: "{{ template "ready" $prof }}"
                      spec:
                        forProvider:
                          project: {{ $xr.metadata.namespace }}
                          description: {{ default (printf "%d vCPU, %d MiB RAM, %d GiB disk" (int $spec.cpu) (int $spec.memoryMiB) (int $spec.diskGiB)) $spec.description | quote }}
                          config:
                            limits.cpu: {{ $spec.cpu | quote }}
                            limits.memory: {{ printf "%dMiB" (int $spec.memoryMiB) | quote }}
                          device:
                            - name: root
                              type: disk
                              properties:
                                path: /
                                pool: remote
                                size: {{ printf "%dGiB" (int $spec.diskGiB) | quote }}
                      ---
                      apiVersion: protection.crossplane.io/v1beta1
                      kind: Usage
                      metadata:
                        name: {{ $name }}-keeps-namespace
                        annotations:
                          gotemplating.fn.crossplane.io/composition-resource-name: namespace-usage
                          gotemplating.fn.crossplane.io/ready: "{{ template "ready" (default (dict) (index $obs "namespace-usage")) }}"
                      spec:
                        replayDeletion: true
                        reason: "The Incus profile {{ $name }} must be deleted before the namespace of the tenant"
                        of:
                          apiVersion: kubernetes.m.crossplane.io/v1alpha1
                          kind: Object
                          resourceRef:
                            name: {{ $xr.metadata.namespace }}
                            namespace: phorge-system
                        by:
                          apiVersion: profile.incus.m.crossplane.io/v1alpha1
                          kind: Profile
                          resourceRef:
                            name: {{ $name }}
                      ---
                      apiVersion: phorge.fr/v1alpha1
                      kind: Profile
                      status:
                        problems: {{ join " | " $problems | trunc 800 | quote }}
