# Authorization model of the Phorge API store, see openfga-phorge-store.yml.
#
# Needs provider-openfga >= v0.1.1: its image builds terraform-provider-openfga with the patch that
# lets Crossplane create the first model of an empty store (the released 0.5.1 binary cannot, the
# resource stays Synced=False).
#
# Roles mirror the Incus project roles. A scope of an API key is a relation of its own on the
# tenant (key_<resource>_<action>), written as a tuple per scope by the ApiKey composition; the
# can_* relations are what the API checks, for a user (through a role) or for a key (through a
# scope). A key never exceeds what its creator held: the API checks that when it creates the key.
#
# A key expires in OpenFGA, not in Authentik: its tuples carry the condition not_expired with
# expires_at in their context, and the API sends current_time with every Check. Past the date
# the key grants nothing, at the second, with nobody deleting anything. A question without
# current_time is an error, never a "yes".
#
# Models are immutable and versioned, and so is this resource: provider-openfga cannot change a model
# in place (model_json forces a replacement, upjet forbids the destroy, and OpenFGA deletes nothing).
# To change the model, copy this object under the next name (phorge-api-3, ...) with the new modelDsl
# and remove the old one in the same change: Flux creates the new version, which becomes the latest,
# and prunes the old object (its delete does nothing in OpenFGA). Tuples are written without a model
# ID so OpenFGA always evaluates them against the latest version. Nothing references this name.
apiVersion: model.openfga.m.crossplane.io/v1alpha1
kind: AuthorizationModel
metadata:
    name: phorge-api-3
    namespace: phorge-system
spec:
    forProvider:
        storeIdRef:
            name: phorge-api
        modelDsl: |
            model
              schema 1.1

            type user

            type apikey

            type group
              relations
                define member: [user]

            type tenant
              relations
                define admin: [user, group#member]
                define operator: [user, group#member] or admin
                define user: [user, group#member] or operator
                define viewer: [user, group#member] or user

                define key_tenant_read: [apikey with not_expired]
                define key_tenants_write: [apikey with not_expired]
                define key_networks_read: [apikey with not_expired]
                define key_networks_write: [apikey with not_expired]
                define key_instances_read: [apikey with not_expired]
                define key_instances_write: [apikey with not_expired]
                define key_images_read: [apikey with not_expired]
                define key_images_write: [apikey with not_expired]
                define key_memberships_read: [apikey with not_expired]
                define key_memberships_write: [apikey with not_expired]

                # Renaming a tenant and deleting it is for its admins, the owner among them (phorge-fr/phorge-api#75), or a key given
                # tenants:write on it. The plan is a platform administrator's, which the API reads from the token, not from here.
                define can_write_tenant: admin or key_tenants_write

                define can_read_tenant: viewer or key_tenant_read
                define can_read_instances: viewer or key_instances_read
                define can_write_instances: user or key_instances_write
                define can_read_images: viewer or key_images_read
                define can_write_images: operator or key_images_write
                # Reading the networks is for every role, writing for the operator and the admin, as for the images.
                define can_read_networks: viewer or key_networks_read
                define can_write_networks: operator or key_networks_write

                define can_read_memberships: admin or key_memberships_read
                define can_write_memberships: admin or key_memberships_write

            condition not_expired(current_time: timestamp, expires_at: timestamp) {
              current_time < expires_at
            }
