# An ApiKey is a service account of Authentik that holds a key for a person's scripts and tools (OpenTofu, CI, a
# CLI): the key is exchanged for a token (client_credentials) and the Phorge API accepts that token as the subject
# apikey:<status.identity>. It belongs to a user (spec.owner, an email), not to a tenant, so every ApiKey lives in the
# namespace "phorge-keys". It is revoked by deleting it.
#
# What a key may do is only what OpenFGA holds for its subject: one tuple per scope on each tenant of spec.grants,
# every one carrying the condition not_expired with spec.expiresAt, so OpenFGA itself refuses the key from that date
# (see openfga-phorge-model.yml). The account in Authentik does not expire: deleting the ApiKey deletes its token,
# the Secret and the tuples, and leaves the account without any credential. Who may create a key, and that it never
# exceeds what its creator holds, is decided by the API when it creates the object.
#
# The key is generated by Authentik and lands in the Secret status.secretName of the namespace of the ApiKey. The API
# shows it once and deletes it.
apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
    name: apikeys.phorge.fr
spec:
    scope: Namespaced
    group: phorge.fr
    names:
        kind: ApiKey
        plural: apikeys
    versions:
        - name: v1alpha1
          served: true
          referenceable: true
          schema:
              openAPIV3Schema:
                  type: object
                  properties:
                      spec:
                          type: object
                          properties:
                              displayName:
                                  type: string
                                  maxLength: 100
                              grants:
                                  description: |
                                      What the key may do and where: its scopes on each tenant, at most what its creator
                                      holds. A tenant appears once.
                                  type: array
                                  minItems: 1
                                  maxItems: 50
                                  x-kubernetes-list-type: map
                                  x-kubernetes-list-map-keys:
                                      - tenant
                                  items:
                                      type: object
                                      properties:
                                          tenant:
                                              description: The name of the tenant (the namespace is t-<name>).
                                              type: string
                                              pattern: '^[a-z0-9][a-z0-9-]{0,62}$'
                                          scopes:
                                              type: array
                                              minItems: 1
                                              x-kubernetes-list-type: set
                                              items:
                                                  type: string
                                                  enum:
                                                      - tenants:read
                                                      - instances:read
                                                      - instances:write
                                                      - images:read
                                                      - images:write
                                                      - memberships:read
                                                      - memberships:write
                                      required:
                                          - tenant
                                          - scopes
                              expiresAt:
                                  description: |
                                      From this date OpenFGA refuses the key. It cannot change: create another key.
                                  type: string
                                  format: date-time
                                  x-kubernetes-validations:
                                      - rule: "self == oldSelf"
                                        message: "the expiry of a key cannot change: create another key"
                              owner:
                                  description: |
                                      Email of the user the key belongs to, exactly as Authentik has it. Recorded by the API
                                      from the token of the person who creates the key. A key cannot be given to someone
                                      else: create another.
                                  type: string
                                  minLength: 3
                                  maxLength: 254
                                  x-kubernetes-validations:
                                      - rule: "self == oldSelf"
                                        message: "the owner of a key cannot change: create another key"
                          required:
                              - expiresAt
                              - grants
                              - owner
                      status:
                          type: object
                          properties:
                              problems:
                                  type: string
                                  description: What is wrong with the composed resources, empty when everything is up.
                              expired:
                                  type: boolean
                                  description: True once expiresAt has passed. An expired key grants nothing.
                              keyId:
                                  type: string
                                  description: The id of the key (the name of this object).
                              identity:
                                  type: string
                                  description: The user name of the service account in Authentik, which is also the OpenFGA subject apikey:<identity>.
                              secretName:
                                  type: string
                                  description: The Secret that receives the key, in the namespace of this object.
