# An ApiKey lets a machine (Terraform, CI, a CLI) call the Phorge API on behalf of one tenant,
# with an explicit list of scopes. It belongs to a tenant, lives in its namespace ("t-<name>") and
# is revoked by deleting it or by deleting the tenant.
#
# The secret is generated by the API, shown once and never stored: the XR only carries its SHA-256
# hash, so reading the XR never reveals the key and the API needs no access to Secrets. The API
# looks a presented key up by that hash.
#
# Each scope becomes a tuple of the key on the tenant in the Phorge OpenFGA store
# (openfga-phorge-model.yml). The API checks, when it creates the key, that its creator holds every
# scope it grants. spec.expiresAt is evaluated by the API: nothing here deletes an expired key.
apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
    name: apikeys.phorge.fr
spec:
    scope: Namespaced
    group: phorge.fr
    names:
        kind: ApiKey
        plural: apikeys
    versions:
        - name: v1alpha1
          served: true
          referenceable: true
          schema:
              openAPIV3Schema:
                  type: object
                  properties:
                      spec:
                          type: object
                          properties:
                              displayName:
                                  type: string
                                  maxLength: 100
                              hash:
                                  description: SHA-256 of the key, 64 lowercase hex characters.
                                  type: string
                                  pattern: '^[a-f0-9]{64}$'
                              scopes:
                                  type: array
                                  minItems: 1
                                  x-kubernetes-list-type: set
                                  items:
                                      type: string
                                      enum:
                                          - tenant:read
                                          - instances:read
                                          - instances:write
                                          - images:read
                                          - images:write
                                          - memberships:read
                                          - memberships:write
                              expiresAt:
                                  type: string
                                  format: date-time
                              createdBy:
                                  description: Email of the user who created the key, recorded by the API.
                                  type: string
                          required:
                              - hash
                              - scopes
                      status:
                          type: object
                          properties:
                              problems:
                                  type: string
                                  description: What is wrong with the composed resources, empty when everything is up.
                              keyId:
                                  type: string
