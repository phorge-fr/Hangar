# An ApiKey is a personal access token: it lets a person's scripts and tools (OpenTofu, CI, a CLI) call the
# Phorge API as that person, within an explicit list of scopes. It belongs to a user (spec.owner, an email),
# not to a tenant, so every ApiKey lives in the namespace "phorge-keys". It is revoked by deleting it.
#
# The secret is generated by the API, shown once and never stored: the XR only carries its SHA-256
# hash, so reading the XR never reveals the key and the API needs no access to Secrets. The API
# looks a presented key up by its id, the name of this object.
#
# A key is its owner, limited to its scopes: nothing is written to OpenFGA for it. The API checks the
# scope, then asks OpenFGA about the owner, so a key never exceeds the person it belongs to, even when
# their rights change after the key was made. spec.expiresAt is evaluated by the API: nothing here
# deletes an expired key. Who may create one is decided by the API (for now the platform administrators).
apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
    name: apikeys.phorge.fr
spec:
    scope: Namespaced
    group: phorge.fr
    names:
        kind: ApiKey
        plural: apikeys
    versions:
        - name: v1alpha1
          served: true
          referenceable: true
          schema:
              openAPIV3Schema:
                  type: object
                  properties:
                      spec:
                          type: object
                          properties:
                              displayName:
                                  type: string
                                  maxLength: 100
                              hash:
                                  description: "SHA-256 of the secret, 64 lowercase hex characters. The secret cannot be rotated, create another key."
                                  type: string
                                  pattern: '^[a-f0-9]{64}$'
                                  x-kubernetes-validations:
                                      - rule: "self == oldSelf"
                                        message: "the secret of a key cannot change: create another key"
                              scopes:
                                  description: |
                                      What the key may do, at most what its owner may. tenants:read reads the tenants the owner
                                      sees, tenants:write creates, resizes and deletes them (platform administrators only) and
                                      reads them too.
                                  type: array
                                  minItems: 1
                                  x-kubernetes-list-type: set
                                  items:
                                      type: string
                                      enum:
                                          - tenants:read
                                          - tenants:write
                                          - instances:read
                                          - instances:write
                                          - images:read
                                          - images:write
                                          - memberships:read
                                          - memberships:write
                              expiresAt:
                                  type: string
                                  format: date-time
                              owner:
                                  description: |
                                      Email of the user the key acts as, exactly as Authentik has it. Recorded by the API
                                      from the token of the person who creates the key. A key cannot be given to someone
                                      else: create another.
                                  type: string
                                  minLength: 3
                                  maxLength: 254
                                  x-kubernetes-validations:
                                      - rule: "self == oldSelf"
                                        message: "the owner of a key cannot change: create another key"
                          required:
                              - hash
                              - owner
                              - scopes
                      status:
                          type: object
                          properties:
                              problems:
                                  type: string
                                  description: What is wrong with the composed resources, empty when everything is up.
                              expired:
                                  type: boolean
                                  description: True once expiresAt has passed. An expired key grants nothing.
                              keyId:
                                  type: string
                                  description: The id of the key, the second part of the key itself (the name of this object).
