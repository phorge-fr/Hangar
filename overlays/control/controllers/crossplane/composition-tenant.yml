# Renders the resources of a Tenant (namespace, project, three profiles, two tuples), see xrd-tenant.yml.
#
# - The Project is deny-by-default: restricted=true and every restricted.* key set explicitly, so a
#   default changing in a later Incus release cannot silently open something. Allowed on purpose:
#   VMs (with nesting), managed disks and NICs, the "remote" pool, the UPLINK as network uplink,
#   snapshots and backups. Everything else is blocked,
#   containers included (limits.containers=0).
# - restricted.images.servers is NOT set although only linuxcontainers.org is wanted: provider-incus
#   sends the image server without a scheme, Incus parses its host as "" and refuses every pull
#   ("Image server \"\" isn't allowed in this project", verified live 2026-10-15 with both the bare
#   host and the URL as the allowed value). Images only come from the Image kind and tenants have
#   no write access to Incus directly, so the Image XRD is the gate until that is fixed upstream.
# - restricted.networks.subnets and restricted.networks.zones are left unset on purpose: unset
#   means blocked, and Incus rejects the literal value "block" for them (they take lists).
# - It is never force-destroyed: Incus refusing to delete a project that still holds instances,
#   images, networks or profiles is the safety, and the retry converges once they are gone.
#   That holds for the network and the profile, which this composition owns. It does not hold for
#   the Images, Instances and Memberships in the namespace: Kubernetes deletes the content of a
#   terminating namespace, ProviderConfigUsage objects included, and the providers cannot create
#   their own again to reach Incus or OpenFGA, so what is still there is never deleted. Each of those
#   compositions therefore composes a Usage that keeps the namespace Object (see composition-image.yml):
#   the Tenant stays Deleting until they are gone (the API deletes them first), then the namespace goes.
#   phorge-fr/Hangar#185.
# - Egress to the other Phorge networks is not an Incus matter: the router drops phorge-to-phorge
#   forwards (Network repo, drop-phorge-to-phorge), tenant traffic leaves through comp-ns.
# - A tenant is only its project, the three size profiles s, m and l, and the owner's tuples. There is no network
#   and no other profile: the user deploys their networks (the Network kind, see xrd-network.yml) and attaches
#   their instances to them. The profiles carry the CPU, the memory and the root disk of a size, so an
#   instance from a profile needs nothing else but its network. They are the tenant's own, created with it.
# - features.networks=true gives the project its own networks (a network of the user is an OVN network on the
#   UPLINK, NATed). ipv4.address is left to Incus ("auto") and Incus is relied on to avoid the subnets of the other
#   networks it manages. It cannot know the router's VLANs, so a subnet inside 10.1-10.5 or 10.10-10.12 stays
#   possible; the e2e suite (tests/e2e, group tenant) asserts that tenant networks are distinct and outside those
#   ranges.
# - The owner is "viewer" of the project in the Incus store (the Incus UI is read-only: Crossplane owns every
#   object and reconciles back anything changed by hand) and "admin" of the tenant in the Phorge API store,
#   the role the API checks. A Membership for the owner is refused (see composition-membership.yml).
# - Every composed resource sets its own ready annotation: function-go-templating leaves readiness
#   unspecified otherwise and the XR then stays Ready=False even though everything is up.
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
    name: tenant.phorge.fr
spec:
    compositeTypeRef:
        apiVersion: phorge.fr/v1alpha1
        kind: Tenant
    mode: Pipeline
    pipeline:
        - step: load-environment
          functionRef:
              name: function-environment-configs
          input:
              apiVersion: environmentconfigs.fn.crossplane.io/v1beta1
              kind: Input
              spec:
                  environmentConfigs:
                      - type: Reference
                        ref:
                            name: phorge
        - step: render
          functionRef:
              name: function-go-templating
          input:
              apiVersion: gotemplating.fn.crossplane.io/v1beta1
              kind: GoTemplate
              source: Inline
              inline:
                  template: |
                      {{- /* Ready only when the managed resource is Ready AND Synced: a failing reconcile
                               (Synced=False) must not read as Ready because its last good state was. */ -}}
                      {{- define "ready" -}}
                      {{- $ready := false -}}
                      {{- $synced := true -}}
                      {{- range (dig "resource" "status" "conditions" (list) .) -}}
                      {{- if and (eq .type "Ready") (eq .status "True") -}}{{- $ready = true -}}{{- end -}}
                      {{- if and (eq .type "Synced") (ne .status "True") -}}{{- $synced = false -}}{{- end -}}
                      {{- end -}}
                      {{- if and $ready $synced -}}True{{- else -}}False{{- end -}}
                      {{- end -}}
                      {{- /* What is wrong with the composed resources, for status.problems. */ -}}
                      {{- $problems := list -}}
                      {{- range $rname, $res := (default (dict) .observed.resources) -}}
                      {{- range (dig "resource" "status" "conditions" (list) $res) -}}
                      {{- if and (or (eq .type "Ready") (eq .type "Synced") (eq .type "LastAsyncOperation")) (ne .status "True") -}}
                      {{- $problems = append $problems (printf "%s %s: %s" $rname .type (default "not ready" .message)) -}}
                      {{- end -}}
                      {{- end -}}
                      {{- end -}}
                      {{- $xr := .observed.composite.resource -}}
                      {{- if ne $xr.metadata.namespace "phorge-system" -}}
                      {{- fail (printf "a Tenant belongs in phorge-system, not %q" $xr.metadata.namespace) -}}
                      {{- end -}}
                      {{- $name := $xr.metadata.name -}}
                      {{- $plans := dict "small" (dict "vms" 2 "cpu" 2 "mem" 4 "disk" 128 "nets" 1) "medium" (dict "vms" 4 "cpu" 4 "mem" 8 "disk" 256 "nets" 2) "large" (dict "vms" 6 "cpu" 8 "mem" 16 "disk" 512 "nets" 3) -}}
                      {{- $p := index $plans $xr.spec.plan -}}
                      {{- /* The sizes a tenant starts with, as Incus profiles of its project. A tenant is only its project and
                               these three profiles: the network and everything else is the user's to deploy. */ -}}
                      {{- $sizes := dict "s" (dict "cpu" 1 "mem" 2 "disk" 64) "m" (dict "cpu" 2 "mem" 4 "disk" 128) "l" (dict "cpu" 4 "mem" 8 "disk" 256) -}}
                      {{- $obs := default (dict) .observed.resources -}}
                      {{- $env := index .context "apiextensions.crossplane.io/environment" -}}
                      apiVersion: kubernetes.m.crossplane.io/v1alpha1
                      kind: Object
                      metadata:
                        name: t-{{ $name }}
                        annotations:
                          gotemplating.fn.crossplane.io/composition-resource-name: namespace
                          gotemplating.fn.crossplane.io/ready: "{{ template "ready" (default (dict) (index $obs "namespace")) }}"
                      spec:
                        providerConfigRef:
                          kind: ClusterProviderConfig
                          name: local
                        forProvider:
                          manifest:
                            apiVersion: v1
                            kind: Namespace
                            metadata:
                              name: t-{{ $name }}
                              labels:
                                phorge.fr/tenant: {{ $name }}
                      ---
                      apiVersion: project.incus.m.crossplane.io/v1alpha1
                      kind: Project
                      metadata:
                        name: t-{{ $name }}
                        annotations:
                          gotemplating.fn.crossplane.io/composition-resource-name: project
                          gotemplating.fn.crossplane.io/ready: "{{ template "ready" (default (dict) (index $obs "project")) }}"
                      spec:
                        forProvider:
                          description: {{ default $name $xr.spec.displayName | quote }}
                          forceDestroy: false
                          config:
                            restricted: "true"
                            features.images: "true"
                            features.profiles: "true"
                            features.networks: "true"
                            features.storage.volumes: "true"
                            limits.instances: {{ $p.vms | quote }}
                            limits.virtual-machines: {{ $p.vms | quote }}
                            limits.containers: "0"
                            limits.cpu: {{ $p.cpu | quote }}
                            limits.memory: {{ printf "%dGiB" (int $p.mem) | quote }}
                            limits.disk: {{ printf "%dGiB" (int $p.disk) | quote }}
                            limits.networks: {{ $p.nets | quote }}
                            restricted.cluster.target: block
                            restricted.containers.interception: block
                            restricted.containers.lowlevel: block
                            restricted.containers.nesting: block
                            restricted.containers.privilege: isolated
                            restricted.virtual-machines.lowlevel: block
                            restricted.virtual-machines.nesting: allow
                            restricted.devices.disk: managed
                            restricted.devices.nic: managed
                            restricted.devices.gpu: block
                            restricted.devices.infiniband: block
                            restricted.devices.pci: block
                            restricted.devices.proxy: block
                            restricted.devices.unix-block: block
                            restricted.devices.unix-char: block
                            restricted.devices.unix-hotplug: block
                            restricted.devices.usb: block
                            restricted.storage-pools.access: remote
                            restricted.networks.uplinks: UPLINK
                            restricted.snapshots: allow
                            restricted.backups: allow
                      {{- range $size, $r := $sizes }}
                      ---
                      apiVersion: profile.incus.m.crossplane.io/v1alpha1
                      kind: Profile
                      metadata:
                        name: t-{{ $name }}-{{ $size }}
                        annotations:
                          crossplane.io/external-name: {{ $size }}
                          gotemplating.fn.crossplane.io/composition-resource-name: profile-{{ $size }}
                          gotemplating.fn.crossplane.io/ready: "{{ template "ready" (default (dict) (index $obs (printf "profile-%s" $size))) }}"
                      spec:
                        forProvider:
                          projectRef:
                            name: t-{{ $name }}
                          description: {{ printf "%s: %d vCPU, %d GiB RAM, %d GiB disk" $size (int $r.cpu) (int $r.mem) (int $r.disk) | quote }}
                          config:
                            limits.cpu: {{ $r.cpu | quote }}
                            limits.memory: {{ printf "%dGiB" (int $r.mem) | quote }}
                          device:
                            - name: root
                              type: disk
                              properties:
                                path: /
                                pool: remote
                                size: {{ printf "%dGiB" (int $r.disk) | quote }}
                      {{- end }}
                      ---
                      apiVersion: tuple.openfga.m.crossplane.io/v1alpha1
                      kind: RelationshipTuple
                      metadata:
                        name: t-{{ $name }}-owner
                        annotations:
                          gotemplating.fn.crossplane.io/composition-resource-name: owner
                          gotemplating.fn.crossplane.io/ready: "{{ template "ready" (default (dict) (index $obs "owner")) }}"
                      spec:
                        forProvider:
                          storeId: {{ $env.openfgaStoreId | quote }}
                          user: {{ printf "user:%s" $xr.spec.owner | quote }}
                          relation: viewer
                          object: {{ printf "project:t-%s" $name | quote }}
                      ---
                      apiVersion: tuple.openfga.m.crossplane.io/v1alpha1
                      kind: RelationshipTuple
                      metadata:
                        name: t-{{ $name }}-owner-api
                        annotations:
                          gotemplating.fn.crossplane.io/composition-resource-name: owner-api
                          gotemplating.fn.crossplane.io/ready: "{{ template "ready" (default (dict) (index $obs "owner-api")) }}"
                      spec:
                        forProvider:
                          storeId: {{ $env.phorgeStoreId | quote }}
                          user: {{ printf "user:%s" $xr.spec.owner | quote }}
                          relation: admin
                          object: {{ printf "tenant:%s" $name | quote }}
                      ---
                      apiVersion: phorge.fr/v1alpha1
                      kind: Tenant
                      status:
                        namespace: t-{{ $name }}
                        incusProject: t-{{ $name }}
                        problems: {{ join " | " $problems | trunc 800 | quote }}
