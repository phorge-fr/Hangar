# Renders the Incus network of a Network, see xrd-network.yml: an OVN network of the tenant's project on the
# UPLINK. The project is the namespace's own name: a tenant "demo" is the namespace "t-demo" and the Incus
# project "t-demo".
#
# The Usage keeps the tenant's namespace while the Incus network exists, as for the images: provider-incus
# cannot reach Incus once the namespace terminates (phorge-fr/Hangar#185), so the Tenant waits in "Deleting"
# until the networks are deleted. The Incus project cannot be deleted before them either. The Usage is named after its kind
# (network-<name>-keeps-namespace): objects of two kinds that the user gave the same name live in one namespace, and a Usage
# of the same name would be refused for the second one (phorge-fr/Hangar#396).
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
    name: network.phorge.fr
spec:
    compositeTypeRef:
        apiVersion: phorge.fr/v1alpha1
        kind: Network
    mode: Pipeline
    pipeline:
        - step: render
          functionRef:
              name: function-go-templating
          input:
              apiVersion: gotemplating.fn.crossplane.io/v1beta1
              kind: GoTemplate
              source: Inline
              inline:
                  template: |
                      {{- /* Ready only when the managed resource is Ready AND Synced: a failing reconcile
                               (Synced=False) must not read as Ready because its last good state was. */ -}}
                      {{- define "ready" -}}
                      {{- $ready := false -}}
                      {{- $synced := true -}}
                      {{- range (dig "resource" "status" "conditions" (list) .) -}}
                      {{- if and (eq .type "Ready") (eq .status "True") -}}{{- $ready = true -}}{{- end -}}
                      {{- if and (eq .type "Synced") (ne .status "True") -}}{{- $synced = false -}}{{- end -}}
                      {{- end -}}
                      {{- if and $ready $synced -}}True{{- else -}}False{{- end -}}
                      {{- end -}}
                      {{- /* What is wrong with the composed resources, for status.problems. */ -}}
                      {{- $problems := list -}}
                      {{- range $rname, $res := (default (dict) .observed.resources) -}}
                      {{- range (dig "resource" "status" "conditions" (list) $res) -}}
                      {{- if and (or (eq .type "Ready") (eq .type "Synced") (eq .type "LastAsyncOperation")) (ne .status "True") -}}
                      {{- $problems = append $problems (printf "%s %s: %s" $rname .type (default "not ready" .message)) -}}
                      {{- end -}}
                      {{- end -}}
                      {{- end -}}
                      {{- $xr := .observed.composite.resource -}}
                      {{- if not (hasPrefix "t-" $xr.metadata.namespace) -}}
                      {{- fail (printf "a Network belongs in a tenant namespace (t-<name>), not %q" $xr.metadata.namespace) -}}
                      {{- end -}}
                      {{- /* The namespace must belong to a Tenant: the Tenant composition creates it, but a
                               namespace named t-<x> can also be created by hand, and the namespace is used as the
                               Incus project name and in OpenFGA objects. The Tenant is asked for through
                               ExtraResources; until it is resolved nothing is decided, once resolved an empty answer
                               refuses the object. */ -}}
                      {{- $tenantName := trimPrefix "t-" $xr.metadata.namespace -}}
                      {{- $found := default (dict) .extraResources -}}
                      {{- $tenantItems := list -}}
                      {{- if hasKey $found "tenant" -}}
                      {{- $tenantItems = dig "items" (list) (default (dict) (index $found "tenant")) -}}
                      {{- if not $tenantItems -}}
                      {{- fail (printf "namespace %q has no Tenant %q in phorge-system: create the Tenant first" $xr.metadata.namespace $tenantName) -}}
                      {{- end -}}
                      {{- end -}}
                      {{- $name := $xr.metadata.name -}}
                      {{- $spec := $xr.spec -}}
                      {{- $obs := default (dict) .observed.resources -}}
                      {{- $net := default (dict) (index $obs "network") -}}
                      apiVersion: meta.gotemplating.fn.crossplane.io/v1alpha1
                      kind: ExtraResources
                      requirements:
                        tenant:
                          apiVersion: phorge.fr/v1alpha1
                          kind: Tenant
                          matchName: {{ $tenantName }}
                          namespace: phorge-system
                      ---
                      apiVersion: network.incus.m.crossplane.io/v1alpha1
                      kind: Network
                      metadata:
                        name: {{ $name }}
                        annotations:
                          gotemplating.fn.crossplane.io/composition-resource-name: network
                          gotemplating.fn.crossplane.io/ready: "{{ template "ready" $net }}"
                      spec:
                        forProvider:
                          project: {{ $xr.metadata.namespace }}
                          name: {{ $name }}
                          type: ovn
                          {{- if $spec.description }}
                          description: {{ $spec.description | quote }}
                          {{- end }}
                          config:
                            network: UPLINK
                            ipv4.nat: "true"
                            {{- if $spec.ipv4 }}
                            ipv4.address: {{ $spec.ipv4 | quote }}
                            {{- end }}
                            ipv6.nat: "true"
                            {{- if $spec.ipv6 }}
                            ipv6.address: {{ $spec.ipv6 | quote }}
                            {{- end }}
                      ---
                      apiVersion: protection.crossplane.io/v1beta1
                      kind: Usage
                      metadata:
                        name: network-{{ $name }}-keeps-namespace
                        annotations:
                          gotemplating.fn.crossplane.io/composition-resource-name: namespace-usage
                          gotemplating.fn.crossplane.io/ready: "{{ template "ready" (default (dict) (index $obs "namespace-usage")) }}"
                      spec:
                        replayDeletion: true
                        reason: "The Incus network {{ $name }} must be deleted before the namespace of the tenant"
                        of:
                          apiVersion: kubernetes.m.crossplane.io/v1alpha1
                          kind: Object
                          resourceRef:
                            name: {{ $xr.metadata.namespace }}
                            namespace: phorge-system
                        by:
                          apiVersion: network.incus.m.crossplane.io/v1alpha1
                          kind: Network
                          resourceRef:
                            name: {{ $name }}
                      ---
                      apiVersion: phorge.fr/v1alpha1
                      kind: Network
                      status:
                        ipv4: {{ default "" $spec.ipv4 | quote }}
                        ipv6: {{ default "" $spec.ipv6 | quote }}
                        problems: {{ join " | " $problems | trunc 800 | quote }}
