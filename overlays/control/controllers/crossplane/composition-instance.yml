# Renders the Incus Instance of an Instance, see xrd-instance.yml. It lists the tenant's "phorge"
# profile explicitly (created by the Tenant composition): the project's own default profile is empty.
# The root disk is overridden on the instance to apply spec.diskGiB.
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
    name: instance.phorge.fr
spec:
    compositeTypeRef:
        apiVersion: phorge.fr/v1alpha1
        kind: Instance
    mode: Pipeline
    pipeline:
        - step: render
          functionRef:
              name: function-go-templating
          input:
              apiVersion: gotemplating.fn.crossplane.io/v1beta1
              kind: GoTemplate
              source: Inline
              inline:
                  template: |
                      {{- /* Ready only when the managed resource is Ready AND Synced: a failing reconcile
                               (Synced=False) must not read as Ready because its last good state was. */ -}}
                      {{- define "ready" -}}
                      {{- $ready := false -}}
                      {{- $synced := true -}}
                      {{- range (dig "resource" "status" "conditions" (list) .) -}}
                      {{- if and (eq .type "Ready") (eq .status "True") -}}{{- $ready = true -}}{{- end -}}
                      {{- if and (eq .type "Synced") (ne .status "True") -}}{{- $synced = false -}}{{- end -}}
                      {{- end -}}
                      {{- if and $ready $synced -}}True{{- else -}}False{{- end -}}
                      {{- end -}}
                      {{- /* What is wrong with the composed resources, for status.problems. */ -}}
                      {{- $problems := list -}}
                      {{- range $rname, $res := (default (dict) .observed.resources) -}}
                      {{- range (dig "resource" "status" "conditions" (list) $res) -}}
                      {{- if and (or (eq .type "Ready") (eq .type "Synced")) (ne .status "True") -}}
                      {{- $problems = append $problems (printf "%s %s: %s" $rname .type (default "not ready" .message)) -}}
                      {{- end -}}
                      {{- end -}}
                      {{- end -}}
                      {{- $xr := .observed.composite.resource -}}
                      {{- if not (hasPrefix "t-" $xr.metadata.namespace) -}}
                      {{- fail (printf "an Instance belongs in a tenant namespace (t-<name>), not %q" $xr.metadata.namespace) -}}
                      {{- end -}}
                      {{- $name := $xr.metadata.name -}}
                      {{- $spec := $xr.spec -}}
                      {{- $obs := default (dict) .observed.resources -}}
                      {{- $inst := default (dict) (index $obs "instance") -}}
                      {{- $ud := "#cloud-config\nssh_authorized_keys:\n" -}}
                      {{- range $spec.sshPublicKeys }}{{ $ud = printf "%s  - %s\n" $ud . }}{{ end -}}
                      apiVersion: instance.incus.m.crossplane.io/v1alpha1
                      kind: Instance
                      metadata:
                        name: {{ $name }}
                        annotations:
                          gotemplating.fn.crossplane.io/composition-resource-name: instance
                          gotemplating.fn.crossplane.io/ready: "{{ template "ready" $inst }}"
                      spec:
                        forProvider:
                          project: {{ $xr.metadata.namespace }}
                          type: virtual-machine
                          running: {{ $spec.running }}
                          imageRef:
                            name: {{ $spec.imageRef.name }}
                          profiles:
                            - phorge
                          config:
                            security.nesting: {{ $spec.nesting | quote }}
                            security.secureboot: {{ $spec.secureBoot | quote }}
                            limits.cpu: {{ $spec.cpu | quote }}
                            limits.memory: {{ printf "%dMiB" (int $spec.memoryMiB) | quote }}
                            {{- if $spec.sshPublicKeys }}
                            cloud-init.user-data: {{ $ud | quote }}
                            {{- end }}
                          device:
                            - name: root
                              type: disk
                              properties:
                                path: /
                                pool: remote
                                size: {{ printf "%dGiB" (int $spec.diskGiB) | quote }}
                      ---
                      {{- /* The Image cannot be deleted while this Instance exists: Incus lets an image go even
                               when a VM was created from it, and the VM could then not be recreated. The Usage is
                               composed here so it goes away with the Instance. It is "by" the Incus Instance, not by
                               the phorge.fr Instance: that one is deleted in the foreground and waits for its
                               children, the Usage waits for its "by" to be gone, which would be a deadlock.
                               replayDeletion deletes the Image again once it is released, which a tenant teardown
                               relies on. */}}
                      apiVersion: protection.crossplane.io/v1beta1
                      kind: Usage
                      metadata:
                        name: {{ $name }}-uses-image
                        annotations:
                          gotemplating.fn.crossplane.io/composition-resource-name: image-usage
                          gotemplating.fn.crossplane.io/ready: "{{ template "ready" (default (dict) (index $obs "image-usage")) }}"
                      spec:
                        replayDeletion: true
                        reason: "Instance {{ $name }} was created from this image"
                        of:
                          apiVersion: phorge.fr/v1alpha1
                          kind: Image
                          resourceRef:
                            name: {{ $spec.imageRef.name }}
                        by:
                          apiVersion: instance.incus.m.crossplane.io/v1alpha1
                          kind: Instance
                          resourceRef:
                            name: {{ $name }}
                      ---
                      apiVersion: phorge.fr/v1alpha1
                      kind: Instance
                      status:
                        state: {{ dig "resource" "status" "atProvider" "status" "" $inst | quote }}
                        ipv4: {{ dig "resource" "status" "atProvider" "ipv4Address" "" $inst | quote }}
                        problems: {{ join " | " $problems | trunc 800 | quote }}
