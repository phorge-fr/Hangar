# Renders the Incus Instance of an Instance, see xrd-instance.yml.
#
# - Its size is a profile of the tenant (spec.profile: s, m, l, or one the user made), which carries the
#   CPU, the memory and the root disk, or custom values (spec.cpu, memoryMiB, diskGiB) that are set on the
#   instance itself, with the project's own empty "default" profile. The XRD refuses both and neither.
# - Its network devices are eth0, eth1, ... one per Network of the tenant (spec.networks, or the deprecated
#   spec.network, which is the same as a list of one): a tenant has no network of its own, so the instance is
#   unreachable until the user has deployed one. A Usage per Network keeps it while the instance exists.
# - Nesting, secure boot and the SSH keys are the instance's own when it says them, else its profile's (a Profile the user made
#   can carry them, see xrd-profile.yml), else a default (nesting off, secure boot on, no key). The XRD has no default for them,
#   so an absent field means "the instance did not say", and a false or an empty list means "the instance said".
#   An Incus instance takes the keys of its profile unless it has the key itself, so the composition writes on the Incus
#   Instance only what the instance says; and, when the profile is not one that can carry settings (s, m, l, none), the
#   default too, as it always did. The settings in force are in status.nesting, status.secureBoot and status.sshPublicKeys.
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
    name: instance.phorge.fr
spec:
    compositeTypeRef:
        apiVersion: phorge.fr/v1alpha1
        kind: Instance
    mode: Pipeline
    pipeline:
        - step: render
          functionRef:
              name: function-go-templating
          input:
              apiVersion: gotemplating.fn.crossplane.io/v1beta1
              kind: GoTemplate
              source: Inline
              inline:
                  template: |
                      {{- /* Ready only when the managed resource is Ready AND Synced: a failing reconcile
                               (Synced=False) must not read as Ready because its last good state was. */ -}}
                      {{- define "ready" -}}
                      {{- $ready := false -}}
                      {{- $synced := true -}}
                      {{- range (dig "resource" "status" "conditions" (list) .) -}}
                      {{- if and (eq .type "Ready") (eq .status "True") -}}{{- $ready = true -}}{{- end -}}
                      {{- if and (eq .type "Synced") (ne .status "True") -}}{{- $synced = false -}}{{- end -}}
                      {{- end -}}
                      {{- if and $ready $synced -}}True{{- else -}}False{{- end -}}
                      {{- end -}}
                      {{- /* What is wrong with the composed resources, for status.problems. */ -}}
                      {{- $problems := list -}}
                      {{- range $rname, $res := (default (dict) .observed.resources) -}}
                      {{- range (dig "resource" "status" "conditions" (list) $res) -}}
                      {{- if and (or (eq .type "Ready") (eq .type "Synced") (eq .type "LastAsyncOperation")) (ne .status "True") -}}
                      {{- $problems = append $problems (printf "%s %s: %s" $rname .type (default "not ready" .message)) -}}
                      {{- end -}}
                      {{- end -}}
                      {{- end -}}
                      {{- $xr := .observed.composite.resource -}}
                      {{- if not (hasPrefix "t-" $xr.metadata.namespace) -}}
                      {{- fail (printf "an Instance belongs in a tenant namespace (t-<name>), not %q" $xr.metadata.namespace) -}}
                      {{- end -}}
                      {{- /* The namespace must belong to a Tenant: the Tenant composition creates it, but a
                               namespace named t-<x> can also be created by hand, and the namespace is used as the
                               Incus project name and in OpenFGA objects. The Tenant is asked for through
                               ExtraResources; until it is resolved nothing is decided, once resolved an empty answer
                               refuses the object. */ -}}
                      {{- $tenantName := trimPrefix "t-" $xr.metadata.namespace -}}
                      {{- $found := default (dict) .extraResources -}}
                      {{- $tenantItems := list -}}
                      {{- if hasKey $found "tenant" -}}
                      {{- $tenantItems = dig "items" (list) (default (dict) (index $found "tenant")) -}}
                      {{- if not $tenantItems -}}
                      {{- fail (printf "namespace %q has no Tenant %q in phorge-system: create the Tenant first" $xr.metadata.namespace $tenantName) -}}
                      {{- end -}}
                      {{- end -}}
                      {{- $name := $xr.metadata.name -}}
                      {{- $spec := $xr.spec -}}
                      {{- $obs := default (dict) .observed.resources -}}
                      {{- $inst := default (dict) (index $obs "instance") -}}
                      {{- $nets := list -}}
                      {{- if $spec.networks }}{{ $nets = $spec.networks }}{{ else }}{{ $nets = list $spec.network }}{{ end -}}
                      {{- /* The settings of the profile, when it is a Profile the user made: s, m and l are Incus's own
                               objects created with the tenant and carry none, and a custom instance has the project's empty
                               default profile. The Profile is asked for through ExtraResources; unresolved or absent, the
                               profile says nothing. */ -}}
                      {{- $madeProfile := and $spec.profile (not (has $spec.profile (list "s" "m" "l" "default"))) -}}
                      {{- $profSpec := dict -}}
                      {{- if $madeProfile -}}
                      {{- $profItems := dig "items" (list) (default (dict) (index $found "profile")) -}}
                      {{- if $profItems -}}{{- $profSpec = dig "resource" "spec" (dict) (first $profItems) -}}{{- end -}}
                      {{- end -}}
                      {{- /* What the instance says, else its profile says, else the default. */ -}}
                      {{- $nesting := false -}}
                      {{- if hasKey $spec "nesting" }}{{ $nesting = $spec.nesting }}{{ else if hasKey $profSpec "nesting" }}{{ $nesting = $profSpec.nesting }}{{ end -}}
                      {{- $secureBoot := true -}}
                      {{- if hasKey $spec "secureBoot" }}{{ $secureBoot = $spec.secureBoot }}{{ else if hasKey $profSpec "secureBoot" }}{{ $secureBoot = $profSpec.secureBoot }}{{ end -}}
                      {{- $ownKeys := default (list) $spec.sshPublicKeys -}}
                      {{- $profKeys := default (list) (dig "sshPublicKeys" (list) $profSpec) -}}
                      {{- $keys := $profKeys -}}
                      {{- if hasKey $spec "sshPublicKeys" }}{{ $keys = $ownKeys }}{{ end -}}
                      {{- /* Keys of the instance replace the profile's. An instance that says "no key" while its profile
                               has some says it with an empty list in the user data. */ -}}
                      {{- $dropProfileKeys := and (hasKey $spec "sshPublicKeys") (not $ownKeys) $profKeys -}}
                      {{- /* With a profile the user made and nothing said, the Incus Instance has no config at all. */ -}}
                      {{- $hasConfig := or (not $madeProfile) (hasKey $spec "nesting") (hasKey $spec "secureBoot") $ownKeys $dropProfileKeys -}}
                      {{- $ud := "#cloud-config\nssh_authorized_keys:\n" -}}
                      {{- range $ownKeys }}{{ $ud = printf "%s  - %s\n" $ud (toJson .) }}{{ end -}}
                      apiVersion: meta.gotemplating.fn.crossplane.io/v1alpha1
                      kind: ExtraResources
                      requirements:
                        tenant:
                          apiVersion: phorge.fr/v1alpha1
                          kind: Tenant
                          matchName: {{ $tenantName }}
                          namespace: phorge-system
                        {{- if $madeProfile }}
                        profile:
                          apiVersion: phorge.fr/v1alpha1
                          kind: Profile
                          matchName: {{ $spec.profile }}
                          namespace: {{ $xr.metadata.namespace }}
                        {{- end }}
                      ---
                      apiVersion: instance.incus.m.crossplane.io/v1alpha1
                      kind: Instance
                      metadata:
                        name: {{ $name }}
                        annotations:
                          gotemplating.fn.crossplane.io/composition-resource-name: instance
                          gotemplating.fn.crossplane.io/ready: "{{ template "ready" $inst }}"
                      spec:
                        forProvider:
                          project: {{ $xr.metadata.namespace }}
                          type: virtual-machine
                          running: {{ $spec.running }}
                          imageRef:
                            name: {{ $spec.imageRef.name }}
                          profiles:
                            - {{ default "default" $spec.profile }}
                          {{- if $hasConfig }}
                          config:
                            {{- if or (hasKey $spec "nesting") (not $madeProfile) }}
                            security.nesting: {{ $nesting | quote }}
                            {{- end }}
                            {{- if or (hasKey $spec "secureBoot") (not $madeProfile) }}
                            security.secureboot: {{ $secureBoot | quote }}
                            {{- end }}
                            {{- if not $spec.profile }}
                            limits.cpu: {{ $spec.cpu | quote }}
                            limits.memory: {{ printf "%dMiB" (int $spec.memoryMiB) | quote }}
                            {{- end }}
                            {{- if $ownKeys }}
                            cloud-init.user-data: {{ $ud | quote }}
                            {{- else if $dropProfileKeys }}
                            cloud-init.user-data: "#cloud-config\nssh_authorized_keys: []\n"
                            {{- end }}
                          {{- end }}
                          device:
                            {{- if not $spec.profile }}
                            - name: root
                              type: disk
                              properties:
                                path: /
                                pool: remote
                                size: {{ printf "%dGiB" (int $spec.diskGiB) | quote }}
                            {{- end }}
                            {{- range $i, $n := $nets }}
                            - name: eth{{ $i }}
                              type: nic
                              properties:
                                network: {{ $n }}
                                name: eth{{ $i }}
                            {{- end }}
                      ---
                      {{- /* The Image cannot be deleted while this Instance exists: Incus lets an image go even
                               when a VM was created from it, and the VM could then not be recreated. The Usage is
                               composed here so it goes away with the Instance. It is "by" the Incus Instance, not by
                               the phorge.fr Instance: that one is deleted in the foreground and waits for its
                               children, the Usage waits for its "by" to be gone, which would be a deadlock.
                               replayDeletion deletes the Image again once it is released, which a tenant teardown
                               relies on. */}}
                      apiVersion: protection.crossplane.io/v1beta1
                      kind: Usage
                      metadata:
                        name: {{ $name }}-uses-image
                        annotations:
                          gotemplating.fn.crossplane.io/composition-resource-name: image-usage
                          gotemplating.fn.crossplane.io/ready: "{{ template "ready" (default (dict) (index $obs "image-usage")) }}"
                      spec:
                        replayDeletion: true
                        reason: "Instance {{ $name }} was created from this image"
                        of:
                          apiVersion: phorge.fr/v1alpha1
                          kind: Image
                          resourceRef:
                            name: {{ $spec.imageRef.name }}
                        by:
                          apiVersion: instance.incus.m.crossplane.io/v1alpha1
                          kind: Instance
                          resourceRef:
                            name: {{ $name }}
                      {{- /* A profile the user made cannot be deleted while this Instance uses it. The three profiles every tenant is
                               created with are Incus's own objects, there is no Profile to keep. */}}
                      {{- if and $spec.profile (not (has $spec.profile (list "s" "m" "l"))) }}
                      ---
                      apiVersion: protection.crossplane.io/v1beta1
                      kind: Usage
                      metadata:
                        name: {{ $name }}-uses-profile
                        annotations:
                          gotemplating.fn.crossplane.io/composition-resource-name: profile-usage
                          gotemplating.fn.crossplane.io/ready: "{{ template "ready" (default (dict) (index $obs "profile-usage")) }}"
                      spec:
                        replayDeletion: true
                        reason: "Instance {{ $name }} has this profile"
                        of:
                          apiVersion: phorge.fr/v1alpha1
                          kind: Profile
                          resourceRef:
                            name: {{ $spec.profile }}
                        by:
                          apiVersion: instance.incus.m.crossplane.io/v1alpha1
                          kind: Instance
                          resourceRef:
                            name: {{ $name }}
                      {{- end }}
                      {{- range $n := $nets }}
                      ---
                      apiVersion: protection.crossplane.io/v1beta1
                      kind: Usage
                      metadata:
                        name: {{ $name }}-uses-network-{{ $n }}
                        annotations:
                          gotemplating.fn.crossplane.io/composition-resource-name: network-usage-{{ $n }}
                          gotemplating.fn.crossplane.io/ready: "{{ template "ready" (default (dict) (index $obs (printf "network-usage-%s" $n))) }}"
                      spec:
                        replayDeletion: true
                        reason: "Instance {{ $name }} is attached to this network"
                        of:
                          apiVersion: phorge.fr/v1alpha1
                          kind: Network
                          resourceRef:
                            name: {{ $n }}
                        by:
                          apiVersion: instance.incus.m.crossplane.io/v1alpha1
                          kind: Instance
                          resourceRef:
                            name: {{ $name }}
                      {{- end }}
                      ---
                      {{- /* The namespace of the tenant waits for the Incus Instance: Kubernetes deletes the content of a
                               terminating namespace, ProviderConfigUsage objects included, and provider-incus cannot create
                               its own again to reach Incus (phorge-fr/Hangar#185). */}}
                      apiVersion: protection.crossplane.io/v1beta1
                      kind: Usage
                      metadata:
                        name: instance-{{ $name }}-keeps-namespace
                        annotations:
                          gotemplating.fn.crossplane.io/composition-resource-name: namespace-usage
                          gotemplating.fn.crossplane.io/ready: "{{ template "ready" (default (dict) (index $obs "namespace-usage")) }}"
                      spec:
                        replayDeletion: true
                        reason: "The Incus Instance {{ $name }} must be deleted before the namespace of the tenant"
                        of:
                          apiVersion: kubernetes.m.crossplane.io/v1alpha1
                          kind: Object
                          resourceRef:
                            name: {{ $xr.metadata.namespace }}
                            namespace: phorge-system
                        by:
                          apiVersion: instance.incus.m.crossplane.io/v1alpha1
                          kind: Instance
                          resourceRef:
                            name: {{ $name }}
                      ---
                      apiVersion: phorge.fr/v1alpha1
                      kind: Instance
                      status:
                        state: {{ dig "resource" "status" "atProvider" "status" "" $inst | quote }}
                        nesting: {{ $nesting }}
                        secureBoot: {{ $secureBoot }}
                        sshPublicKeys: {{ toJson $keys }}
                        ipv4: {{ dig "resource" "status" "atProvider" "ipv4Address" "" $inst | quote }}
                        networks:
                        {{- range $i, $n := $nets }}
                        {{- $v4 := "" }}{{ $v6 := "" }}
                        {{- range (dig "resource" "status" "atProvider" "interfaces" (printf "eth%d" $i) "ipAddresses" (list) $inst) }}
                        {{- if and (eq .scope "global") (eq .family "inet") (not $v4) }}{{ $v4 = .address }}{{ end }}
                        {{- if and (eq .scope "global") (eq .family "inet6") (not $v6) }}{{ $v6 = .address }}{{ end }}
                        {{- end }}
                          - network: {{ $n }}
                            ipv4: {{ $v4 | quote }}
                            ipv6: {{ $v6 | quote }}
                        {{- end }}
                        problems: {{ join " | " $problems | trunc 800 | quote }}
