# Renders the Incus Image of an Image, see xrd-image.yml. The project is the namespace's own name:
# a tenant "demo" is the namespace "t-demo" and the Incus project "t-demo".
#
# The Usage keeps the tenant's namespace while the Incus Image exists. The namespace is composed by the
# Tenant (an Object) and Kubernetes deletes its content when it terminates, ProviderConfigUsage objects
# included: provider-incus must create its own again to reach Incus, which a terminating namespace
# refuses, so an Incus Image still there is never deleted (phorge-fr/Hangar#185). With the Usage the
# Tenant waits in "Deleting" until its images are deleted, then the namespace goes. It does not delete
# them: the API deletes the children first, see docs/reference/phorge-api-kinds.md.
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
    name: image.phorge.fr
spec:
    compositeTypeRef:
        apiVersion: phorge.fr/v1alpha1
        kind: Image
    mode: Pipeline
    pipeline:
        - step: render
          functionRef:
              name: function-go-templating
          input:
              apiVersion: gotemplating.fn.crossplane.io/v1beta1
              kind: GoTemplate
              source: Inline
              inline:
                  template: |
                      {{- /* Ready only when the managed resource is Ready AND Synced: a failing reconcile
                               (Synced=False) must not read as Ready because its last good state was. */ -}}
                      {{- define "ready" -}}
                      {{- $ready := false -}}
                      {{- $synced := true -}}
                      {{- range (dig "resource" "status" "conditions" (list) .) -}}
                      {{- if and (eq .type "Ready") (eq .status "True") -}}{{- $ready = true -}}{{- end -}}
                      {{- if and (eq .type "Synced") (ne .status "True") -}}{{- $synced = false -}}{{- end -}}
                      {{- end -}}
                      {{- if and $ready $synced -}}True{{- else -}}False{{- end -}}
                      {{- end -}}
                      {{- /* What is wrong with the composed resources, for status.problems. */ -}}
                      {{- $problems := list -}}
                      {{- range $rname, $res := (default (dict) .observed.resources) -}}
                      {{- range (dig "resource" "status" "conditions" (list) $res) -}}
                      {{- if and (or (eq .type "Ready") (eq .type "Synced") (eq .type "LastAsyncOperation")) (ne .status "True") -}}
                      {{- $problems = append $problems (printf "%s %s: %s" $rname .type (default "not ready" .message)) -}}
                      {{- end -}}
                      {{- end -}}
                      {{- end -}}
                      {{- $xr := .observed.composite.resource -}}
                      {{- if not (hasPrefix "t-" $xr.metadata.namespace) -}}
                      {{- fail (printf "an Image belongs in a tenant namespace (t-<name>), not %q" $xr.metadata.namespace) -}}
                      {{- end -}}
                      {{- /* The namespace must belong to a Tenant: the Tenant composition creates it, but a
                               namespace named t-<x> can also be created by hand, and the namespace is used as the
                               Incus project name and in OpenFGA objects. The Tenant is asked for through
                               ExtraResources; until it is resolved nothing is decided, once resolved an empty answer
                               refuses the object. */ -}}
                      {{- $tenantName := trimPrefix "t-" $xr.metadata.namespace -}}
                      {{- $found := default (dict) .extraResources -}}
                      {{- $tenantItems := list -}}
                      {{- if hasKey $found "tenant" -}}
                      {{- $tenantItems = dig "items" (list) (default (dict) (index $found "tenant")) -}}
                      {{- if not $tenantItems -}}
                      {{- fail (printf "namespace %q has no Tenant %q in phorge-system: create the Tenant first" $xr.metadata.namespace $tenantName) -}}
                      {{- end -}}
                      {{- end -}}
                      {{- $name := $xr.metadata.name -}}
                      {{- $src := $xr.spec.source -}}
                      {{- $obs := default (dict) .observed.resources -}}
                      {{- $img := default (dict) (index $obs "image") -}}
                      apiVersion: meta.gotemplating.fn.crossplane.io/v1alpha1
                      kind: ExtraResources
                      requirements:
                        tenant:
                          apiVersion: phorge.fr/v1alpha1
                          kind: Tenant
                          matchName: {{ $tenantName }}
                          namespace: phorge-system
                      ---
                      apiVersion: image.incus.m.crossplane.io/v1alpha1
                      kind: Image
                      metadata:
                        name: {{ $name }}
                        annotations:
                          gotemplating.fn.crossplane.io/composition-resource-name: image
                          gotemplating.fn.crossplane.io/ready: "{{ template "ready" $img }}"
                      spec:
                        forProvider:
                          project: {{ $xr.metadata.namespace }}
                          sourceImage:
                            remote: {{ $src.remote }}
                            name: {{ $src.name }}
                            type: {{ $src.type }}
                            {{- if $src.architecture }}
                            architecture: {{ $src.architecture }}
                            {{- end }}
                          {{- if $xr.spec.aliases }}
                          alias:
                            {{- range $xr.spec.aliases }}
                            - name: {{ . | quote }}
                            {{- end }}
                          {{- end }}
                      ---
                      apiVersion: protection.crossplane.io/v1beta1
                      kind: Usage
                      metadata:
                        name: image-{{ $name }}-keeps-namespace
                        annotations:
                          gotemplating.fn.crossplane.io/composition-resource-name: namespace-usage
                          gotemplating.fn.crossplane.io/ready: "{{ template "ready" (default (dict) (index $obs "namespace-usage")) }}"
                      spec:
                        replayDeletion: true
                        reason: "The Incus Image {{ $name }} must be deleted before the namespace of the tenant"
                        of:
                          apiVersion: kubernetes.m.crossplane.io/v1alpha1
                          kind: Object
                          resourceRef:
                            name: {{ $xr.metadata.namespace }}
                            namespace: phorge-system
                        by:
                          apiVersion: image.incus.m.crossplane.io/v1alpha1
                          kind: Image
                          resourceRef:
                            name: {{ $name }}
                      ---
                      apiVersion: phorge.fr/v1alpha1
                      kind: Image
                      status:
                        fingerprint: {{ dig "resource" "status" "atProvider" "fingerprint" "" $img | quote }}
                        problems: {{ join " | " $problems | trunc 800 | quote }}
