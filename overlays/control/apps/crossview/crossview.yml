# Crossview, a read-only web view of the Crossplane objects of this cluster (XRDs, compositions, claims, managed
# resources). Internal only: the single entry point is the Ingress of traefik-local, at crossview.control.phorge.
# No PostgreSQL: people sign in through authentik (blueprint-crossview.yml, core), which the chart supports with
# the database off. Everything Crossview shows comes from the cluster, nothing is stored.
#
# The chart's own ClusterRole grants get/list/watch on every resource of every API group, Secrets included, and it
# cannot be narrowed through values (a wildcard cannot exclude Secrets). It is turned off (rbac.create: false) and
# replaced below by crossview-read: the Crossplane and phorge.fr API groups, the CRDs and a few core resources, never
# Secrets. A provider that adds an API group needs the group added to crossview-read, or Crossview does not show it.
# Sign-in is also limited to the authentik group crossview-users.
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
    name: crossview
    namespace: crossview
spec:
    interval: 24h
    url: https://crossplane-contrib.github.io/crossview
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
    name: crossview
    namespace: crossview
spec:
    interval: 30m
    chart:
        spec:
            chart: crossview
            version: 4.7.0
            sourceRef:
                kind: HelmRepository
                name: crossview
            interval: 12h
    values:
        rbac:
            create: false
        database:
            enabled: false
        config:
            database:
                enabled: false
            server:
                auth:
                    mode: session
                # Where the browser lands after the sign-in, and the public root URL of this instance.
                cors:
                    origin: https://crossview.control.phorge
            sso:
                oidc:
                    enabled: true
                    issuer: https://auth.phorge.fr/application/o/crossview/
                    clientId: 9cfce95d-f0a5-4965-986a-56711b883d8c
                    callbackURL: https://crossview.control.phorge/api/auth/oidc/callback
                    providerName: Phorge
        secrets:
            sessionSecret:
                secretKeyRef:
                    name: crossview-auth
                    key: session-secret
            OIDCClientSecret:
                secretKeyRef:
                    name: crossview-auth
                    key: oidc-client-secret
---
# Read-only view of what Crossview shows. No Secrets: whoever signs in to Crossview cannot read them.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
    name: crossview-read
rules:
    - apiGroups: [""]
      resources: [namespaces, pods, services, configmaps, events, nodes, persistentvolumes, persistentvolumeclaims]
      verbs: [get, list, watch]
    - apiGroups:
          - apiextensions.crossplane.io
          - apiextensions.k8s.io
          - ops.crossplane.io
          - pkg.crossplane.io
          - protection.crossplane.io
          - phorge.fr
          - cluster.incus.crossplane.io
          - cluster.incus.m.crossplane.io
          - http.crossplane.io
          - http.m.crossplane.io
          - image.incus.crossplane.io
          - image.incus.m.crossplane.io
          - incus.crossplane.io
          - incus.m.crossplane.io
          - instance.incus.crossplane.io
          - instance.incus.m.crossplane.io
          - kubernetes.crossplane.io
          - kubernetes.m.crossplane.io
          - model.openfga.crossplane.io
          - model.openfga.m.crossplane.io
          - network.incus.crossplane.io
          - network.incus.m.crossplane.io
          - openfga.crossplane.io
          - openfga.m.crossplane.io
          - profile.incus.crossplane.io
          - profile.incus.m.crossplane.io
          - project.incus.crossplane.io
          - project.incus.m.crossplane.io
          - storage.incus.crossplane.io
          - storage.incus.m.crossplane.io
          - store.openfga.crossplane.io
          - store.openfga.m.crossplane.io
          - tuple.openfga.crossplane.io
          - tuple.openfga.m.crossplane.io
      resources: ["*"]
      verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
    name: crossview-read
roleRef:
    apiGroup: rbac.authorization.k8s.io
    kind: ClusterRole
    name: crossview-read
subjects:
    - kind: ServiceAccount
      name: crossview-sa
      namespace: crossview
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
    name: crossview
    namespace: crossview
    annotations:
        cert-manager.io/cluster-issuer: local-issuer
        cert-manager.io/common-name: crossview.control.phorge
spec:
    ingressClassName: traefik-local
    tls:
        - hosts:
              - crossview.control.phorge
          secretName: crossview-tls
    rules:
        - host: crossview.control.phorge
          http:
              paths:
                  - path: /
                    pathType: Prefix
                    backend:
                        service:
                            name: crossview-service
                            port:
                                number: 80
