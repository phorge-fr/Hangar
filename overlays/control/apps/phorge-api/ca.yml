# certificates, among them openfga.core.phorge. A pod does not trust it by default: the Phorge API mounts this
# ConfigMap and adds it to its trusted roots to call OpenFGA with TLS verification on. Public data, not a secret.
# Valid until 2036-06-28. Refresh it from the ca.crt key of the Secret openfga-tls (core) if the CA is ever replaced.
