# The Phorge API (phorge-fr/phorge-api): a REST API that creates, reads and deletes the phorge.fr objects of this cluster,
# which Crossplane turns into Incus and OpenFGA objects (docs/phorge-api.md). It keeps nothing: tenants, images, instances,
# memberships and API keys are Kubernetes objects, and what a caller may do is decided by OpenFGA.
#
# Configuration is the environment. Nothing in it is secret except the OpenFGA key, which is the Secret phorge-api-openfga
# (secrets.yml). The Authentik client id is public (the application is a public client, blueprint-phorge-api.yml).
apiVersion: apps/v1
kind: Deployment
metadata:
    name: phorge-api
    namespace: phorge-api
spec:
    replicas: 2
    selector:
        matchLabels:
            app.kubernetes.io/name: phorge-api
    strategy:
        type: RollingUpdate
        rollingUpdate:
            maxUnavailable: 0
            maxSurge: 1
    template:
        metadata:
            labels:
                app.kubernetes.io/name: phorge-api
        spec:
            serviceAccountName: phorge-api
            securityContext:
                runAsNonRoot: true
                runAsUser: 65532
                runAsGroup: 65532
                seccompProfile:
                    type: RuntimeDefault
            # The server fails /readyz for 5 s before it closes the listener, then drains for up to 15 s.
            terminationGracePeriodSeconds: 30
            topologySpreadConstraints:
                - maxSkew: 1
                  topologyKey: kubernetes.io/hostname
                  whenUnsatisfiable: ScheduleAnyway
                  labelSelector:
                      matchLabels:
                          app.kubernetes.io/name: phorge-api
            containers:
                - name: phorge-api
                  # The commit f12ffbd of phorge-fr/phorge-api (docker workflow, tag sha-f12ffbd), by digest so that the tag cannot move.
                  image: ghcr.io/phorge-fr/phorge-api@sha256:4dd3b780e074947740d5f0d3010dfd45060f1cf262e6919cfbcf40828daf3d72
                  imagePullPolicy: IfNotPresent
                  ports:
                      - name: http
                        containerPort: 8080
                  env:
                      - name: LISTEN_ADDR
                        value: ":8080"
                      - name: OIDC_ISSUER
                        value: https://auth.phorge.fr/application/o/phorge/
                      - name: OIDC_AUDIENCE
                        value: 49a1375b-c52a-4a59-b3cb-8d4f5e392d85
                      - name: OPENFGA_URL
                        value: https://openfga.core.phorge
                      - name: OPENFGA_STORE_ID
                        value: 01M50R0P12MY8JHNKP3ATYSJC2
                      - name: OPENFGA_API_KEY
                        valueFrom:
                            secretKeyRef:
                                name: phorge-api-openfga
                                key: apiKey
                      # openfga.core.phorge is signed by the internal CA, which a pod does not trust by default.
                      - name: CA_FILE
                        value: /etc/phorge-api/ca/ca.crt
                      # Whoever is a member of this Authentik group (the "groups" claim of the token) may create, resize and
                      # delete tenants. The group is created by blueprint-phorge-api.yml, its members are added in authentik.
                      - name: PLATFORM_ADMIN_GROUP
                        value: phorge-platform-admins
                      # The container limit is 192 MiB: make the GC reclaim before it is reached.
                      - name: GOMEMLIMIT
                        value: 150MiB
                  volumeMounts:
                      - name: ca
                        mountPath: /etc/phorge-api/ca
                        readOnly: true
                  readinessProbe:
                      httpGet:
                          path: /readyz
                          port: http
                      periodSeconds: 5
                      timeoutSeconds: 2
                  livenessProbe:
                      httpGet:
                          path: /healthz
                          port: http
                      periodSeconds: 10
                      timeoutSeconds: 2
                      failureThreshold: 3
                  resources:
                      requests:
                          cpu: 20m
                          memory: 48Mi
                      limits:
                          memory: 192Mi
                  securityContext:
                      allowPrivilegeEscalation: false
                      readOnlyRootFilesystem: true
                      capabilities:
                          drop:
                              - ALL
            volumes:
                - name: ca
                  configMap:
                      name: phorge-api-ca
                      items:
                          - key: ca.crt
                            path: ca.crt
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
    name: phorge-api
    namespace: phorge-api
spec:
    maxUnavailable: 1
    selector:
        matchLabels:
            app.kubernetes.io/name: phorge-api
