# Public, through the edge HAProxy: api.phorge.fr is routed by SNI to the control ingress (traefik-public, 10.1.0.11), as
# is every host the HAProxy does not know. The host is listed in the Network repository (templates/haproxy.cfg.tftpl). The
# certificate comes from cert-manager with the HTTP-01 challenge through the same path.
#
# Only the API, its OpenAPI document and its Swagger UI are routed. /metrics, /healthz and /readyz stay inside the cluster:
# Alloy scrapes the pods directly (podmonitor.yml) and the kubelet probes them.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
    name: phorge-api
    namespace: phorge-api
    annotations:
        cert-manager.io/cluster-issuer: public-issuer
spec:
    ingressClassName: traefik-public
    tls:
        - hosts:
              - api.phorge.fr
          secretName: phorge-api-tls
    rules:
        - host: api.phorge.fr
          http:
              paths:
                  - path: /v1
                    pathType: Prefix
                    backend: &backend
                        service:
                            name: phorge-api
                            port:
                                name: http
                  - path: /openapi.yaml
                    pathType: Exact
                    backend: *backend
                  - path: /docs
                    pathType: Prefix
                    backend: *backend
