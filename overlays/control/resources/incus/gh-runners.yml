# A tenant dedicated to GitHub Actions self-hosted runners: VM-only (limits.containers=0), its own
# OVN network. Scaling runners is meant to be "create another Instance using the gh-runner profile"
# - nothing here is tied to a specific runner count.
apiVersion: project.incus.crossplane.io/v1alpha1
kind: Project
metadata:
    name: gh-runners
    annotations:
        crossplane.io/external-name: gh-runners
spec:
    forProvider:
        description: "GitHub Actions self-hosted runners"
        config:
            limits.containers: "0"
            features.networks: "true"
    providerConfigRef:
        name: default
---
apiVersion: network.incus.crossplane.io/v1alpha1
kind: Network
metadata:
    name: gh-runners
spec:
    forProvider:
        name: gh-runners
        type: ovn
        config:
            network: UPLINK
        projectRef:
            name: gh-runners
    providerConfigRef:
        name: default
---
# Profile for GitHub Actions self-hosted runners: 2 vCPU, 2 GiB RAM, 64 GiB root disk, 1 NIC on
# the dedicated gh-runners OVN network. Scaling is meant to be "create another Instance using this
# profile and images:alpine/edge/cloud" - nothing instance-specific lives here.
#
# cloud-init.vendor-data (static, shared by every runner) vs cloud-init.user-data (per-instance,
# set on the Instance itself, not here - see gh-runner-instance.yml.example): Incus merges the two
# at boot. Deliberately no "runcmd" in this vendor-data - cloud-init's default list merge strategy
# REPLACES lists rather than appending them, so if both vendor-data and user-data defined "runcmd"
# the instance's would silently wipe this one instead of running after it. Packages/write_files are
# dicts/have no such collision, kept here; the one and only "runcmd" lives entirely in user-data.
#
# NOT fully wired yet, two things to sort out before an instance using this actually registers a
# runner (see gh-runner-instance.yml.example for the missing piece and more detail):
#
# 1. github-act-runner, not the official actions/runner: the official one is .NET-based and known
#    broken on musl/Alpine - actions/runner#801 (never supported) and actions/runner#3852 (musl
#    detection in the Node-based actions it shells out to fails: "exec ... node: no such file or
#    directory", the dynamic linker path glibc actions expect doesn't exist on musl). github-act-runner
#    (github.com/ChristopherHX/github-act-runner, packaged for Alpine) is a Go reimplementation with
#    no such dependency - but it does mean the workflows that run here need to tolerate a non-official
#    runner (shell/container-based steps are fine, actions that assume a glibc Node toolchain on the
#    host may not be).
# 2. The registration token has nowhere safe to come from yet. Registration tokens expire in about an
#    hour, so baking a real one into a committed user-data would go stale immediately - this needs a
#    real design (fetched at boot from somewhere that isn't this git repo, e.g. a small script calling
#    the GitHub API with a fine-grained PAT) before this is usable unattended.
#
# NOT verified live (unlike the rest of this repo's Crossplane resources): no real registration token
# was available to test an actual runner coming online.
apiVersion: profile.incus.crossplane.io/v1alpha1
kind: Profile
metadata:
    name: gh-runner
    annotations:
        crossplane.io/external-name: gh-runner
spec:
    forProvider:
        config:
            limits.cpu: "2"
            limits.memory: "2GiB"
            security.secureboot: "false"
            cloud-init.vendor-data: |
                #cloud-config
                package_update: true
                packages:
                    - github-act-runner
                write_files:
                    - path: /etc/init.d/gh-runner
                      permissions: '0755'
                      content: |
                          #!/sbin/openrc-run
                          name="gh-runner"
                          description="GitHub Actions self-hosted runner (github-act-runner)"
                          command="/usr/bin/github-act-runner"
                          command_args="run"
                          command_background=true
                          command_user="ghrunner"
                          directory="/home/ghrunner"
                          pidfile="/run/gh-runner.pid"
                          output_log="/var/log/gh-runner.log"
                          error_log="/var/log/gh-runner.log"
                          depend() {
                              need net
                              after firewall
                          }
        device:
            - name: root
              type: disk
              properties:
                  pool: remote
                  path: /
                  size: 64GiB
            - name: eth0
              type: nic
              properties:
                  network: gh-runners
        projectRef:
            name: gh-runners
    providerConfigRef:
        name: default
