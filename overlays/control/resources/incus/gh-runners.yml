apiVersion: profile.incus.m.crossplane.io/v1alpha1
kind: Profile
metadata:
    name: gh-runner
    namespace: iaas-gh-runners
    annotations:
        crossplane.io/external-name: gh-runner
spec:
    forProvider:
        description: crossplane;;; GitHub Actions self-hosted runners
        config:
            limits.cpu: "2"
            limits.memory: 2GiB
            security.secureboot: "false"
            cloud-init.network-config: |
                version: 2
                ethernets:
                    enp5s0:
                        dhcp4: true
                        mtu: 1442
            cloud-init.vendor-data: |
                #cloud-config
                package_update: true
                packages:
                    - curl
                    - tar
                    - liblttng-ust1t64
                    - libicu76
                write_files:
                    - path: /opt/install-runner.sh
                      permissions: '0755'
                      content: |
                          #!/bin/bash
                          set -euo pipefail
                          mkdir -p /opt/actions-runner
                          cd /opt/actions-runner
                          curl -fsSL -o runner.tar.gz \
                              https://github.com/actions/runner/releases/download/v2.337.0/actions-runner-linux-x64-2.337.0.tar.gz
                          tar xzf runner.tar.gz
                          rm runner.tar.gz
                          ./bin/installdependencies.sh
                runcmd:
                    - /opt/install-runner.sh
        device:
            - name: root
              type: disk
              properties:
                pool: remote
                path: /
                size: 64GiB
            - name: eth0
              type: nic
              properties:
                network: gh-runners
        projectRef:
            name: gh-runners
    providerConfigRef:
        kind: ClusterProviderConfig
        name: default
