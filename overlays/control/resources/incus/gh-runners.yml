apiVersion: v1
kind: Namespace
metadata:
    name: iaas-gh-runners
---
apiVersion: project.incus.m.crossplane.io/v1alpha1
kind: Project
metadata:
    name: gh-runners
    namespace: iaas-gh-runners
    annotations:
        crossplane.io/external-name: gh-runners
spec:
    forProvider:
        description: "crossplane;;; GitHub Actions self-hosted runners"
        config:
            limits.containers: "0"
            features.networks: "true"
    providerConfigRef:
        kind: ClusterProviderConfig
        name: default
---
apiVersion: network.incus.m.crossplane.io/v1alpha1
kind: Network
metadata:
    name: gh-runners
    namespace: iaas-gh-runners
spec:
    forProvider:
        name: gh-runners
        type: ovn
        description: "crossplane;;; GitHub Actions self-hosted runners"
        config:
            network: UPLINK
        projectRef:
            name: gh-runners
    providerConfigRef:
        kind: ClusterProviderConfig
        name: default
---
apiVersion: profile.incus.m.crossplane.io/v1alpha1
kind: Profile
metadata:
    name: gh-runner
    namespace: iaas-gh-runners
    annotations:
        crossplane.io/external-name: gh-runner
spec:
    forProvider:
        description: "crossplane;;; GitHub Actions self-hosted runners"
        config:
            limits.cpu: "2"
            limits.memory: "2GiB"
            security.secureboot: "false"
            cloud-init.vendor-data: |
                #cloud-config
                package_update: true
                packages:
                    - curl
                    - tar
                    - liblttng-ust1
                    - libicu72
                write_files:
                    - path: /opt/install-runner.sh
                      permissions: '0755'
                      content: |
                          #!/bin/bash
                          set -euo pipefail
                          mkdir -p /opt/actions-runner
                          cd /opt/actions-runner
                          curl -fsSL -o runner.tar.gz \
                              https://github.com/actions/runner/releases/download/v2.337.0/actions-runner-linux-x64-2.337.0.tar.gz
                          tar xzf runner.tar.gz
                          rm runner.tar.gz
                          ./bin/installdependencies.sh
                runcmd:
                    - /opt/install-runner.sh
        device:
            - name: root
              type: disk
              properties:
                  pool: remote
                  path: /
                  size: 64GiB
            - name: eth0
              type: nic
              properties:
                  network: gh-runners
        projectRef:
            name: gh-runners
    providerConfigRef:
        kind: ClusterProviderConfig
        name: default
