apiVersion: v1
kind: ConfigMap
metadata:
    name: k8s-audit-dashboard
    namespace: kube-prometheus-stack
    annotations:
        grafana_folder: "Core"
    labels:
        grafana_dashboard: "1"
data:
    k8s-audit.json: |
        {
          "uid": "k8s-audit",
          "title": "Kubernetes audit",
          "description": "Audit log of the API server of every cluster (control, core, svc): who did what to which object, from where, with which result. Read from the JSON file that kube-apiserver writes on each control plane node (/var/lib/k0s-audit/audit.log) and Alloy ships to Loki ({job=\"k8s-audit\"}). The policy is clusters/audit-policy.yaml: secrets and configmaps are logged without their content, the routine traffic of kubelets and controllers is left out. See docs/kubernetes-audit.md and docs/gdpr.md.",
          "tags": [
            "kubernetes",
            "audit",
            "logs",
            "security"
          ],
          "schemaVersion": 39,
          "version": 1,
          "editable": true,
          "graphTooltip": 1,
          "refresh": "1m",
          "time": {
            "from": "now-24h",
            "to": "now"
          },
          "timezone": "browser",
          "templating": {
            "list": [
              {
                "name": "cluster",
                "label": "Cluster",
                "type": "query",
                "datasource": {
                  "type": "loki",
                  "uid": "loki"
                },
                "query": {
                  "query": "label_values({job=\"k8s-audit\"}, cluster)",
                  "refId": "LokiVar"
                },
                "definition": "label_values({job=\"k8s-audit\"}, cluster)",
                "includeAll": true,
                "multi": true,
                "allValue": ".*",
                "refresh": 2,
                "sort": 1,
                "current": {
                  "selected": true,
                  "text": [
                    "All"
                  ],
                  "value": [
                    "$__all"
                  ]
                }
              },
              {
                "name": "user",
                "label": "User (regex)",
                "type": "textbox",
                "query": ".*",
                "current": {
                  "text": ".*",
                  "value": ".*"
                },
                "hide": 0
              }
            ]
          },
          "annotations": {
            "list": []
          },
          "links": [],
          "panels": [
            {
              "id": 1,
              "type": "row",
              "title": "What happened",
              "collapsed": false,
              "gridPos": {
                "h": 1,
                "w": 24,
                "x": 0,
                "y": 0
              },
              "panels": []
            },
            {
              "id": 2,
              "type": "stat",
              "title": "Events",
              "datasource": {
                "type": "loki",
                "uid": "loki"
              },
              "gridPos": {
                "h": 4,
                "w": 4,
                "x": 0,
                "y": 1
              },
              "targets": [
                {
                  "refId": "A",
                  "datasource": {
                    "type": "loki",
                    "uid": "loki"
                  },
                  "expr": "sum(count_over_time({job=\"k8s-audit\", cluster=~\"$cluster\"} | json | user_username=~\"$user\" [$__range]))",
                  "queryType": "instant",
                  "instant": true
                }
              ],
              "fieldConfig": {
                "defaults": {
                  "noValue": "0",
                  "unit": "none",
                  "thresholds": {
                    "mode": "absolute",
                    "steps": [
                      {
                        "color": "green",
                        "value": null
                      }
                    ]
                  }
                },
                "overrides": []
              },
              "options": {
                "colorMode": "background",
                "graphMode": "none",
                "textMode": "value",
                "justifyMode": "center",
                "reduceOptions": {
                  "calcs": [
                    "lastNotNull"
                  ],
                  "fields": "",
                  "values": false
                }
              },
              "description": "Requests recorded by the API server of the selected clusters, as the audit policy lets them through (clusters/audit-policy.yaml): no health checks, no kubelets, no routine reads by the applications."
            },
            {
              "id": 3,
              "type": "stat",
              "title": "Changes",
              "datasource": {
                "type": "loki",
                "uid": "loki"
              },
              "gridPos": {
                "h": 4,
                "w": 4,
                "x": 4,
                "y": 1
              },
              "targets": [
                {
                  "refId": "A",
                  "datasource": {
                    "type": "loki",
                    "uid": "loki"
                  },
                  "expr": "sum(count_over_time({job=\"k8s-audit\", cluster=~\"$cluster\"} | json | user_username=~\"$user\" | verb=~\"create|update|patch|delete|deletecollection\" [$__range]))",
                  "queryType": "instant",
                  "instant": true
                }
              ],
              "fieldConfig": {
                "defaults": {
                  "noValue": "0",
                  "unit": "none",
                  "thresholds": {
                    "mode": "absolute",
                    "steps": [
                      {
                        "color": "green",
                        "value": null
                      }
                    ]
                  }
                },
                "overrides": []
              },
              "options": {
                "colorMode": "background",
                "graphMode": "none",
                "textMode": "value",
                "justifyMode": "center",
                "reduceOptions": {
                  "calcs": [
                    "lastNotNull"
                  ],
                  "fields": "",
                  "values": false
                }
              },
              "description": "create, update, patch and delete."
            },
            {
              "id": 4,
              "type": "stat",
              "title": "Refused (401/403)",
              "datasource": {
                "type": "loki",
                "uid": "loki"
