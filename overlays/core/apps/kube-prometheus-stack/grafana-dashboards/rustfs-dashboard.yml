# RustFS (S3-compatible object store on stor-rpi5-01, the Longhorn/Forgejo backup target).
#
# Adapted from RustFS's own dashboard (github.com/rustfs/rustfs, .docker/observability/grafana/dashboards/rustfs.json,
# schemaVersion 42/version 16 at the time): checked every one of its 142 panels against what this exporter actually
# serves (358 series, 2026-10-03). Only ~14 transplant as-is (uptime, bucket size/objects, CPU, memory, host network,
# process disk I/O, replication, object lock). The other ~128 need metrics this build does not export: S3 operation
# counters (rustfs_s3_*, rustfs_http_server_*), compression, the scanner, the log cleaner, the bytes pool, and a
# rustfs:storage:current/rustfs:storage_snapshot:fresh recording-rule pair with collection_scope/observer/source_metric
# labels that RustFS's own Prometheus rules file would need to generate it - not deployed here. Re-check the upstream
# file if the image version or rustfs_config changes and more of that instrumentation turns up live.
#
# The remaining panels (capacity, drive and erasure set health, per-bucket size) are hand-written against the
# metrics this exporter actually has, since the upstream equivalents all depend on that missing recording-rule set.
# stor-rpi5-01 has one RustFS "drive" (/data, the RAID array) and one erasure set (pool 0, set 0): multi-drive panels
# will need revisiting if that changes.
apiVersion: v1
kind: ConfigMap
metadata:
    name: rustfs-dashboard
    namespace: kube-prometheus-stack
    annotations:
        grafana_folder: "Storage"
    labels:
        grafana_dashboard: "1"
