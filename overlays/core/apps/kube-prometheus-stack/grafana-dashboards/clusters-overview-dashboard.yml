                "defaults": {
                  "unit": "percent",
                  "min": 0,
                  "custom": {
                    "fillOpacity": 10,
                    "lineWidth": 2,
                    "showPoints": "never"
                  }
                },
                "overrides": []
              },
              "options": {
                "legend": {
                  "displayMode": "list",
                  "placement": "bottom"
