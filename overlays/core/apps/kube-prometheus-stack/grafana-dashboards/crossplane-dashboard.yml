# Crossplane core and its providers (control only, today just provider-incus): managed resource
# state, controller reconcile health, work queues, and (provider-incus is Upjet-based) the
# Terraform CLI subprocess calls behind every resource - the exact signal that would have shown
# Hangar#95/#124's 10-minute poll interval directly, instead of needing to read the provider's
# source and compare timestamps by hand.
#
# Scraped via a PodMonitor (overlays/control/controllers/crossplane/provider-incus-podmonitor.yml):
# the provider's own Service is Crossplane-managed and only exposes its webhook port, so a
# ServiceMonitor was not an option. Crossplane core itself is not scraped yet (Hangar#125).
apiVersion: v1
kind: ConfigMap
metadata:
    name: crossplane-dashboard
    namespace: kube-prometheus-stack
    annotations:
        grafana_folder: "Cluster health"
    labels:
        grafana_dashboard: "1"
data:
    crossplane.json: |
        {
          "uid": "crossplane",
          "title": "Crossplane",
          "description": "State of Crossplane's managed resources and health of Crossplane core and its providers, on control (the only cluster running Crossplane today). Mirrors the Flux dashboard's layout. Panels under Managed resources/Upjet show no data until at least one managed resource has been reconciled at least once in the current process lifetime - these are client-side metrics with no series until first use, not a scrape problem.",
          "tags": [
            "crossplane"
          ],
          "schemaVersion": 39,
          "version": 1,
          "editable": true,
          "graphTooltip": 1,
          "refresh": "1m",
          "time": {
            "from": "now-6h",
            "to": "now"
          },
          "timezone": "browser",
          "annotations": {
            "list": []
          },
          "links": [],
          "panels": [
            {
              "id": 1,
              "type": "row",
              "title": "Overview",
              "gridPos": {
                "h": 1,
                "w": 24,
                "x": 0,
                "y": 0
              },
              "collapsed": false,
              "panels": []
            },
            {
              "id": 2,
              "type": "stat",
              "title": "Crossplane core reconcile errors (1h)",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "gridPos": {
                "h": 4,
                "w": 6,
                "x": 0,
                "y": 1
              },
              "targets": [
                {
                  "refId": "A",
                  "datasource": {
                    "type": "prometheus",
                    "uid": "prometheus"
                  },
                  "expr": "sum(increase(controller_runtime_reconcile_total{job=\"crossplane-system/crossplane\", result=\"error\"}[1h])) or vector(0)",
                  "range": false,
                  "instant": true
                }
              ],
              "fieldConfig": {
                "defaults": {
                  "unit": "short",
                  "noValue": "0",
                  "thresholds": {
                    "mode": "absolute",
                    "steps": [
                      {
                        "color": "green",
                        "value": null
                      },
                      {
                        "color": "red",
                        "value": 1
                      }
                    ]
                  }
                },
                "overrides": []
              },
              "options": {
                "colorMode": "background",
                "graphMode": "none",
                "textMode": "value",
                "justifyMode": "center",
                "reduceOptions": {
                  "calcs": [
                    "lastNotNull"
                  ],
                  "fields": "",
                  "values": false
                }
              }
            },
