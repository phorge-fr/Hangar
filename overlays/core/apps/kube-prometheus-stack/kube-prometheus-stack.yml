apiVersion: v1
kind: Namespace
metadata:
    name: kube-prometheus-stack
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
    name: kube-prometheus-stack
    namespace: kube-prometheus-stack
spec:
    interval: 1m0s
    timeout: 15m0s
    url: https://prometheus-community.github.io/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
    name: kube-prometheus-stack
    namespace: kube-prometheus-stack
spec:
    chart:
        spec:
            chart: kube-prometheus-stack
            sourceRef:
                kind: HelmRepository
                name: kube-prometheus-stack
            version: '92.3.0'
    interval: 1m0s
    valuesFrom:
        - kind: Secret
          name: grafana-oauth-secret
          valuesKey: adminPassword
          targetPath: grafana.adminPassword
    values:
        grafana:
            envFromSecret: grafana-oauth-secret
            deploymentStrategy:
                type: RollingUpdate
                rollingUpdate:
                    maxUnavailable: 0
                    maxSurge: 1
            grafana.ini:
                auth.generic_oauth:
                    enabled: true
                    name: Phorge
                    allow_sign_up: true
                    client_id: $__env{GF_AUTH_GENERIC_OAUTH_CLIENT_ID}
                    client_secret: $__env{GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET}
                    scopes: openid profile email groups offline_access
                    auth_url: https://auth.phorge.fr/application/o/authorize/
                    token_url: https://auth.phorge.fr/application/o/token/
                    api_url: https://auth.phorge.fr/application/o/userinfo/
                    login_attribute_path: preferred_username
                    name_attribute_path: name
                    email_attribute_path: email
                    role_attribute_path: contains(groups[*], 'grafana-admins') && 'Admin' || contains(groups[*], 'grafana-viewers') && 'Viewer' || 'None'
                    use_pkce: true
                server:
                    domain: monitoring.phorge.fr
                    root_url: https://monitoring.phorge.fr/
            enabled: true
            service:
                type: ClusterIP
            ingress:
                enabled: true
                ingressClassName: traefik-public
                annotations:
                    cert-manager.io/cluster-issuer: public-issuer
                hosts:
                    - monitoring.phorge.fr
                tls:
                    - secretName: grafana-tls
                      hosts:
                          - monitoring.phorge.fr
            persistence:
                enabled: false
            sidecar:
                dashboards:
                    # Shows the `cluster` variable that the chart's dashboards hide by
                    # default (needs a cluster label on every series, set above and by Alloy).
                    multicluster:
                        global:
                            enabled: true
                    enabled: true
                    label: grafana_dashboard
                    labelValue: "1"
                    searchNamespace: kube-prometheus-stack
                    folder: /tmp/dashboards
                    enableDeletion: true
                    # Sorts the ConfigMaps into Grafana folders by their grafana_folder
                    # annotation, one subfolder of `folder` per value (foldersFromFilesStructure
                    # makes the provider mirror that layout into Grafana). A dashboard with no
                    # annotation stays at the top level.
                    folderAnnotation: grafana_folder
                    provider:
                        foldersFromFilesStructure: true
            additionalDataSources:
                - name: Loki
                  type: loki
                  access: proxy
                  url: http://loki.loki.svc.cluster.local:3100
                  isDefault: false
                  # Pinned: without it the sidecar assigns an opaque one (P8E80F9AEF21F6940 today),
                  # which the incus-dashboard.yml Loki panels could not reference reliably.
                  uid: loki
                  jsonData:
                      timeout: 60
                      maxLines: 1000
        prometheus:
            prometheusSpec:
                retention: 30d
                retentionSize: 35GiB
                enableRemoteWriteReceiver: true
                # externalLabels only apply on the way out (remote_write, alerts), not
                # to series stored in the local TSDB, so tag the locally scraped series
                # with the same `cluster` label Alloy sets on control/svc/stor.
                scrapeClasses:
                    - name: cluster-label
                      default: true
                      relabelings:
                          - action: replace
                            targetLabel: cluster
                            replacement: core
                storageSpec:
                    volumeClaimTemplate:
                        spec:
                            storageClassName: longhorn
                            accessModes:
                                - ReadWriteOnce
                            resources:
                                requests:
                                    storage: 40Gi
        # Node-level series follow the convention already used on control/svc/stor:
        # `node` and `instance` are the machine hostname. Overriding a relabelings list
        # replaces the chart default, hence the metrics_path rule repeated below.
        prometheus-node-exporter:
            prometheus:
                monitor:
                    relabelings:
                        - action: replace
                          sourceLabels:
                              - __meta_kubernetes_pod_node_name
                          targetLabel: node
                        - action: replace
                          sourceLabels:
                              - __meta_kubernetes_pod_node_name
                          targetLabel: instance
        kubelet:
            serviceMonitor:
                # `node` is set by the operator from the endpoint's target.
                relabelings:
                    - action: replace
                      sourceLabels:
                          - __metrics_path__
                      targetLabel: metrics_path
                    - action: replace
                      sourceLabels:
                          - node
                      targetLabel: instance
                # Same unused feature-gate/workqueue series as kubeApiServer above, coming from
                # the kubelet's own /metrics this time. Unlike control/svc, this cluster's kubelet
                # is scraped by this chart's own ServiceMonitor rather than through Alloy, so it
                # has no filtering of its own yet.
                metricRelabelings:
                    - action: drop
                      sourceLabels:
                          - __name__
                      regex: kubernetes_feature_enabled|workqueue_.*_bucket
                cAdvisorRelabelings:
                    - action: replace
                      sourceLabels:
                          - __metrics_path__
                      targetLabel: metrics_path
                    - action: replace
                      sourceLabels:
                          - node
                      targetLabel: instance
                probesRelabelings:
                    - action: replace
                      sourceLabels:
                          - __metrics_path__
                      targetLabel: metrics_path
                    - action: replace
                      sourceLabels:
                          - node
                      targetLabel: instance
        alertmanager:
            # Notifications go to a Discord channel. The webhook URL is a secret: it lives in the
            # alertmanager-discord Secret (alertmanager-secret.yml, SOPS), mounted below and read
            # from a file.
            config:
                global:
                    resolve_timeout: 5m
                # The default inhibit rules of the chart, with cluster in `equal`: the series of the
                # four sources share one Prometheus, so an alert of one cluster must not inhibit the
                # alert of another one that has the same namespace and name.
                inhibit_rules:
                    - source_matchers:
                          - severity = critical
                      target_matchers:
                          - severity =~ warning|info
                      equal:
                          - cluster
                          - namespace
                          - alertname
                    - source_matchers:
                          - severity = warning
                      target_matchers:
                          - severity = info
                      equal:
                          - cluster
                          - namespace
                          - alertname
                    - source_matchers:
                          - alertname = InfoInhibitor
                      target_matchers:
                          - severity = info
                      equal:
                          - cluster
                          - namespace
                    - target_matchers:
                          - alertname = InfoInhibitor
                route:
                    receiver: discord
                    group_by:
                        - cluster
                        - namespace
                        - alertname
                    group_wait: 30s
                    group_interval: 5m
                    repeat_interval: 12h
                    routes:
                        # Never notified: the helper of the inhibit rules, and info.
                        - matchers:
                              - alertname = InfoInhibitor
                          receiver: "null"
                        - matchers:
                              - severity = info
                          receiver: "null"
                        # Dead man's switch (#69): Watchdog always fires, so this route pings
                        # healthchecks.io every few minutes for as long as Prometheus and this
                        # Alertmanager are alive and able to send. healthchecks.io's own alerting
                        # (independent of core) fires if the ping ever stops arriving.
                        - matchers:
                              - alertname = Watchdog
                          receiver: healthchecks-watchdog
                          group_wait: 0s
                          group_interval: 3m
                          repeat_interval: 3m
                        # TargetDown (the chart's rule, >10% of a job's targets down) can never be
                        # right about ceph-mgr on comp: only the active mgr listens on its metrics
                        # port, so 2 of its 3 targets are down by design, permanently over the 10%
                        # threshold. The rule stays as the chart ships it, only this one case is
                        # muted; TargetDown still notifies for every other job and cluster.
                        - matchers:
                              - alertname = TargetDown
                              - job = ceph-mgr
                              - cluster = comp
                          receiver: "null"
                        # Critical alerts are sent quickly and repeated often, warnings are batched.
                        - matchers:
                              - severity = critical
                          repeat_interval: 4h
                        - matchers:
                              - severity = warning
                          group_wait: 2m
                          group_interval: 15m
                          repeat_interval: 24h
                receivers:
                    - name: "null"
                    - name: discord
                      discord_configs:
                          - webhook_url_file: /etc/alertmanager/secrets/alertmanager-discord/webhook-url
                            send_resolved: true
                    - name: healthchecks-watchdog
                      webhook_configs:
                          - url_file: /etc/alertmanager/secrets/alertmanager-healthchecks/ping-url
                            send_resolved: false
                templates:
                    - /etc/alertmanager/config/*.tmpl
            alertmanagerSpec:
                secrets:
                    - alertmanager-discord
                    - alertmanager-healthchecks
                # Keeps the silences and the notification log across restarts.
                storage:
                    volumeClaimTemplate:
                        spec:
                            storageClassName: longhorn
                            accessModes:
                                - ReadWriteOnce
                            resources:
                                requests:
                                    storage: 1Gi
        # Cilium replaces kube-proxy, so there is nothing to scrape: drop its ServiceMonitor,
        # its dashboard and the KubeProxyDown alert that fires for good.
        kubeProxy:
            enabled: false
        # Alloy (overlays/core/controllers/alloy) runs its own node-exporter instead, the same
        # way control/svc already do: one DaemonSet pod per node instead of two. Same job name
        # and instance label (node name), so the rules don't notice -- but the chart's own
        # "Node Exporter" dashboards are gated on nodeExporter.enabled too (queries only use
        # job/instance/cluster, no dependency on the DaemonSet itself), so forceDeployDashboards
        # keeps them provisioned even with the DaemonSet off (#101).
        nodeExporter:
            enabled: false
            forceDeployDashboards: true
        defaultRules:
            rules:
                kubeProxy: false
        kubeApiServer:
            serviceMonitor:
                metricRelabelings:
                    # apiserver_*/etcd_* _bucket histograms alone account for ~50%
                    # of this Prometheus' total series (~160k of ~330k). Drop them
                    # entirely, keep _sum/_count so rate/average latency stays
                    # available.
                    - action: drop
                      sourceLabels:
                          - __name__
                      regex: (apiserver|etcd)_.*_bucket
                    # This ServiceMonitor scrapes the same target as alloy-cluster's "apiserver"
                    # job (base/controllers/alloy), whose filter is a plain .*_bucket and also
                    # drops these two — kept in sync here since this path has its own, narrower
                    # regex above that doesn't catch them.
                    - action: drop
                      sourceLabels:
                          - __name__
                      regex: kubernetes_feature_enabled|workqueue_.*_bucket
        # The state of the Flux objects (ready, suspended, revision) as gotk_resource_info, through the
        # custom resource state of kube-state-metrics. The same block is in
        # base/controllers/kube-state-metrics for control and svc: the image.* kinds are left out as
        # their CRDs are not installed, and so is the webhook path of the Receivers (a secret).
        kube-state-metrics:
            # Also exposes and scrapes its own telemetry port (8081): the four KubeStateMetrics*
            # rules of the chart (list/watch errors, sharding) read kube_state_metrics_* series
            # that only exist there, so they could never fire (#65).
            selfMonitor:
                enabled: true
            rbac:
                extraRules:
                    - apiGroups:
                          - source.toolkit.fluxcd.io
                          - kustomize.toolkit.fluxcd.io
                          - helm.toolkit.fluxcd.io
                          - notification.toolkit.fluxcd.io
                      resources:
                          - gitrepositories
                          - buckets
                          - helmrepositories
                          - helmcharts
                          - ocirepositories
                          - kustomizations
                          - helmreleases
                          - alerts
                          - providers
                          - receivers
                      verbs: [list, watch]
            customResourceState:
                enabled: true
                config:
                    spec:
                        resources:
                            - groupVersionKind:
                                  group: kustomize.toolkit.fluxcd.io
                                  version: v1
                                  kind: Kustomization
                              metricNamePrefix: gotk
                              metrics:
                                  - name: resource_info
                                    help: "The current state of a Flux Kustomization resource."
                                    each:
                                        type: Info
                                        info:
                                            labelsFromPath:
                                                name: [metadata, name]
                                    labelsFromPath:
                                        exported_namespace: [metadata, namespace]
                                        ready: [status, conditions, "[type=Ready]", status]
                                        suspended: [spec, suspend]
                                        revision: [status, lastAppliedRevision]
                                        source_name: [spec, sourceRef, name]
                            - groupVersionKind:
                                  group: helm.toolkit.fluxcd.io
                                  version: v2
                                  kind: HelmRelease
                              metricNamePrefix: gotk
                              metrics:
                                  - name: resource_info
                                    help: "The current state of a Flux HelmRelease resource."
                                    each:
                                        type: Info
                                        info:
                                            labelsFromPath:
                                                name: [metadata, name]
                                    labelsFromPath:
                                        exported_namespace: [metadata, namespace]
                                        ready: [status, conditions, "[type=Ready]", status]
                                        suspended: [spec, suspend]
                                        revision: [status, history, "0", chartVersion]
                                        chart_name: [status, history, "0", chartName]
                                        chart_app_version: [status, history, "0", appVersion]
                                        chart_ref_name: [spec, chartRef, name]
                                        chart_source_name: [spec, chart, spec, sourceRef, name]
                            - groupVersionKind:
                                  group: source.toolkit.fluxcd.io
                                  version: v1
                                  kind: GitRepository
                              metricNamePrefix: gotk
                              metrics:
                                  - name: resource_info
                                    help: "The current state of a Flux GitRepository resource."
                                    each:
                                        type: Info
                                        info:
                                            labelsFromPath:
                                                name: [metadata, name]
                                    labelsFromPath:
                                        exported_namespace: [metadata, namespace]
                                        ready: [status, conditions, "[type=Ready]", status]
                                        suspended: [spec, suspend]
                                        revision: [status, artifact, revision]
                                        url: [spec, url]
                            - groupVersionKind:
                                  group: source.toolkit.fluxcd.io
                                  version: v1
                                  kind: Bucket
                              metricNamePrefix: gotk
                              metrics:
                                  - name: resource_info
                                    help: "The current state of a Flux Bucket resource."
                                    each:
                                        type: Info
                                        info:
                                            labelsFromPath:
                                                name: [metadata, name]
                                    labelsFromPath:
                                        exported_namespace: [metadata, namespace]
                                        ready: [status, conditions, "[type=Ready]", status]
                                        suspended: [spec, suspend]
                                        revision: [status, artifact, revision]
                                        endpoint: [spec, endpoint]
                                        bucket_name: [spec, bucketName]
                            - groupVersionKind:
                                  group: source.toolkit.fluxcd.io
                                  version: v1
                                  kind: HelmRepository
                              metricNamePrefix: gotk
                              metrics:
                                  - name: resource_info
                                    help: "The current state of a Flux HelmRepository resource."
                                    each:
                                        type: Info
                                        info:
                                            labelsFromPath:
                                                name: [metadata, name]
                                    labelsFromPath:
                                        exported_namespace: [metadata, namespace]
                                        ready: [status, conditions, "[type=Ready]", status]
                                        suspended: [spec, suspend]
                                        revision: [status, artifact, revision]
                                        url: [spec, url]
                            - groupVersionKind:
                                  group: source.toolkit.fluxcd.io
                                  version: v1
                                  kind: HelmChart
                              metricNamePrefix: gotk
                              metrics:
                                  - name: resource_info
                                    help: "The current state of a Flux HelmChart resource."
                                    each:
                                        type: Info
                                        info:
                                            labelsFromPath:
                                                name: [metadata, name]
                                    labelsFromPath:
                                        exported_namespace: [metadata, namespace]
                                        ready: [status, conditions, "[type=Ready]", status]
                                        suspended: [spec, suspend]
                                        revision: [status, artifact, revision]
                                        chart_name: [spec, chart]
                                        chart_version: [spec, version]
                            - groupVersionKind:
                                  group: source.toolkit.fluxcd.io
                                  version: v1
                                  kind: OCIRepository
                              metricNamePrefix: gotk
                              metrics:
                                  - name: resource_info
                                    help: "The current state of a Flux OCIRepository resource."
                                    each:
                                        type: Info
                                        info:
                                            labelsFromPath:
                                                name: [metadata, name]
                                    labelsFromPath:
                                        exported_namespace: [metadata, namespace]
                                        ready: [status, conditions, "[type=Ready]", status]
                                        suspended: [spec, suspend]
                                        revision: [status, artifact, revision]
                                        url: [spec, url]
                            - groupVersionKind:
                                  group: notification.toolkit.fluxcd.io
                                  version: v1beta3
                                  kind: Alert
                              metricNamePrefix: gotk
                              metrics:
                                  - name: resource_info
                                    help: "The current state of a Flux Alert resource."
                                    each:
                                        type: Info
                                        info:
                                            labelsFromPath:
                                                name: [metadata, name]
                                    labelsFromPath:
                                        exported_namespace: [metadata, namespace]
                                        suspended: [spec, suspend]
                            - groupVersionKind:
                                  group: notification.toolkit.fluxcd.io
                                  version: v1beta3
                                  kind: Provider
                              metricNamePrefix: gotk
                              metrics:
                                  - name: resource_info
                                    help: "The current state of a Flux Provider resource."
                                    each:
                                        type: Info
                                        info:
                                            labelsFromPath:
                                                name: [metadata, name]
                                    labelsFromPath:
                                        exported_namespace: [metadata, namespace]
                                        suspended: [spec, suspend]
                            - groupVersionKind:
                                  group: notification.toolkit.fluxcd.io
                                  version: v1
                                  kind: Receiver
                              metricNamePrefix: gotk
                              metrics:
                                  - name: resource_info
                                    help: "The current state of a Flux Receiver resource."
                                    each:
                                        type: Info
                                        info:
                                            labelsFromPath:
                                                name: [metadata, name]
                                    labelsFromPath:
                                        exported_namespace: [metadata, namespace]
                                        ready: [status, conditions, "[type=Ready]", status]
                                        suspended: [spec, suspend]
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
    name: prometheus-basic-auth-middleware
    namespace: kube-prometheus-stack
spec:
    basicAuth:
        secret: prometheus-basic-auth-secret
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
    name: prometheus
    namespace: kube-prometheus-stack
    annotations:
        traefik.ingress.kubernetes.io/router.middlewares: kube-prometheus-stack-prometheus-basic-auth-middleware@kubernetescrd
        cert-manager.io/cluster-issuer: local-issuer
        cert-manager.io/common-name: prometheus.core.phorge
spec:
    ingressClassName: traefik-local
    tls:
        - hosts:
              - prometheus.core.phorge
          secretName: prometheus-tls
    rules:
        - host: prometheus.core.phorge
          http:
              paths:
                  - path: /api/v1/write
                    pathType: Exact
                    backend:
                        service:
                            name: kube-prometheus-stack-prometheus
                            port:
                                number: 9090
