kind: Namespace
apiVersion: v1
metadata:
    name: uptime-kuma
---
apiVersion: v1
kind: Service
metadata:
    name: uptime-kuma-service
    namespace: uptime-kuma
spec:
    selector:
        app: uptime-kuma
    ports:
        - name: uptime-kuma
          port: 3001
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
    name: uptime-kuma
    namespace: uptime-kuma
spec:
    replicas: 1
    serviceName: uptime-kuma-service
    selector:
        matchLabels:
            app: uptime-kuma
    template:
        metadata:
            labels:
                app: uptime-kuma
        spec:
            containers:
                - name: uptime-kuma
                  image: louislam/uptime-kuma:2.5.6
                  env:
                      - name: UPTIME_KUMA_PORT
                        value: "3001"
                      - name: PORT
                        value: "3001"
                  ports:
                      - name: uptime-kuma
                        containerPort: 3001
                        protocol: TCP
                  readinessProbe:
                      httpGet:
                          path: /
                          port: 3001
                      initialDelaySeconds: 5
                      periodSeconds: 10
                      timeoutSeconds: 3
                      failureThreshold: 3
                  livenessProbe:
                      tcpSocket:
                          port: 3001
                      initialDelaySeconds: 15
                      periodSeconds: 20
                      timeoutSeconds: 3
                      failureThreshold: 3
                  volumeMounts:
                      - name: kuma-data
                        mountPath: /app/data
    volumeClaimTemplates:
        - metadata:
              name: kuma-data
          spec:
              accessModes:
                  - ReadWriteOnce
              volumeMode: Filesystem
              storageClassName: longhorn
              resources:
                  requests:
                      storage: 1Gi
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
    name: uptime-kuma-ing
    namespace: uptime-kuma
    annotations:
        cert-manager.io/cluster-issuer: public-issuer
spec:
    ingressClassName: traefik-public
    tls:
        - hosts:
              - status.phorge.fr
          secretName: status.phorge.fr
    rules:
        - host: status.phorge.fr
          http:
              paths:
                  - path: /
                    pathType: Prefix
                    backend:
                        service:
                            name: uptime-kuma-service
                            port:
                                number: 3001
