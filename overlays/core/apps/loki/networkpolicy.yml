# Alloy runs in the host network: its pushes and probes come from the host or remote-node identity.
# The Alloy of the other clusters push through traefik-local.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
    name: loki
    namespace: loki
spec:
    endpointSelector:
        matchLabels:
            app: loki
    ingress:
        - fromEndpoints:
              - matchLabels:
                    io.kubernetes.pod.namespace: traefik
                    app.kubernetes.io/instance: traefik-local-traefik
              - matchLabels:
                    io.kubernetes.pod.namespace: kube-prometheus-stack
                    app.kubernetes.io/name: grafana
          toPorts:
              - ports:
                    - port: "3100"
                      protocol: TCP
        - fromEntities:
              - host
              - remote-node
          toPorts:
              - ports:
                    - port: "3100"
                      protocol: TCP
