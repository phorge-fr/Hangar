apiVersion: v1
kind: Namespace
metadata:
    name: loki
---
apiVersion: v1
kind: ConfigMap
metadata:
    name: loki-config
    namespace: loki
data:
    loki-config.yaml: |
        auth_enabled: false

        server:
          http_listen_port: 3100

        ingester:
          lifecycler:
            address: 127.0.0.1
            ring:
              kvstore:
                store: inmemory
              replication_factor: 1
          chunk_idle_period: 5m
          chunk_retain_period: 30s
          wal:
            enabled: true
            dir: /loki/wal

        schema_config:
          configs:
            - from: 2020-10-24
              store: boltdb-shipper
              object_store: filesystem
              schema: v11
              index:
                prefix: index_
                period: 24h

        storage_config:
          boltdb_shipper:
            active_index_directory: /loki/index
            cache_location: /loki/cache
          filesystem:
            directory: /loki/chunks

        limits_config:
          allow_structured_metadata: false
          ingestion_rate_mb: 10
          ingestion_burst_size_mb: 20
          max_concurrent_tail_requests: 20
          retention_period: 720h

        # retention runs through the compactor, not table_manager: table_manager
        # retention relies on the object store's own TTL feature, which the
        # filesystem backend used here doesn't support -- it was a silent
        # no-op, logs were never actually being deleted.
        compactor:
          working_directory: /loki/compactor
          retention_enabled: true
          delete_request_store: filesystem
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
    name: loki-pvc
    namespace: loki
spec:
    storageClassName: longhorn
    accessModes:
        - ReadWriteOnce
    resources:
        requests:
            storage: 15Gi
    volumeMode: Filesystem
---
apiVersion: apps/v1
kind: Deployment
metadata:
    name: loki
    namespace: loki
    labels:
        app: loki
spec:
    replicas: 1
    strategy:
        type: Recreate
    selector:
        matchLabels:
            app: loki
    template:
        metadata:
            labels:
                app: loki
        spec:
            securityContext:
                fsGroup: 10001
            containers:
                - name: loki
                  image: grafana/loki:3.7.9
                  args:
                      - -config.file=/etc/loki/local-config.yaml
                  ports:
                      - containerPort: 3100
                  volumeMounts:
                      - name: loki-data
                        mountPath: /loki
                      - name: loki-config
                        mountPath: /etc/loki/local-config.yaml
                        subPath: loki-config.yaml
                  securityContext:
                      runAsUser: 10001
                      runAsGroup: 10001
                      runAsNonRoot: true
                      allowPrivilegeEscalation: false
                      capabilities:
                          drop:
                              - ALL
            volumes:
                - name: loki-data
                  persistentVolumeClaim:
                      claimName: loki-pvc
                - name: loki-config
                  configMap:
                      name: loki-config
---
apiVersion: v1
kind: Service
metadata:
    name: loki
    namespace: loki
    labels:
        app: loki
spec:
    type: ClusterIP
    ports:
        - port: 3100
          targetPort: 3100
          protocol: TCP
          name: loki
    selector:
        app: loki
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
    name: loki-basic-auth-middleware
    namespace: loki
spec:
    basicAuth:
        secret: loki-basic-auth-secret
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
    name: loki
    namespace: loki
    annotations:
        traefik.ingress.kubernetes.io/router.middlewares: loki-loki-basic-auth-middleware@kubernetescrd
        cert-manager.io/cluster-issuer: local-issuer
        cert-manager.io/common-name: loki.core.phorge
spec:
    ingressClassName: traefik-local
    tls:
        - hosts:
              - loki.core.phorge
          secretName: loki-tls
    rules:
        - host: loki.core.phorge
          http:
              paths:
                  - path: /loki/api/v1/push
                    pathType: Exact
                    backend:
                        service:
                            name: loki
                            port:
                                number: 3100
                  - path: /ready
                    pathType: Exact
                    backend:
                        service:
                            name: loki
                            port:
                                number: 3100
                  - path: /healthy
                    pathType: Exact
                    backend:
                        service:
                            name: loki
                            port:
                                number: 3100
