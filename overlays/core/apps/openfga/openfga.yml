apiVersion: v1
kind: Namespace
metadata:
    name: openfga
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
    name: openfga-postgres-pvc
    namespace: openfga
spec:
    storageClassName: longhorn
    accessModes:
        - ReadWriteOnce
    resources:
        requests:
            storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
    name: openfga-postgres
    namespace: openfga
    labels:
        app: openfga-postgres
spec:
    replicas: 1
    strategy:
        type: Recreate
    selector:
        matchLabels:
            app: openfga-postgres
    template:
        metadata:
            labels:
                app: openfga-postgres
        spec:
            securityContext:
                fsGroup: 999
            containers:
                - name: postgres
                  image: docker.io/library/postgres:18.6-bookworm
                  env:
                      - name: POSTGRES_USER
                        value: openfga
                      - name: POSTGRES_DB
                        value: openfga
                      - name: POSTGRES_PASSWORD
                        valueFrom:
                            secretKeyRef:
                                name: openfga-postgres-secret
                                key: postgresPassword
                      - name: PGDATA
                        value: /var/lib/postgresql/data/pgdata
                  ports:
                      - containerPort: 5432
                  volumeMounts:
                      - name: data
                        mountPath: /var/lib/postgresql/data
                  securityContext:
                      runAsUser: 999
                      runAsGroup: 999
                      runAsNonRoot: true
                      allowPrivilegeEscalation: false
                      capabilities:
                          drop:
                              - ALL
                  readinessProbe:
                      exec:
                          command:
                              - pg_isready
                              - -U
                              - openfga
                      initialDelaySeconds: 5
                      periodSeconds: 10
                  livenessProbe:
                      exec:
                          command:
                              - pg_isready
                              - -U
                              - openfga
                      initialDelaySeconds: 15
                      periodSeconds: 20
            volumes:
                - name: data
                  persistentVolumeClaim:
                      claimName: openfga-postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
    name: openfga-postgres
    namespace: openfga
spec:
    selector:
        app: openfga-postgres
    ports:
        - port: 5432
          targetPort: 5432
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
    name: openfga
    namespace: openfga
spec:
    interval: 1h0s
    url: https://openfga.github.io/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
    name: openfga
    namespace: openfga
spec:
    chart:
        spec:
            chart: openfga
            version: 0.3.16
            sourceRef:
                kind: HelmRepository
                name: openfga
    interval: 1h0s
    timeout: 5m0s
    values:
        replicaCount: 1
        datastore:
            engine: postgres
            existingSecret: openfga-secrets
            secretKeys:
                uriKey: datastoreUri
            migrationType: initContainer
        authn:
            method: preshared
            preshared:
                keysSecret: openfga-secrets
        playground:
            enabled: false
        service:
            type: ClusterIP
        telemetry:
            metrics:
                enableRPCHistograms: true
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
    name: openfga
    namespace: openfga
    annotations:
        cert-manager.io/cluster-issuer: local-issuer
        cert-manager.io/common-name: openfga.core.phorge
spec:
    ingressClassName: traefik-local
    tls:
        - hosts:
              - openfga.core.phorge
          secretName: openfga-tls
    rules:
        - host: openfga.core.phorge
          http:
              paths:
                  - path: /
                    pathType: Prefix
                    backend:
                        service:
                            name: openfga
                            port:
                                number: 8080
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
    name: openfga
    namespace: openfga
    labels:
        release: kube-prometheus-stack
spec:
    selector:
        matchLabels:
            app.kubernetes.io/name: openfga
    endpoints:
        - port: metrics
          path: /metrics
          interval: 30s
