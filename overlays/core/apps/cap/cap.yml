# Cap (https://capjs.js.org): the proof-of-work captcha of the Authentik sign-in. Site keys, secrets, tokens and settings
# are in Valkey, the events (one row per challenge, solve and refusal) in a DuckDB file on the data volume. The dashboard
# is not exposed: it is reached with a port-forward, only /assets (the widget) is public. Nothing is configured by hand
# in the dashboard: the site key is created and its secret rotated through the API (docs/how-to/upgrade-cap-to-v4.md).
kind: Namespace
apiVersion: v1
metadata:
    name: cap
---
apiVersion: v1
kind: Service
metadata:
    name: cap
    namespace: cap
spec:
    selector:
        app: cap
    ports:
        - name: http
          port: 3000
---
apiVersion: v1
kind: Service
metadata:
    name: cap-valkey
    namespace: cap
spec:
    selector:
        app: cap-valkey
    ports:
        - name: valkey
          port: 6379
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
    name: cap-data
    namespace: cap
spec:
    accessModes:
        - ReadWriteOnce
    storageClassName: longhorn
    resources:
        requests:
            storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
    name: cap
    namespace: cap
spec:
    replicas: 1
    # The data volume is ReadWriteOnce: the old pod stops before the new one starts
    strategy:
        type: RollingUpdate
        rollingUpdate:
            maxUnavailable: 1
            maxSurge: 0
    selector:
        matchLabels:
            app: cap
    template:
        metadata:
            labels:
                app: cap
        spec:
            securityContext:
                fsGroup: 1000
            containers:
                - name: cap
                  image: tiago2/cap:4.0.1
                  env:
                      - name: ADMIN_KEY
                        valueFrom:
                            secretKeyRef:
                                name: cap
                                key: admin-key
                      - name: VALKEY_URL
                        value: redis://cap-valkey:6379
                      # The next four are deprecated in v4: Cap copies each one into its settings in Valkey at the first start
                      # that finds the setting empty, then ignores it (and logs a warning). They keep a rebuilt Valkey from
                      # falling back to "any origin" and to a widget loaded from a CDN. Changing one later needs the API.
                      # The widget and its WASM are served by Cap itself (pinned), so the sign-in page loads nothing from a CDN
                      - name: ENABLE_ASSETS_SERVER
                        value: "true"
                      - name: WIDGET_VERSION
                        value: 0.1.60
                      - name: WASM_VERSION
                        value: 0.0.8
                      # Only the sign-in page may ask for a challenge
                      - name: CORS_ORIGIN
                        value: https://auth.phorge.fr
                  ports:
                      - name: http
                        containerPort: 3000
                        protocol: TCP
                  readinessProbe:
                      httpGet:
                          path: /health
                          port: 3000
                      periodSeconds: 10
                      timeoutSeconds: 3
                      failureThreshold: 3
                  livenessProbe:
                      httpGet:
                          path: /health/live
                          port: 3000
                      initialDelaySeconds: 15
                      periodSeconds: 20
                      timeoutSeconds: 3
                      failureThreshold: 3
                  resources:
                      requests:
                          cpu: 50m
                          memory: 128Mi
                      limits:
                          memory: 384Mi
                  securityContext:
                      allowPrivilegeEscalation: false
                      runAsNonRoot: true
                      runAsUser: 1000
                      capabilities:
                          drop:
                              - ALL
                  # The events (DuckDB) and the IP databases are stored here
                  volumeMounts:
                      - name: data
                        mountPath: /usr/src/app/data
            volumes:
                - name: data
                  persistentVolumeClaim:
                      claimName: cap-data
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
    name: cap-valkey
    namespace: cap
spec:
    replicas: 1
    serviceName: cap-valkey
    selector:
        matchLabels:
            app: cap-valkey
    template:
        metadata:
            labels:
                app: cap-valkey
        spec:
            securityContext:
                fsGroup: 999
            containers:
                - name: valkey
                  image: valkey/valkey:9.1.3-alpine
                  # noeviction: a full Valkey refuses writes instead of dropping site keys or tokens
                  args:
                      - valkey-server
                      - --save
                      - "60"
                      - "1"
                      - --loglevel
                      - warning
                      - --maxmemory
                      - 128mb
                      - --maxmemory-policy
                      - noeviction
                  ports:
                      - name: valkey
                        containerPort: 6379
                        protocol: TCP
                  readinessProbe:
                      exec:
                          command:
                              - valkey-cli
                              - ping
                      periodSeconds: 10
                      timeoutSeconds: 3
                  livenessProbe:
                      exec:
                          command:
                              - valkey-cli
                              - ping
                      initialDelaySeconds: 15
                      periodSeconds: 20
                      timeoutSeconds: 3
                  resources:
                      requests:
                          cpu: 20m
                          memory: 64Mi
                      limits:
                          memory: 192Mi
                  securityContext:
                      allowPrivilegeEscalation: false
                      readOnlyRootFilesystem: true
                      runAsNonRoot: true
                      runAsUser: 999
                      capabilities:
                          drop:
                              - ALL
                  volumeMounts:
                      - name: data
                        mountPath: /data
    volumeClaimTemplates:
        - metadata:
              name: data
          spec:
              accessModes:
                  - ReadWriteOnce
              volumeMode: Filesystem
              storageClassName: longhorn
              resources:
                  requests:
                      storage: 1Gi
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
    name: cap
    namespace: cap
    annotations:
        cert-manager.io/cluster-issuer: public-issuer
spec:
    ingressClassName: traefik-public
    tls:
        - hosts:
              - cap.phorge.fr
          secretName: cap.phorge.fr
    rules:
        - host: cap.phorge.fr
          http:
              paths:
                  # The widget, and the two calls it makes for the site key of the Authentik sign-in. The check of the token
                  # (siteverify) is not public: Authentik calls the service directly.
                  - path: /assets
                    pathType: Prefix
                    backend:
                        service:
                            name: cap
                            port:
                                number: 3000
                  - path: /832d1723b8/challenge
                    pathType: Prefix
                    backend:
                        service:
                            name: cap
                            port:
                                number: 3000
                  - path: /832d1723b8/redeem
                    pathType: Prefix
                    backend:
                        service:
                            name: cap
                            port:
                                number: 3000
