# MKTXP reads the RouterOS API of the edge router (repository Network) and exposes it as Prometheus metrics.
# The router side is in Network: the read-only user `mktxp` (users in terraform.tfvars), the input firewall
# rule that lets the core nodes reach TCP 8729 and the api-ssl service, set by hand (see its runbook).
# The API login is in secrets.yml, its password is TF_VAR_user_passwords of Network.
# The dashboard is grafana-dashboards/mktxp-dashboard.yml in kube-prometheus-stack.
kind: Namespace
apiVersion: v1
metadata:
    name: mktxp
---
apiVersion: v1
kind: ConfigMap
metadata:
    name: mktxp-config
    namespace: mktxp
data:
    mktxp.conf: |
        [Phorge-Core-0]
            enabled = True
            hostname = 192.168.2.254
            port = 8729
            credentials_file = /etc/mktxp/credentials.yml
            use_ssl = True
            no_ssl_certificate = False
            ssl_certificate_verify = True
            ssl_check_hostname = True
            ssl_ca_file = /etc/mktxp/router-ca.pem

            routerboard = True
            certificate = True
            container = True
            wireless = False
            wireless_clients = False
            capsman = False
            capsman_clients = False
    _mktxp.conf: |
        [MKTXP]
            listen = '0.0.0.0:49090'
            socket_timeout = 5
            persistent_dhcp_cache = False
    router-ca.pem: |
