---
apiVersion: v1
kind: Service
metadata:
    name: mktxp
    namespace: mktxp
    labels:
        app.kubernetes.io/name: mktxp
spec:
    selector:
        app.kubernetes.io/name: mktxp
    ports:
        - name: metrics
          port: 49090
          targetPort: metrics
---
apiVersion: apps/v1
kind: Deployment
metadata:
    name: mktxp
    namespace: mktxp
spec:
    replicas: 1
    selector:
        matchLabels:
            app.kubernetes.io/name: mktxp
    template:
        metadata:
            labels:
                app.kubernetes.io/name: mktxp
        spec:
            containers:
                - name: mktxp
                  image: ghcr.io/akpw/mktxp:2.0.3
                  command:
                      - mktxp
                  args:
                      - --cfg-dir
                      - /etc/mktxp
                      - export
                  ports:
                      - name: metrics
                        containerPort: 49090
                        protocol: TCP
                  readinessProbe:
                      tcpSocket:
                          port: metrics
                      periodSeconds: 10
                  livenessProbe:
                      tcpSocket:
                          port: metrics
                      initialDelaySeconds: 30
                      periodSeconds: 30
                      failureThreshold: 3
                  resources:
                      requests:
                          cpu: 20m
                          memory: 64Mi
                      limits:
                          memory: 256Mi
                  securityContext:
                      runAsNonRoot: true
                      runAsUser: 1000
                      allowPrivilegeEscalation: false
                      readOnlyRootFilesystem: true
                      capabilities:
                          drop:
                              - ALL
                      seccompProfile:
                          type: RuntimeDefault
                  volumeMounts:
                      - name: config
                        mountPath: /etc/mktxp
                        readOnly: true
                      - name: tmp
                        mountPath: /tmp
            volumes:
                - name: config
                  projected:
                      sources:
                          - configMap:
                                name: mktxp-config
                          - secret:
                                name: mktxp-credentials
                - name: tmp
                  emptyDir: {}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
    name: mktxp
    namespace: mktxp
    labels:
        release: kube-prometheus-stack
spec:
    selector:
        matchLabels:
            app.kubernetes.io/name: mktxp
    endpoints:
        - port: metrics
          path: /metrics
          interval: 30s
          scrapeTimeout: 25s
