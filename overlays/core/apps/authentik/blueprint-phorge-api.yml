apiVersion: v1
kind: ConfigMap
metadata:
    name: authentik-phorge-oauth-blueprint
    namespace: authentik
data:
    phorge-oauth.yaml: |-
        # yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
        version: 1

        metadata:
          name: phorge-oauth
          labels:
            blueprints.goauthentik.io/description: Phorge API and console OIDC application

        # One public OIDC client, "Phorge OAuth", shared by the CLI (device code, like Incus in blueprint-incus.yml), the API
        # keys (client_credentials) and the console (authorization code with PKCE, docs/decisions/0009). The API itself is a
        # resource server: it holds no secret, it checks the access token's signature, issuer and audience (the client_id of
        # this client, OIDC_AUDIENCE) against authentik's JWKS and takes the user from the email claim, the same key as every
        # OpenFGA tuple (docs/phorge-api.md).
        # Any user that authenticates gets a token; what the token can do is decided by OpenFGA
        # (Membership and ApiKey tuples), so a user without a Membership gets nothing. Restrict the
        # application with a group policy binding to also stop strangers from signing in.
        entries:
          # authentik's own 'email' mapping hardcodes "email_verified": false, it never verifies an address, so
          # the API (which refuses a token without a verified email, docs/phorge-api-implementation.md) would
          # refuse every user. This mapping, attached to the provider of this blueprint only, states what is true here: accounts
          # are created by an administrator, nobody enrolls by themselves, so the address of an account is the
          # one the administrator typed. No mail can be sent from the domain, so an address cannot be verified by
          # mail either, so the administrator is the one who decides whether a person may use an account: keep it
          # that way (accounts created by an administrator, or by an invitation link handed over by hand) and do
          # not open a self-enrollment flow. If one is ever opened, replace the constant with
          # a check (an attribute set after a verification) first: any user could otherwise register somebody
          # else's address and inherit their rights in OpenFGA.
          - model: authentik_providers_oauth2.scopemapping
            id: phorge-email-scope
            identifiers:
              name: Phorge email
            attrs:
              name: Phorge email
              scope_name: email
              description: Email address, vouched for by the administrators of the accounts
              expression: |
                return {
                    "email": request.user.email,
                    "email_verified": True,
                }
          - model: authentik_providers_oauth2.oauth2provider
            id: phorge-oauth-provider
            identifiers:
              name: Phorge OAuth
            attrs:
              name: Phorge OAuth
              client_id: 49a1375b-c52a-4a59-b3cb-8d4f5e392d85
              client_type: public
              # Also the lifetime of the device code, see blueprint-incus.yml.
              access_code_validity: minutes=5
              property_mappings:
                - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
                - !KeyOf phorge-email-scope
                - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
                - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-offline_access]]
              authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-explicit-consent]]
              invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
              signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
              grant_types:
                - authorization_code
                - refresh_token
                - urn:ietf:params:oauth:grant-type:device_code
                # The API keys: a service account (created by Crossplane for each ApiKey, see Hangar#230) exchanges its user
                # name and the app password of its token for a JWT of this client. The grant needs both, which only those
                # accounts have; a person signs in with the flows above. A JWT that was issued stays valid for the lifetime
                # of the access token of this provider, so a revoked key is refused at once by its OpenFGA tuples, not here.
                - client_credentials
              # The console is served at console.phorge.fr, on the svc cluster (docs/decisions/0008), and signs in with this
              # client as a public one: PKCE, no secret. Its callback and the one of the development server are authorization
              # redirect URIs. The addresses it comes back to after signing out are of the type "logout": authentik only honors
              # post_logout_redirect_uri for those (with none, the parameter is ignored and its own "logged out" page is shown),
              # and it requires the id_token_hint that the console sends. The command line uses the device code and needs none
              # of them.
              redirect_uris:
                - matching_mode: strict
                  url: https://console.phorge.fr/oidc/callback
                - matching_mode: strict
                  url: http://localhost:5173/oidc/callback
                - matching_mode: strict
                  url: https://console.phorge.fr/
                  redirect_uri_type: logout
                - matching_mode: strict
                  url: http://localhost:5173/
                  redirect_uri_type: logout
          - model: authentik_core.application
            identifiers:
              slug: phorge
            attrs:
              name: Phorge
              slug: phorge
              provider: !Find [authentik_providers_oauth2.oauth2provider, [name, Phorge OAuth]]
          # The console had a client of its own, "Console OAuth" (phorge-fr/Hangar#346), until it was decided to sign in with
          # the shared client above. A blueprint does not delete what it no longer lists, so these two entries remove the
          # application and its provider; the application first, since it points at the provider. Once applied everywhere,
          # they can go.
          - model: authentik_core.application
            state: absent
            identifiers:
              slug: console
          - model: authentik_providers_oauth2.oauth2provider
            state: absent
            identifiers:
              name: Console OAuth
          # The platform administrators. The API does not read this group any more (a person creates and deletes their own
          # tenants, a special case is done by an administrator on Kubernetes and Incus); other blueprints and policies of
          # Authentik use it. The blueprint creates the group but never lists its members, which would be reset at each
          # apply: add the people to it in authentik.
          - model: authentik_core.group
            identifiers:
              name: phorge-platform-admins
            attrs:
              name: phorge-platform-admins
          # The API used to ask authentik whether the owner of a key was still a platform administrator, with the token of a
          # service account that could read that one group. A key is now a service account with tuples of its own, never an
          # administrator: nothing reads the group any more. A blueprint only adds, so what it created is removed here.
          - model: authentik_core.token
            state: absent
            identifiers:
              identifier: phorge-api-directory
          - model: authentik_core.group
            state: absent
            identifiers:
              name: phorge-api-directory
          - model: authentik_core.user
            state: absent
            identifiers:
              username: phorge-api-directory
          - model: authentik_rbac.role
            state: absent
            identifiers:
              name: phorge-api-directory
