apiVersion: v1
kind: ConfigMap
metadata:
    name: authentik-phorge-oauth-blueprint
    namespace: authentik
data:
    phorge-oauth.yaml: |-
        # yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
        version: 1

        metadata:
          name: phorge-oauth
          labels:
            blueprints.goauthentik.io/description: Phorge API and console OIDC application

        # Two OIDC clients, one application each. The public client "Phorge OAuth" is the one of the CLI (device code,
        # like Incus in blueprint-incus.yml) and of the API keys (client_credentials). The console has its own
        # confidential client "Console OAuth", further down. The API itself is a resource server: it holds no secret, it
        # checks the access token's signature and audience (the client_id of either client, OIDC_AUDIENCE lists both)
        # against authentik's JWKS and takes the user from the email claim, the same key as every OpenFGA tuple
        # (docs/phorge-api.md).
        # Any user that authenticates gets a token; what the token can do is decided by OpenFGA
        # (Membership and ApiKey tuples), so a user without a Membership gets nothing. Restrict the
        # application with a group policy binding to also stop strangers from signing in.
        entries:
          # authentik's own 'email' mapping hardcodes "email_verified": false, it never verifies an address, so
          # the API (which refuses a token without a verified email, docs/phorge-api-implementation.md) would
          # refuse every user. This mapping, attached to the two providers of this blueprint only, states what is true here: accounts
          # are created by an administrator, nobody enrolls by themselves, so the address of an account is the
          # one the administrator typed. No mail can be sent from the domain, so an address cannot be verified by
          # mail either, so the administrator is the one who decides whether a person may use an account: keep it
          # that way (accounts created by an administrator, or by an invitation link handed over by hand) and do
          # not open a self-enrollment flow. If one is ever opened, replace the constant with
          # a check (an attribute set after a verification) first: any user could otherwise register somebody
          # else's address and inherit their rights in OpenFGA.
          - model: authentik_providers_oauth2.scopemapping
            id: phorge-email-scope
            identifiers:
              name: Phorge email
            attrs:
              name: Phorge email
              scope_name: email
              description: Email address, vouched for by the administrators of the accounts
              expression: |
                return {
                    "email": request.user.email,
                    "email_verified": True,
                }
          - model: authentik_providers_oauth2.oauth2provider
            id: phorge-oauth-provider
            identifiers:
              name: Phorge OAuth
            attrs:
              name: Phorge OAuth
              client_id: 49a1375b-c52a-4a59-b3cb-8d4f5e392d85
              client_type: public
              # Also the lifetime of the device code, see blueprint-incus.yml.
              access_code_validity: minutes=5
              property_mappings:
                - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
                - !KeyOf phorge-email-scope
                - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
                - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-offline_access]]
              authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-explicit-consent]]
              invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
              signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
              grant_types:
                - authorization_code
                - refresh_token
                - urn:ietf:params:oauth:grant-type:device_code
                # The API keys: a service account (created by Crossplane for each ApiKey, see Hangar#230) exchanges its user
                # name and the app password of its token for a JWT of this client. The grant needs both, which only those
                # accounts have; a person signs in with the flows above. A JWT that was issued stays valid for the lifetime
                # of the access token of this provider, so a revoked key is refused at once by its OpenFGA tuples, not here.
                - client_credentials
              # The console is served at console.phorge.fr, on the svc cluster (docs/decisions/0008). It has its own client
              # now (Console OAuth); this redirect URI is left from before and is removed in its own change.
              redirect_uris:
                - matching_mode: strict
                  url: https://console.phorge.fr/oidc/callback
          - model: authentik_core.application
            identifiers:
              slug: phorge
            attrs:
              name: Phorge
              slug: phorge
              provider: !Find [authentik_providers_oauth2.oauth2provider, [name, Phorge OAuth]]
          # The console (console.phorge.fr, svc cluster) is a confidential client of the authorization code flow with PKCE:
          # its server holds the client secret, read here from the environment (the same value as in the Secret of the
          # console on svc), and the tokens never reach the browser (docs/decisions/0009). It gets the same email mapping
          # as the client above, so that the API accepts its tokens, and no device code or client_credentials grant. The
          # first redirect URI is the callback of the console; the second is where it comes back after signing out (authentik
          # validates the post-logout address against these); the third is the development server, which needs the client
          # secret as well.
          - model: authentik_providers_oauth2.oauth2provider
            id: console-oauth-provider
            identifiers:
              name: Console OAuth
            attrs:
              name: Console OAuth
              client_id: 48630a66-d669-4c06-b3a5-926c6485fe6f
              client_secret: !Env CONSOLE_OIDC_CLIENT_SECRET
              client_type: confidential
              include_claims_in_id_token: true
              property_mappings:
                - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
                - !KeyOf phorge-email-scope
                - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
                - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-offline_access]]
              authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
              invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
              signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
              grant_types:
                - authorization_code
                - refresh_token
              redirect_uris:
                - matching_mode: strict
                  url: https://console.phorge.fr/oidc/callback
                - matching_mode: strict
                  url: https://console.phorge.fr/
                - matching_mode: strict
                  url: http://localhost:5173/oidc/callback
          - model: authentik_core.application
            identifiers:
              slug: console
            attrs:
              name: Phorge console
              slug: console
              provider: !KeyOf console-oauth-provider
              meta_launch_url: https://console.phorge.fr/
          # The people who create, resize and delete tenants. The API reads the "groups" claim of the token (the names
          # of the groups the user belongs to, see the 'profile' scope) and compares it with PLATFORM_ADMIN_GROUP, so
          # this name is the one the API is configured with. The blueprint creates the group but never lists its
          # members, which would be reset at each apply: add the people to it in authentik.
          - model: authentik_core.group
            identifiers:
              name: phorge-platform-admins
            attrs:
              name: phorge-platform-admins
          # The API used to ask authentik whether the owner of a key was still a platform administrator, with the token of a
          # service account that could read that one group. A key is now a service account with tuples of its own, never an
          # administrator: nothing reads the group any more. A blueprint only adds, so what it created is removed here.
          - model: authentik_core.token
            state: absent
            identifiers:
              identifier: phorge-api-directory
          - model: authentik_core.group
            state: absent
            identifiers:
              name: phorge-api-directory
          - model: authentik_core.user
            state: absent
            identifiers:
              username: phorge-api-directory
          - model: authentik_rbac.role
            state: absent
            identifiers:
              name: phorge-api-directory
