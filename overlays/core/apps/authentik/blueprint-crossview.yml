apiVersion: v1
kind: ConfigMap
metadata:
    name: authentik-crossview-oauth-blueprint
    namespace: authentik
data:
    crossview-oauth.yaml: |
        # yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
        version: 1
        metadata:
          name: crossview-oauth
          labels:
            blueprints.goauthentik.io/description: Crossview OIDC application
        # Crossview (control cluster, crossview.control.phorge) is a confidential client of the authorization code flow:
        # its backend holds the client secret, read here from the environment (the same value as in the Secret
        # crossview-auth of control). Crossview can read every resource of the control cluster, Secrets included, so the
        # application is bound to the group crossview-users: anybody else is refused at the authorization step.
        entries:
          - model: authentik_providers_oauth2.oauth2provider
            id: crossview-oauth-provider
            identifiers:
              name: Crossview OAuth
            attrs:
              name: Crossview OAuth
              client_id: 9cfce95d-f0a5-4965-986a-56711b883d8c
              client_secret: !Env CROSSVIEW_OIDC_CLIENT_SECRET
              client_type: confidential
              property_mappings:
                - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
                - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
                - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
              authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
              invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
              signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
              grant_types:
                - authorization_code
              redirect_uris:
                - matching_mode: strict
                  url: https://crossview.control.phorge/api/auth/oidc/callback
          - model: authentik_core.application
            id: crossview-application
            identifiers:
              slug: crossview
            attrs:
              name: Crossview
              slug: crossview
              provider: !KeyOf crossview-oauth-provider
          # The members are added in authentik: the blueprint would reset a list at each apply.
          - model: authentik_core.group
            id: crossview-users-group
            identifiers:
              name: crossview-users
            attrs:
              name: crossview-users
          - model: authentik_policies.policybinding
            identifiers:
              target: !KeyOf crossview-application
              group: !KeyOf crossview-users-group
              order: 0
            attrs:
              target: !KeyOf crossview-application
              group: !KeyOf crossview-users-group
              order: 0
              enabled: true
              negate: false
              timeout: 30
