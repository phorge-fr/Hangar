apiVersion: v1
kind: ConfigMap
metadata:
    name: authentik-brand
    namespace: authentik
data:
    brand.yaml: |-
        # yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
        version: 1

        metadata:
          name: phorge-brand
          labels:
            blueprints.goauthentik.io/description: Phorge brand for auth.phorge.fr

        entries:
          # The device authorization grant (RFC 8628) needs a flow on the brand. The user has to be
          # signed in (require_authenticated) and authentik appends the step that asks for the code,
          # so the flow has no stage of its own. The Incus CLI has no other way to log in with OIDC.
          - model: authentik_flows.flow
            id: device-code-flow
            identifiers:
              slug: default-device-code-flow
            attrs:
              name: Device code flow
              title: Authorize a device
              designation: authentication
              authentication: require_authenticated
          - model: authentik_brands.brand
            id: phorge-brand
            identifiers:
              domain: auth.phorge.fr
            attrs:
              default: true
              flow_device_code: !KeyOf device-code-flow
              branding_title: Phorge
              branding_logo: https://avatars.githubusercontent.com/u/187407936
              branding_favicon: https://avatars.githubusercontent.com/u/187407936
              branding_default_flow_background: /static/dist/assets/images/user_default.png
              # A neutral look, until there is a real identity: one accent (the blue of the logo, darkened for the buttons so the
              # white text stays readable), a soft background, a rounded card. Everything is a variable or a CSS part, no image
              # and no font is fetched from another host. The ::part() rules reach the flow card from the page, the rest is
              # inherited through the shadow roots.
              branding_custom_css: |-
                :root {
                  --phorge-accent: #3db5ff;
                  --pf-global--primary-color--100: #0b78c4;
                  --pf-global--primary-color--200: #095f9d;
                  --pf-global--link--Color: #0b78c4;
                  --pf-global--link--Color--hover: #095f9d;
                  --pf-global--active-color--100: #0b78c4;
                  --pf-global--BorderRadius--sm: 8px;
                }
                :root[data-theme="dark"] {
                  --pf-global--primary-color--100: #3db5ff;
                  --pf-global--primary-color--200: #7ccdff;
                  --pf-global--link--Color: #3db5ff;
                  --pf-global--link--Color--hover: #7ccdff;
                  --pf-global--active-color--100: #3db5ff;
                }
                ak-flow-executor {
                  background:
                    radial-gradient(900px 480px at 15% -10%, rgba(61, 181, 255, 0.16), transparent 60%),
                    linear-gradient(180deg, #f8fafc, #eef2f6);
                }
                :root[data-theme="dark"] ak-flow-executor {
                  background:
                    radial-gradient(900px 480px at 15% -10%, rgba(61, 181, 255, 0.14), transparent 60%),
                    linear-gradient(180deg, #11161c, #0b0f14);
                }
                ak-flow-executor::part(main) {
                  border-radius: 14px;
                  border: 1px solid rgba(16, 40, 64, 0.08);
                  box-shadow: 0 12px 40px rgba(16, 40, 64, 0.12);
                }
                :root[data-theme="dark"] ak-flow-executor::part(main) {
                  border-color: rgba(255, 255, 255, 0.08);
                  box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
                }
                .branding-logo {
                  max-height: 88px;
                  width: auto;
                }
                /* white on the light background by default: readable in both themes */
                ak-flow-executor::part(footer),
                ak-flow-executor::part(locale-select),
                .pf-c-login__footer,
                .pf-c-login__footer a,
                .pf-c-login__footer p,
                ak-locale-select,
                ak-locale-select * {
                  color: #4a5663;
                  text-shadow: none;
                }
                :root[data-theme="dark"] ak-flow-executor::part(footer),
                :root[data-theme="dark"] ak-flow-executor::part(locale-select),
                :root[data-theme="dark"] .pf-c-login__footer,
                :root[data-theme="dark"] .pf-c-login__footer a,
                :root[data-theme="dark"] .pf-c-login__footer p,
                :root[data-theme="dark"] ak-locale-select,
                :root[data-theme="dark"] ak-locale-select * {
                  color: #aab4bf;
                }
              attributes:
                settings:
                  locale: en
          # The icons of the applications, pinned to a commit of homarr-labs/dashboard-icons. The library is hidden from the users
          # (meta_hide): they have no reason to see the applications, the icons are for the administrators. There is no
          # Crossview icon, so it takes the one of Crossplane. These entries only set the icon and the visibility, the
          # provider and the rest come from the blueprint of each application.
          - model: authentik_core.application
            id: grafana-application
            identifiers:
              slug: grafana
            attrs:
              name: Grafana
              slug: grafana
              meta_hide: true
              meta_icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons@83f32e08257b66fbd971ac8d7645f5b38d52e85d/svg/grafana.svg
          - model: authentik_core.application
            id: forgejo-application
            identifiers:
              slug: forgejo
            attrs:
              name: Forgejo
              slug: forgejo
              meta_hide: true
              meta_icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons@83f32e08257b66fbd971ac8d7645f5b38d52e85d/svg/forgejo.svg
          - model: authentik_core.application
            identifiers:
              slug: incus
            attrs:
              name: Incus
              slug: incus
              meta_hide: true
              meta_icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons@83f32e08257b66fbd971ac8d7645f5b38d52e85d/svg/incus.svg
          - model: authentik_core.application
            identifiers:
              slug: crossview
            attrs:
              name: Crossview
              slug: crossview
              meta_hide: true
              meta_icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons@83f32e08257b66fbd971ac8d7645f5b38d52e85d/svg/crossplane.svg
          - model: authentik_core.application
            identifiers:
              slug: phorge
            attrs:
              name: Phorge
              slug: phorge
              meta_hide: true
              meta_icon: https://avatars.githubusercontent.com/u/187407936
          # Hiding an application does not protect it: any signed-in account could still open it. Grafana and Forgejo are
          # administration tools, so only the platform administrators may use them (Crossview already has its own group). Incus and the Phorge console stay open: what a person may do there is decided by OpenFGA, not by this.
          - model: authentik_core.group
            id: platform-admins-group
            identifiers:
              name: phorge-platform-admins
            attrs:
              name: phorge-platform-admins
          - model: authentik_policies.policybinding
            identifiers:
              target: !KeyOf grafana-application
              group: !KeyOf platform-admins-group
              order: 0
            attrs:
              target: !KeyOf grafana-application
              group: !KeyOf platform-admins-group
              order: 0
              enabled: true
              negate: false
              timeout: 30
          - model: authentik_policies.policybinding
            identifiers:
              target: !KeyOf forgejo-application
              group: !KeyOf platform-admins-group
              order: 0
            attrs:
              target: !KeyOf forgejo-application
              group: !KeyOf platform-admins-group
              order: 0
              enabled: true
              negate: false
              timeout: 30
