apiVersion: v1
kind: ConfigMap
metadata:
    name: authentik-crossplane-blueprint
    namespace: authentik
data:
    crossplane.yaml: |
        # yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
        version: 1
        metadata:
          name: crossplane
          labels:
            blueprints.goauthentik.io/description: Service account of the Crossplane provider-authentik
        entries:
          # An API key of Phorge is an Authentik identity: Crossplane (provider-authentik, control cluster) creates a service
          # account and its token for each ApiKey. The token of this account is the one the provider presents. It reaches
          # Authentik on the API paths only, at https://authentik.core.phorge (see ingress-local.yml). The key of the token
          # comes from the environment of authentik (the Secret authentik-crossplane-provider, see authentik.yml), the same
          # value the provider holds on the control cluster.
          #
          # A blueprint can give a role global permissions (a list on the role) as well as object permissions. The role holds
          # what the ApiKey needs, users and tokens, and nothing else: no flows, applications, providers or policies. A new
          # kind managed by Crossplane adds its permissions here. Whoever can change users can also change their groups, so
          # the token is as sensitive as an administrator one: it stays in the two Secrets and nowhere else (rotate it by
          # changing both).
          - model: authentik_core.user
            id: crossplane-provider-user
            identifiers:
              username: crossplane-provider
            attrs:
              username: crossplane-provider
              name: Crossplane provider-authentik (creates the identities of the API keys)
              type: service_account
              path: goauthentik.io/service-accounts
              is_active: true
          - model: authentik_rbac.role
            id: crossplane-provider-role
            identifiers:
              name: crossplane-provider
            attrs:
              name: crossplane-provider
              permissions:
                - authentik_core.view_user
                - authentik_core.add_user
                - authentik_core.change_user
                - authentik_core.delete_user
                - authentik_core.view_token
                - authentik_core.add_token
                - authentik_core.change_token
                - authentik_core.delete_token
                - authentik_core.view_token_key
          - model: authentik_core.group
            identifiers:
              name: crossplane-provider
            attrs:
              name: crossplane-provider
              roles:
                - !KeyOf crossplane-provider-role
              users:
                - !KeyOf crossplane-provider-user
          - model: authentik_core.token
            identifiers:
              identifier: crossplane-provider
            attrs:
              identifier: crossplane-provider
              description: Read by provider-authentik (control cluster) to manage the service accounts of the API keys
              intent: api
              user: !KeyOf crossplane-provider-user
              expiring: false
              key: !Env CROSSPLANE_PROVIDER_TOKEN
