apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
    name: traefik-public
    namespace: traefik
spec:
    values:
        # The HTTP audit log: one JSON line per request on the standard output, collected by Alloy into Loki (which adds the
        # country and the network of the client, overlays/core/controllers/alloy). Only the User-Agent header is kept (the
        # Authorization and Cookie headers never are), and the query string of the path is dropped (v3.7.3+): it can hold an OAuth
        # code, a state or a device code. The Referer is dropped for the same reason.
        accessLog:
            enabled: true
            format: json
            fields:
                defaultMode: keep
                headers:
                    defaultMode: drop
                    names:
                        User-Agent: keep
                queryParameters:
                    defaultMode: drop
        # One pod on every node, a new one is ready before the old one stops (the chart's rolling update, maxSurge 1): the node
        # that answers for the address of the service (Cilium L2 announcement) always has a local pod, which
        # externalTrafficPolicy Local needs.
        deployment:
            kind: DaemonSet
        service:
            annotations:
                lbipam.cilium.io/ips: 10.2.0.11
            spec:
                # With Cluster the node that answers for the address rewrites the source of a connection whose pod is on another
                # node (to the Cilium address of that node), so the PROXY protocol of the edge HAProxy comes from an address that is
                # not in trustedIPs and is dropped: every sign-in showed up as 10.244.x.x, with no country. Local keeps the source.
                externalTrafficPolicy: Local
        ports:
            websecure:
                proxyProtocol:
                    trustedIPs:
                        - 10.2.0.254/32
