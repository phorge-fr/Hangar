apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
    name: traefik-local
    namespace: traefik
spec:
    values:
        # The HTTP audit log: one JSON line per request on the standard output, collected by Alloy into Loki (which adds the
        # country and the network of the client, overlays/core/controllers/alloy). Only the User-Agent header is kept (the
        # Authorization and Cookie headers never are), and the query string of the path is dropped (v3.7.3+): it can hold an OAuth
        # code, a state or a device code. The Referer is dropped for the same reason.
        accessLog:
            enabled: true
            format: json
            fields:
                defaultMode: keep
                headers:
                    defaultMode: drop
                    names:
                        User-Agent: keep
                queryParameters:
                    defaultMode: drop
        service:
            annotations:
                lbipam.cilium.io/ips: 10.2.0.10
