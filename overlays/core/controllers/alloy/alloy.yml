apiVersion: v1
kind: Namespace
metadata:
    name: alloy
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
    name: alloy
    namespace: alloy
spec:
    interval: 1h0s
    url: https://grafana.github.io/helm-charts
---
# Prometheus is a pod and can't reach the scheduler and the controller-manager: they are host
# processes of the k0s controllers and only listen on the loopback of their node. This
# node-local Alloy, on the host network, scrapes them and pushes to the Prometheus of the cluster.
# The other clusters do the same from their own Alloy (base/controllers/alloy).
# Also runs its own node-exporter (same as base/controllers/alloy) instead of the chart's
# nodeExporter subchart (disabled below, in kube-prometheus-stack.yml): one DaemonSet pod per
# node instead of two, same metric names/instance labels so the stock dashboards don't notice.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
    name: alloy
    namespace: alloy
spec:
    chart:
        spec:
            chart: alloy
            version: '1.13.1'
            sourceRef:
                kind: HelmRepository
                name: alloy
    interval: 1h0s
    timeout: 5m0s
    values:
        alloy:
            # Alloy only pushes: keep its HTTP server (needed by the readiness probe and the
            # config reloader) on the loopback, and skip the usage reporting to Grafana Labs.
            listenAddr: 127.0.0.1
            enableReporting: false
            configMap:
                create: true
                content: |
                    logging {
                        level = "info"
                    }

                    // Job names are the ones the chart's rules and dashboards select on. etcd serves its
                    // metrics on the loopback through listen-metrics-urls in the k0s config.
                    //
                    // This block down to controlplane_filter is identical to the one in
                    // base/controllers/alloy/alloy.yml (control/svc): keep both in sync by hand.
                    // Alloy's config is one opaque string in the Helm values, so Kustomize can't
                    // share or patch pieces of it across files — this fork exists only because
                    // core also needs the apiserver/kubelet/node scrapes handled differently
                    // (by kube-prometheus-stack's own ServiceMonitors instead of Alloy).
                    prometheus.scrape "kube_scheduler" {
                        job_name          = "kube-scheduler"
                        targets           = [{"__address__" = "127.0.0.1:10259", "instance" = sys.env("K8S_NODE_NAME"), "node" = sys.env("K8S_NODE_NAME")}]
                        scheme            = "https"
                        bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"

                        tls_config {
                            insecure_skip_verify = true
                        }

                        forward_to = [prometheus.relabel.controlplane_filter.receiver]
                    }

                    prometheus.scrape "kube_controller_manager" {
                        job_name          = "kube-controller-manager"
                        targets           = [{"__address__" = "127.0.0.1:10257", "instance" = sys.env("K8S_NODE_NAME"), "node" = sys.env("K8S_NODE_NAME")}]
                        scheme            = "https"
                        bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"

                        tls_config {
                            insecure_skip_verify = true
                        }

                        forward_to = [prometheus.relabel.controlplane_filter.receiver]
                    }

                    prometheus.scrape "etcd" {
                        job_name   = "etcd"
                        targets    = [{"__address__" = "127.0.0.1:2381", "instance" = sys.env("K8S_NODE_NAME"), "node" = sys.env("K8S_NODE_NAME")}]
                        forward_to = [prometheus.relabel.controlplane_filter.receiver]
                    }

                    // The pod shares the host's network and mounts the host rootfs (see the
                    // controller values below), so the exporter reports the machine rather than
                    // the Alloy pod.
                    prometheus.exporter.unix "node" {
                        rootfs_path    = "/host/root"
                        udev_data_path = "/host/root/run/udev/data"
                    }

                    discovery.relabel "node" {
                        targets = prometheus.exporter.unix.node.targets

                        rule {
                            target_label = "job"
                            replacement  = "node-exporter"
                        }
                        rule {
                            target_label = "node"
                            replacement  = sys.env("K8S_NODE_NAME")
                        }
                    }

                    prometheus.scrape "node" {
                        job_name   = "node-exporter"
                        targets    = discovery.relabel.node.output
                        forward_to = [prometheus.remote_write.local.receiver]
                    }

                    // Feature gates, workqueue/informer bucket histograms and etcd's own gRPC server
                    // instrumentation: none of it is read by the chart's dashboards or rules. etcd
                    // only keeps the three bucket histograms that its rules read (WAL fsync, backend
                    // commit and peer round trip time).
                    prometheus.relabel "controlplane_filter" {
                        forward_to = [prometheus.remote_write.local.receiver]

                        rule {
                            source_labels = ["__name__"]
                            regex         = "kubernetes_feature_enabled|scheduler_plugin_execution_duration_seconds_bucket|scheduler_event_handling_duration_seconds_bucket|informer_processing_latency_seconds_bucket|workqueue_work_duration_seconds_bucket|workqueue_queue_duration_seconds_bucket|grpc_server_.*"
                            action        = "drop"
                        }

                        rule {
                            source_labels = ["__name__"]
                            regex         = "etcd_disk_wal_fsync_duration_seconds_bucket|etcd_disk_backend_commit_duration_seconds_bucket|etcd_network_peer_round_trip_time_seconds_bucket"
                            target_label  = "etcd_keep_bucket"
                            replacement   = "1"
                        }
                        rule {
                            source_labels = ["__name__", "etcd_keep_bucket"]
                            regex         = "etcd_.*_bucket;"
                            action        = "drop"
                        }
                        rule {
                            regex  = "etcd_keep_bucket"
                            action = "labeldrop"
                        }
                    }

                    // The remote write receiver of the local Prometheus, reached inside the cluster.
                    prometheus.remote_write "local" {
                        endpoint {
                            url = "http://kube-prometheus-stack-prometheus.kube-prometheus-stack.svc.cluster.local:9090/api/v1/write"
                        }

                        external_labels = {
                            cluster = "core",
                        }
                    }

                    // Same node-local pod discovery as the other clusters (base/controllers/alloy),
                    // tailing only this node's pods so each log line is sent once. Loki is
                    // in-cluster here, no auth/TLS needed (unlike the other clusters, which push
                    // to it over the network through Traefik).
                    discovery.kubernetes "pods" {
                        role = "pod"

                        selectors {
                            role  = "pod"
                            field = "spec.nodeName=" + sys.env("K8S_NODE_NAME")
                        }
                    }

                    discovery.relabel "pods" {
                        targets = discovery.kubernetes.pods.targets

                        rule {
                            source_labels = ["__meta_kubernetes_namespace"]
                            target_label  = "namespace"
                        }
                        rule {
                            source_labels = ["__meta_kubernetes_pod_name"]
                            target_label  = "pod"
                        }
                        rule {
                            source_labels = ["__meta_kubernetes_pod_container_name"]
                            target_label  = "container"
                        }
                    }

                    loki.source.kubernetes "pods" {
                        targets    = discovery.relabel.pods.output
                        forward_to = [loki.write.local.receiver]
                    }

                    loki.write "local" {
                        endpoint {
                            url = "http://loki.loki.svc.cluster.local:3100/loki/api/v1/push"
                        }

                        external_labels = {
                            cluster = "core",
                        }
                    }
            mounts:
                extra:
                    - name: rootfs
                      mountPath: /host/root
                      readOnly: true
                      mountPropagation: HostToContainer
        controller:
            type: daemonset
            hostNetwork: true
            dnsPolicy: ClusterFirstWithHostNet
            volumes:
                extra:
                    - name: rootfs
                      hostPath:
                          path: /
    postRenderers:
        # The chart probes the pod IP, which is the node IP under hostNetwork: probe the
        # loopback instead so the HTTP server doesn't have to listen on the node network.
        - kustomize:
              patches:
                  - target:
                        kind: DaemonSet
                        name: alloy
                    patch: |-
                        - op: add
                          path: /spec/template/spec/containers/0/readinessProbe/httpGet/host
                          value: 127.0.0.1
