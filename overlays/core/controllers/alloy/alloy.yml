apiVersion: v1
kind: Namespace
metadata:
    name: alloy
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
    name: alloy
    namespace: alloy
spec:
    interval: 1h0s
    url: https://grafana.github.io/helm-charts
---
# Prometheus is a pod and can't reach the scheduler and the controller-manager: they are host
# processes of the k0s controllers and only listen on the loopback of their node. This
# node-local Alloy, on the host network, scrapes them and pushes to the Prometheus of the cluster.
# The other clusters do the same from their own Alloy (base/controllers/alloy).
# Also runs its own node-exporter (same as base/controllers/alloy) instead of the chart's
# nodeExporter subchart (disabled below, in kube-prometheus-stack.yml): one DaemonSet pod per
# node instead of two, same metric names/instance labels so the stock dashboards don't notice.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
    name: alloy
    namespace: alloy
spec:
    chart:
        spec:
            chart: alloy
            version: '1.15.0'
            sourceRef:
                kind: HelmRepository
                name: alloy
    interval: 1h0s
    timeout: 5m0s
    values:
        alloy:
            # Alloy only pushes: keep its HTTP server (needed by the readiness probe and the
            # config reloader) on the loopback, and skip the usage reporting to Grafana Labs.
            listenAddr: 127.0.0.1
            enableReporting: false
            # Where Alloy keeps the read position of the files it tails (the audit log): on the node, not lost with the pod
            storagePath: /var/lib/alloy-data
            configMap:
                create: true
                content: |
                    logging {
                        level = "info"
                    }

                    // Job names are the ones the chart's rules and dashboards select on. etcd serves its
                    // metrics on the loopback through listen-metrics-urls in the k0s config.
                    //
                    // This block down to controlplane_filter is identical to the one in
                    // base/controllers/alloy/alloy.yml (control/svc): keep both in sync by hand.
                    // Alloy's config is one opaque string in the Helm values, so Kustomize can't
                    // share or patch pieces of it across files — this fork exists only because
                    // core also needs the apiserver/kubelet/node scrapes handled differently
                    // (by kube-prometheus-stack's own ServiceMonitors instead of Alloy).
                    prometheus.scrape "kube_scheduler" {
                        job_name          = "kube-scheduler"
                        targets           = [{"__address__" = "127.0.0.1:10259", "instance" = sys.env("K8S_NODE_NAME"), "node" = sys.env("K8S_NODE_NAME")}]
                        scheme            = "https"
                        bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"

                        tls_config {
                            insecure_skip_verify = true
                        }

                        forward_to = [prometheus.relabel.controlplane_filter.receiver]
                    }

                    prometheus.scrape "kube_controller_manager" {
                        job_name          = "kube-controller-manager"
                        targets           = [{"__address__" = "127.0.0.1:10257", "instance" = sys.env("K8S_NODE_NAME"), "node" = sys.env("K8S_NODE_NAME")}]
                        scheme            = "https"
                        bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"

                        tls_config {
                            insecure_skip_verify = true
                        }

                        forward_to = [prometheus.relabel.controlplane_filter.receiver]
                    }

                    prometheus.scrape "etcd" {
                        job_name   = "etcd"
                        targets    = [{"__address__" = "127.0.0.1:2381", "instance" = sys.env("K8S_NODE_NAME"), "node" = sys.env("K8S_NODE_NAME")}]
                        forward_to = [prometheus.relabel.controlplane_filter.receiver]
                    }

                    // The pod shares the host's network and mounts the host rootfs (see the
                    // controller values below), so the exporter reports the machine rather than
                    // the Alloy pod.
                    prometheus.exporter.unix "node" {
                        rootfs_path    = "/host/root"
                        udev_data_path = "/host/root/run/udev/data"
                    }

                    discovery.relabel "node" {
                        targets = prometheus.exporter.unix.node.targets

                        rule {
                            target_label = "job"
                            replacement  = "node-exporter"
                        }
                        rule {
                            target_label = "node"
                            replacement  = sys.env("K8S_NODE_NAME")
                        }
                    }

                    prometheus.scrape "node" {
                        job_name   = "node-exporter"
                        targets    = discovery.relabel.node.output
                        forward_to = [prometheus.remote_write.local.receiver]
                    }

                    // Feature gates, workqueue/informer bucket histograms and etcd's own gRPC server
                    // instrumentation: none of it is read by the chart's dashboards or rules. etcd
                    // only keeps the three bucket histograms that its rules read (WAL fsync, backend
                    // commit and peer round trip time).
                    prometheus.relabel "controlplane_filter" {
                        forward_to = [prometheus.remote_write.local.receiver]

                        rule {
                            source_labels = ["__name__"]
                            regex         = "kubernetes_feature_enabled|scheduler_plugin_execution_duration_seconds_bucket|scheduler_event_handling_duration_seconds_bucket|informer_processing_latency_seconds_bucket|workqueue_work_duration_seconds_bucket|workqueue_queue_duration_seconds_bucket|grpc_server_.*"
                            action        = "drop"
                        }

                        rule {
                            source_labels = ["__name__"]
                            regex         = "etcd_disk_wal_fsync_duration_seconds_bucket|etcd_disk_backend_commit_duration_seconds_bucket|etcd_network_peer_round_trip_time_seconds_bucket"
                            target_label  = "etcd_keep_bucket"
                            replacement   = "1"
                        }
                        rule {
                            source_labels = ["__name__", "etcd_keep_bucket"]
                            regex         = "etcd_.*_bucket;"
                            action        = "drop"
                        }
                        rule {
                            regex  = "etcd_keep_bucket"
                            action = "labeldrop"
                        }
                    }

                    // The remote write receiver of the local Prometheus, reached inside the cluster.
                    prometheus.remote_write "local" {
                        endpoint {
                            url = "http://kube-prometheus-stack-prometheus.kube-prometheus-stack.svc.cluster.local:9090/api/v1/write"
                        }

                        external_labels = {
                            cluster = "core",
                        }
                    }

                    // Same node-local pod discovery as the other clusters (base/controllers/alloy),
                    // tailing only this node's pods so each log line is sent once. Loki is
                    // in-cluster here, no auth/TLS needed (unlike the other clusters, which push
                    // to it over the network through Traefik).
                    discovery.kubernetes "pods" {
                        role = "pod"

                        selectors {
                            role  = "pod"
                            field = "spec.nodeName=" + sys.env("K8S_NODE_NAME")
                        }
                    }

                    discovery.relabel "pods" {
                        targets = discovery.kubernetes.pods.targets

                        rule {
                            source_labels = ["__meta_kubernetes_namespace"]
                            target_label  = "namespace"
                        }
                        rule {
                            source_labels = ["__meta_kubernetes_pod_name"]
                            target_label  = "pod"
                        }
                        rule {
                            source_labels = ["__meta_kubernetes_pod_container_name"]
                            target_label  = "container"
                        }
                    }

                    loki.source.kubernetes "pods" {
                        targets    = discovery.relabel.pods.output
                        forward_to = [loki.process.enrich.receiver]
                    }

                    // The access log of Traefik (JSON, one line per request) gets the country and the network of the client
                    // address, looked up in the DB-IP databases that the init container of this pod keeps in /geoip. The two
                    // fields are written into the JSON line, so Loki reads them back with | json: a country is cheap, but the
                    // network has too many values for a label. Everything else is passed on untouched. A private address
                    // (LAN, cluster) has neither.
                    loki.process "enrich" {
                        forward_to = [loki.write.local.receiver]

                        stage.match {
                            selector = "{namespace=\"traefik\"} |= \"\\\"ClientHost\\\"\""

                            stage.json {
                                expressions = {client_ip = "ClientHost", req_host = "RequestHost", req_status = "DownstreamStatus"}
                            }
                            // The pushes of logs and metrics of every Alloy (loki.core.phorge, prometheus.core.phorge) are most of
                            // the requests, and each one would log a line that has to be pushed in turn: only the successful
                            // ones are left out, a refused or failed push stays in the audit.
                            stage.drop {
                                source              = "req_host,req_status"
                                separator           = ";"
                                expression          = "^(loki|prometheus)\\.core\\.phorge;204$"
                                drop_counter_reason = "machine_push"
                            }
                            stage.geoip {
                                source  = "client_ip"
                                db      = "/geoip/country.mmdb"
                                db_type = "country"
                            }
                            stage.geoip {
                                source  = "client_ip"
                                db      = "/geoip/asn.mmdb"
                                db_type = "asn"
                            }
                            // the network name goes into a JSON string: no double quote or backslash in it
                            stage.template {
                                source   = "geo_org"
                                template = "{{ "{{" }} if .geoip_autonomous_system_organization {{ "}}" }}{{ "{{" }} Replace (Replace .geoip_autonomous_system_organization \"\\\"\" \"'\" -1) \"\\\\\" \"\" -1 {{ "}}" }}{{ "{{" }} end {{ "}}" }}"
                            }
                            stage.replace {
                                expression = "(\\})\\s*$"
                                replace    = ",\"GeoCountry\":\"{{ "{{" }} with .geoip_country_code {{ "}}" }}{{ "{{" }} . {{ "}}" }}{{ "{{" }} end {{ "}}" }}\",\"GeoAsn\":\"{{ "{{" }} with .geoip_autonomous_system_number {{ "}}" }}{{ "{{" }} . {{ "}}" }}{{ "{{" }} end {{ "}}" }}\",\"GeoOrg\":\"{{ "{{" }} with .geo_org {{ "}}" }}{{ "{{" }} . {{ "}}" }}{{ "{{" }} end {{ "}}" }}\"}"
                            }
                        }
                    }

                    // The audit log of the kube-apiserver (docs/kubernetes-audit.md): a JSON file on every control plane node, written by
                    // the API server itself (clusters/*/setup/k0s-cluster.yml). The lines go to Loki untouched, with the node; the
                    // writer adds the cluster. The read position is kept on the node (storagePath), so a restart of Alloy neither
                    // loses lines nor sends them twice.
                    local.file_match "k8s_audit" {
                        path_targets = [{
                            "__path__" = "/host/root/var/lib/k0s-audit/audit.log",
                            "job"      = "k8s-audit",
                            "node"     = sys.env("K8S_NODE_NAME"),
                        }]
                    }

                    loki.source.file "k8s_audit" {
                        targets    = local.file_match.k8s_audit.targets
                        forward_to = [loki.write.local.receiver]
                    }

                    loki.write "local" {
                        endpoint {
                            url = "http://loki.loki.svc.cluster.local:3100/loki/api/v1/push"
                        }

                        external_labels = {
                            cluster = "core",
                        }
                    }
            mounts:
                extra:
                    - name: rootfs
                      mountPath: /host/root
                      readOnly: true
                      mountPropagation: HostToContainer
                    - name: geoip
                      mountPath: /geoip
                      readOnly: true
                    - name: data
                      mountPath: /var/lib/alloy-data
        controller:
            type: daemonset
            hostNetwork: true
            dnsPolicy: ClusterFirstWithHostNet
            volumes:
                extra:
                    - name: rootfs
                      hostPath:
                          path: /
                    # DB-IP databases, kept on the node so that a failed download at a restart does not leave Alloy without them
                    - name: geoip
                      hostPath:
                          path: /var/lib/alloy-geoip
                          type: DirectoryOrCreate
                    - name: data
                      hostPath:
                          path: /var/lib/alloy-data
                          type: DirectoryOrCreate
            # Fetches the free DB-IP country and network databases (monthly, CC BY 4.0: "IP Geolocation by DB-IP") at each start.
            # Best effort: the old file stays when the download fails, and the pod starts either way.
            initContainers:
                - name: geoip
                  image: docker.io/curlimages/curl:8.23.0
                  securityContext:
                      runAsUser: 0
                  command:
                      - sh
                      - -c
                      - |
                        y=$(date +%Y); m=$(date +%m)
                        pm=$((10#$m - 1)); py=$y
                        if [ "$pm" -eq 0 ]; then pm=12; py=$((y - 1)); fi
                        pm=$(printf '%02d' "$pm")
                        for kind in country asn; do
                          for ym in "$y-$m" "$py-$pm"; do
                            if curl -fsS --max-time 120 -o "/geoip/$kind.mmdb.gz" "https://download.db-ip.com/free/dbip-$kind-lite-$ym.mmdb.gz" \
                              && gunzip -c "/geoip/$kind.mmdb.gz" > "/geoip/$kind.mmdb.new" && mv "/geoip/$kind.mmdb.new" "/geoip/$kind.mmdb"; then
                              echo "$kind: $ym"; break
                            fi
                          done
                          rm -f "/geoip/$kind.mmdb.gz" "/geoip/$kind.mmdb.new"
                        done
                        ls -l /geoip
                        exit 0
                  volumeMounts:
                      - name: geoip
                        mountPath: /geoip
    postRenderers:
        # The chart probes the pod IP, which is the node IP under hostNetwork: probe the
        # loopback instead so the HTTP server doesn't have to listen on the node network.
        - kustomize:
              patches:
                  - target:
                        kind: DaemonSet
                        name: alloy
                    patch: |-
                        - op: add
                          path: /spec/template/spec/containers/0/readinessProbe/httpGet/host
                          value: 127.0.0.1
