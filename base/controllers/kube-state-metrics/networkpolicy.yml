# Alloy runs in the host network: its scrapes come from the host or remote-node identity.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
    name: kube-state-metrics
    namespace: kube-state-metrics
spec:
    endpointSelector:
        matchLabels:
            app.kubernetes.io/name: kube-state-metrics
    ingress:
        - fromEntities:
              - host
              - remote-node
          toPorts:
              - ports:
                    - port: "8080"
                      protocol: TCP
                    - port: "8081"
                      protocol: TCP
    egress:
        - toEntities:
              - kube-apiserver
          toPorts:
              - ports:
                    - port: "6443"
                      protocol: TCP
