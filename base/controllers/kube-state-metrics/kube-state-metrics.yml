apiVersion: v1
kind: Namespace
metadata:
    name: kube-state-metrics
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
    name: prometheus-community
    namespace: kube-state-metrics
spec:
    interval: 1h0s
    url: https://prometheus-community.github.io/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
    name: kube-state-metrics
    namespace: kube-state-metrics
spec:
    chart:
        spec:
            chart: kube-state-metrics
            version: '8.8.0'
            sourceRef:
                kind: HelmRepository
                name: prometheus-community
    interval: 1h0s
    timeout: 5m0s
    # The state of the Flux objects (ready, suspended, revision) as gotk_resource_info, through the custom
    # resource state. The same block is in the kube-prometheus-stack values of core, where it sits
    # under the chart's kube-state-metrics key.
    values:
        # Also exposes its own telemetry port (8081) on the Service, scraped by Alloy
        # (base/controllers/alloy): the KubeStateMetrics* rules of the chart read
        # kube_state_metrics_* series that only exist there (#65).
        selfMonitor:
            enabled: true
        rbac:
            extraRules:
                - apiGroups:
                      - source.toolkit.fluxcd.io
                      - kustomize.toolkit.fluxcd.io
                      - helm.toolkit.fluxcd.io
                      - notification.toolkit.fluxcd.io
                  resources:
                      - gitrepositories
                      - buckets
                      - helmrepositories
                      - helmcharts
                      - ocirepositories
                      - kustomizations
                      - helmreleases
                      - alerts
                      - providers
                      - receivers
                  verbs: [list, watch]
        customResourceState:
            enabled: true
            config:
                spec:
                    resources:
                        - groupVersionKind:
                              group: kustomize.toolkit.fluxcd.io
                              version: v1
                              kind: Kustomization
                          metricNamePrefix: gotk
                          metrics:
                              - name: resource_info
                                help: "The current state of a Flux Kustomization resource."
                                each:
                                    type: Info
                                    info:
                                        labelsFromPath:
                                            name: [metadata, name]
                                labelsFromPath:
                                    exported_namespace: [metadata, namespace]
                                    ready: [status, conditions, "[type=Ready]", status]
                                    suspended: [spec, suspend]
                                    revision: [status, lastAppliedRevision]
                                    source_name: [spec, sourceRef, name]
                        - groupVersionKind:
                              group: helm.toolkit.fluxcd.io
                              version: v2
                              kind: HelmRelease
                          metricNamePrefix: gotk
                          metrics:
                              - name: resource_info
                                help: "The current state of a Flux HelmRelease resource."
                                each:
                                    type: Info
                                    info:
                                        labelsFromPath:
                                            name: [metadata, name]
                                labelsFromPath:
                                    exported_namespace: [metadata, namespace]
                                    ready: [status, conditions, "[type=Ready]", status]
                                    suspended: [spec, suspend]
                                    revision: [status, history, "0", chartVersion]
                                    chart_name: [status, history, "0", chartName]
                                    chart_app_version: [status, history, "0", appVersion]
                                    chart_ref_name: [spec, chartRef, name]
                                    chart_source_name: [spec, chart, spec, sourceRef, name]
                        - groupVersionKind:
                              group: source.toolkit.fluxcd.io
                              version: v1
                              kind: GitRepository
                          metricNamePrefix: gotk
                          metrics:
                              - name: resource_info
                                help: "The current state of a Flux GitRepository resource."
                                each:
                                    type: Info
                                    info:
                                        labelsFromPath:
                                            name: [metadata, name]
                                labelsFromPath:
                                    exported_namespace: [metadata, namespace]
                                    ready: [status, conditions, "[type=Ready]", status]
                                    suspended: [spec, suspend]
                                    revision: [status, artifact, revision]
                                    url: [spec, url]
                        - groupVersionKind:
                              group: source.toolkit.fluxcd.io
                              version: v1
                              kind: Bucket
                          metricNamePrefix: gotk
                          metrics:
                              - name: resource_info
                                help: "The current state of a Flux Bucket resource."
                                each:
                                    type: Info
                                    info:
                                        labelsFromPath:
                                            name: [metadata, name]
                                labelsFromPath:
                                    exported_namespace: [metadata, namespace]
                                    ready: [status, conditions, "[type=Ready]", status]
                                    suspended: [spec, suspend]
                                    revision: [status, artifact, revision]
                                    endpoint: [spec, endpoint]
                                    bucket_name: [spec, bucketName]
                        - groupVersionKind:
                              group: source.toolkit.fluxcd.io
                              version: v1
                              kind: HelmRepository
                          metricNamePrefix: gotk
                          metrics:
                              - name: resource_info
                                help: "The current state of a Flux HelmRepository resource."
                                each:
                                    type: Info
                                    info:
                                        labelsFromPath:
                                            name: [metadata, name]
                                labelsFromPath:
                                    exported_namespace: [metadata, namespace]
                                    ready: [status, conditions, "[type=Ready]", status]
                                    suspended: [spec, suspend]
                                    revision: [status, artifact, revision]
                                    url: [spec, url]
                        - groupVersionKind:
                              group: source.toolkit.fluxcd.io
                              version: v1
                              kind: HelmChart
                          metricNamePrefix: gotk
                          metrics:
                              - name: resource_info
                                help: "The current state of a Flux HelmChart resource."
                                each:
                                    type: Info
                                    info:
                                        labelsFromPath:
                                            name: [metadata, name]
                                labelsFromPath:
                                    exported_namespace: [metadata, namespace]
                                    ready: [status, conditions, "[type=Ready]", status]
                                    suspended: [spec, suspend]
                                    revision: [status, artifact, revision]
                                    chart_name: [spec, chart]
                                    chart_version: [spec, version]
                        - groupVersionKind:
                              group: source.toolkit.fluxcd.io
                              version: v1
                              kind: OCIRepository
                          metricNamePrefix: gotk
                          metrics:
                              - name: resource_info
                                help: "The current state of a Flux OCIRepository resource."
                                each:
                                    type: Info
                                    info:
                                        labelsFromPath:
                                            name: [metadata, name]
                                labelsFromPath:
                                    exported_namespace: [metadata, namespace]
                                    ready: [status, conditions, "[type=Ready]", status]
                                    suspended: [spec, suspend]
                                    revision: [status, artifact, revision]
                                    url: [spec, url]
                        - groupVersionKind:
                              group: notification.toolkit.fluxcd.io
                              version: v1beta3
                              kind: Alert
                          metricNamePrefix: gotk
                          metrics:
                              - name: resource_info
                                help: "The current state of a Flux Alert resource."
                                each:
                                    type: Info
                                    info:
                                        labelsFromPath:
                                            name: [metadata, name]
                                labelsFromPath:
                                    exported_namespace: [metadata, namespace]
                                    suspended: [spec, suspend]
                        - groupVersionKind:
                              group: notification.toolkit.fluxcd.io
                              version: v1beta3
                              kind: Provider
                          metricNamePrefix: gotk
                          metrics:
                              - name: resource_info
                                help: "The current state of a Flux Provider resource."
                                each:
                                    type: Info
                                    info:
                                        labelsFromPath:
                                            name: [metadata, name]
                                labelsFromPath:
                                    exported_namespace: [metadata, namespace]
                                    suspended: [spec, suspend]
                        - groupVersionKind:
                              group: notification.toolkit.fluxcd.io
                              version: v1
                              kind: Receiver
                          metricNamePrefix: gotk
                          metrics:
                              - name: resource_info
                                help: "The current state of a Flux Receiver resource."
                                each:
                                    type: Info
                                    info:
                                        labelsFromPath:
                                            name: [metadata, name]
                                labelsFromPath:
                                    exported_namespace: [metadata, namespace]
                                    ready: [status, conditions, "[type=Ready]", status]
                                    suspended: [spec, suspend]
