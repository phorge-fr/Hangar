apiVersion: v1
kind: Namespace
metadata:
    name: alloy
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
    name: alloy
    namespace: alloy
spec:
    interval: 1h0s
    url: https://grafana.github.io/helm-charts
---
apiVersion: v1
kind: ConfigMap
metadata:
    name: alloy-ca-cert
    namespace: alloy
data:
    ca.crt: |
        -----BEGIN CERTIFICATE-----
        MIIBczCCARqgAwIBAgIUKBUuuuomz67EA1eTzLvjTq6qLXQwCgYIKoZIzj0EAwIw
        GDEWMBQGA1UEAxMNbG9jYWwtcm9vdC1jYTAeFw0yNjA3MDExNDQ4NDZaFw0zNjA2
        MjgxNDQ4NDZaMBgxFjAUBgNVBAMTDWxvY2FsLXJvb3QtY2EwWTATBgcqhkjOPQIB
        BggqhkjOPQMBBwNCAARzKs8RHsdQKtAycnbBlXh0IDao3mZ3eLikoF4r5jIKPHMB
        37mWs+DU9Ia8ubOR4AtXmRHveqMBKqcegzPtmetso0IwQDAOBgNVHQ8BAf8EBAMC
        AqQwDwYDVR0TAQH/BAUwAwEB/zAdBgNVHQ4EFgQUbXGMASnO6bsAzmPqmKNQ3I3K
        /UAwCgYIKoZIzj0EAwIDRwAwRAIgaC/bPqnSH8T+V6M94Q+NjXkxzH4b9/edbTxV
