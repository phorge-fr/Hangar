---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
    name: alloy
    namespace: alloy
spec:
    chart:
        spec:
            chart: alloy
            version: '1.13.1'
            sourceRef:
                kind: HelmRepository
                name: alloy
    interval: 1h0s
    timeout: 5m0s
    values:
        alloy:
            # Alloy only pushes to Prometheus/Loki: keep its HTTP server (needed by the
            # readiness probe and the config reloader) on the loopback, and skip the
            # usage reporting to Grafana Labs.
            listenAddr: 127.0.0.1
            enableReporting: false
            configMap:
                create: true
                content: |
                    logging {
                        level = "info"
                    }

                    // Every Alloy pod only handles its own node: the DaemonSet runs on all of
                    // them, so discovering cluster-wide targets here would push each series
                    // once per node. Cluster-scoped scrapes live in the alloy-cluster release.
                    discovery.kubernetes "nodes" {
                        role = "node"

                        selectors {
                            role  = "node"
                            field = "metadata.name=" + sys.env("K8S_NODE_NAME")
                        }
                    }

                    discovery.relabel "cadvisor" {
                        targets = discovery.kubernetes.nodes.targets

                        rule {
                            source_labels = ["__meta_kubernetes_node_address_InternalIP"]
                            target_label  = "__address__"
                            replacement   = "$1:10250"
                        }
                        rule {
                            target_label = "__metrics_path__"
                            replacement  = "/metrics/cadvisor"
                        }
                        // The chart's recording rules filter on this label (on core the
                        // operator's ServiceMonitor sets it).
                        rule {
                            target_label = "metrics_path"
                            replacement  = "/metrics/cadvisor"
                        }
                        rule {
                            source_labels = ["__meta_kubernetes_node_name"]
                            target_label  = "node"
                        }
                    }

                    prometheus.scrape "cadvisor" {
                        job_name          = "kubelet"
                        targets           = discovery.relabel.cadvisor.output
                        scheme            = "https"
                        bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"

                        tls_config {
                            insecure_skip_verify = true
                        }

                        forward_to = [prometheus.relabel.controlplane_filter.receiver]
                    }

                    discovery.relabel "kubelet" {
                        targets = discovery.kubernetes.nodes.targets

                        rule {
                            source_labels = ["__meta_kubernetes_node_address_InternalIP"]
                            target_label  = "__address__"
                            replacement   = "$1:10250"
                        }
                        rule {
                            target_label = "metrics_path"
                            replacement  = "/metrics"
                        }
                        rule {
                            source_labels = ["__meta_kubernetes_node_name"]
                            target_label  = "node"
                        }
                    }

                    prometheus.scrape "kubelet" {
                        job_name          = "kubelet"
                        targets           = discovery.relabel.kubelet.output
                        scheme            = "https"
                        bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"

                        tls_config {
                            insecure_skip_verify = true
                        }

                        forward_to = [prometheus.relabel.controlplane_filter.receiver]
                    }

                    // The pod shares the host's network and PID namespaces and mounts the
                    // host rootfs (see the controller values below), so the exporter reports
                    // the machine rather than the Alloy pod.
                    prometheus.exporter.unix "node" {
                        rootfs_path    = "/host/root"
                        udev_data_path = "/host/root/run/udev/data"
                    }

                    discovery.relabel "node" {
                        targets = prometheus.exporter.unix.node.targets

                        rule {
                            target_label = "job"
                            replacement  = "node-exporter"
                        }
                        rule {
                            target_label = "node"
                            replacement  = sys.env("K8S_NODE_NAME")
                        }
                    }

                    prometheus.scrape "node" {
                        job_name   = "node-exporter"
                        targets    = discovery.relabel.node.output
                        forward_to = [prometheus.remote_write.core.receiver]
                    }

                    // The scheduler, the controller-manager and etcd are host processes of the k0s
                    // controllers and only listen on the loopback of their node (etcd through
                    // listen-metrics-urls in the k0s config), so they are scraped from the host
                    // network of the node-local pod. Job names are the ones the chart's rules and
                    // dashboards select on.
                    //
                    // This block down to controlplane_filter is identical to the one in
                    // overlays/core/controllers/alloy/alloy.yml (core's own forked Alloy config):
                    // keep both in sync by hand. Alloy's config is one opaque string in the Helm
                    // values, so Kustomize can't share or patch pieces of it across files.
                    prometheus.scrape "kube_scheduler" {
                        job_name          = "kube-scheduler"
                        targets           = [{"__address__" = "127.0.0.1:10259", "instance" = sys.env("K8S_NODE_NAME"), "node" = sys.env("K8S_NODE_NAME")}]
                        scheme            = "https"
                        bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"

                        tls_config {
                            insecure_skip_verify = true
                        }

                        forward_to = [prometheus.relabel.controlplane_filter.receiver]
                    }

                    prometheus.scrape "kube_controller_manager" {
                        job_name          = "kube-controller-manager"
                        targets           = [{"__address__" = "127.0.0.1:10257", "instance" = sys.env("K8S_NODE_NAME"), "node" = sys.env("K8S_NODE_NAME")}]
                        scheme            = "https"
                        bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"

                        tls_config {
                            insecure_skip_verify = true
                        }

                        forward_to = [prometheus.relabel.controlplane_filter.receiver]
                    }

                    prometheus.scrape "etcd" {
                        job_name   = "etcd"
                        targets    = [{"__address__" = "127.0.0.1:2381", "instance" = sys.env("K8S_NODE_NAME"), "node" = sys.env("K8S_NODE_NAME")}]
                        forward_to = [prometheus.relabel.controlplane_filter.receiver]
                    }

                    // Feature gates, workqueue/informer bucket histograms and etcd's own gRPC server
                    // instrumentation: none of it is read by the chart's dashboards or rules. etcd
                    // only keeps the three bucket histograms that its rules read (WAL fsync, backend
                    // commit and peer round trip time). Also filters the two kubelet scrapes above
                    // (cadvisor and the kubelet's own /metrics), which otherwise forward everything
                    // straight to remote_write with no filtering at all.
                    prometheus.relabel "controlplane_filter" {
                        forward_to = [prometheus.remote_write.core.receiver]

                        rule {
                            source_labels = ["__name__"]
                            regex         = "kubernetes_feature_enabled|scheduler_plugin_execution_duration_seconds_bucket|scheduler_event_handling_duration_seconds_bucket|informer_processing_latency_seconds_bucket|workqueue_work_duration_seconds_bucket|workqueue_queue_duration_seconds_bucket|grpc_server_.*"
                            action        = "drop"
                        }

                        rule {
                            source_labels = ["__name__"]
                            regex         = "etcd_disk_wal_fsync_duration_seconds_bucket|etcd_disk_backend_commit_duration_seconds_bucket|etcd_network_peer_round_trip_time_seconds_bucket"
                            target_label  = "etcd_keep_bucket"
                            replacement   = "1"
                        }
                        rule {
                            source_labels = ["__name__", "etcd_keep_bucket"]
                            regex         = "etcd_.*_bucket;"
                            action        = "drop"
                        }
                        rule {
                            regex  = "etcd_keep_bucket"
                            action = "labeldrop"
                        }
                    }

                    prometheus.remote_write "core" {
                        endpoint {
                            url = "https://prometheus.core.phorge/api/v1/write"

                            basic_auth {
                                username = sys.env("ALLOY_BASIC_AUTH_USERNAME")
                                password = sys.env("ALLOY_BASIC_AUTH_PASSWORD")
                            }

                            tls_config {
                                ca_file = "/etc/alloy-ca/ca.crt"
                            }
                        }

                        external_labels = {
                            cluster = sys.env("CLUSTER_NAME"),
                        }
                    }

                    discovery.kubernetes "pods" {
                        role = "pod"

                        selectors {
                            role  = "pod"
                            field = "spec.nodeName=" + sys.env("K8S_NODE_NAME")
                        }
                    }

                    discovery.relabel "pods" {
                        targets = discovery.kubernetes.pods.targets

                        rule {
                            source_labels = ["__meta_kubernetes_namespace"]
                            target_label  = "namespace"
                        }
                        rule {
                            source_labels = ["__meta_kubernetes_pod_name"]
                            target_label  = "pod"
                        }
                        rule {
                            source_labels = ["__meta_kubernetes_pod_container_name"]
                            target_label  = "container"
                        }
                    }

                    loki.source.kubernetes "pods" {
                        targets    = discovery.relabel.pods.output
                        forward_to = [loki.write.core.receiver]
                    }

                    loki.write "core" {
                        endpoint {
                            url = "https://loki.core.phorge/loki/api/v1/push"

                            basic_auth {
                                username = sys.env("ALLOY_BASIC_AUTH_USERNAME")
                                password = sys.env("ALLOY_BASIC_AUTH_PASSWORD")
                            }

                            tls_config {
                                ca_file = "/etc/alloy-ca/ca.crt"
                            }
                        }

                        external_labels = {
                            cluster = sys.env("CLUSTER_NAME"),
                        }
                    }
            envFrom:
                - secretRef:
                      name: alloy-secrets
            mounts:
                extra:
                    - name: alloy-ca-cert
                      mountPath: /etc/alloy-ca
                      readOnly: true
                    - name: rootfs
                      mountPath: /host/root
                      readOnly: true
                      mountPropagation: HostToContainer
        controller:
            type: daemonset
            hostNetwork: true
            hostPID: true
            dnsPolicy: ClusterFirstWithHostNet
            volumes:
                extra:
                    - name: alloy-ca-cert
                      configMap:
                          name: alloy-ca-cert
                    - name: rootfs
                      hostPath:
                          path: /
    postRenderers:
        # The chart probes the pod IP, which is the node IP under hostNetwork: probe the
        # loopback instead so the HTTP server doesn't have to listen on the node network.
        - kustomize:
              patches:
                  - target:
                        kind: DaemonSet
                        name: alloy
                    patch: |-
                        - op: add
                          path: /spec/template/spec/containers/0/readinessProbe/httpGet/host
                          value: 127.0.0.1
---
# Scrapes that must happen once per cluster rather than once per node, so they can't live
# in the DaemonSet above. A single replica on the host network like the DaemonSet, so its
# HTTP server can stay on the loopback too (hence its own port, they share the node).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
    name: alloy-cluster
    namespace: alloy
spec:
    chart:
        spec:
            chart: alloy
            version: '1.13.1'
            sourceRef:
                kind: HelmRepository
                name: alloy
    interval: 1h0s
    timeout: 5m0s
    values:
        alloy:
            listenAddr: 127.0.0.1
            listenPort: 12346
            enableReporting: false
            configMap:
                create: true
                content: |
                    logging {
                        level = "info"
                    }

                    // Scraped through each replica of the `kubernetes` Endpoints rather than
                    // through the service IP: that one lands on a random replica on every
                    // new connection and mixes their counters into a single series.
                    discovery.kubernetes "apiserver" {
                        role = "endpoints"

                        namespaces {
                            names = ["default"]
                        }

                        selectors {
                            role  = "endpoints"
                            field = "metadata.name=kubernetes"
                        }
                    }

                    prometheus.scrape "apiserver" {
                        job_name          = "apiserver"
                        targets           = discovery.kubernetes.apiserver.targets
                        scheme            = "https"
                        bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"

                        tls_config {
                            ca_file     = "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
                            server_name = "kubernetes"
                        }

                        forward_to = [prometheus.relabel.apiserver_filter.receiver]
                    }

                    // apiserver/etcd histogram _bucket series are the dominant source of
                    // cardinality (~36k of ~72k total series observed on a 3-node cluster).
                    // Drop them, keep _sum/_count so rate/average latency stays available.
                    // kubernetes_feature_enabled isn't a _bucket metric but is just as unused
                    // (a static per-feature-gate boolean, ~726 series on its own).
                    prometheus.relabel "apiserver_filter" {
                        forward_to = [prometheus.remote_write.core.receiver]

                        rule {
                            source_labels = ["__name__"]
                            regex         = ".*_bucket|kubernetes_feature_enabled"
                            action        = "drop"
                        }
                    }

                    discovery.kubernetes "coredns_pods" {
                        role = "pod"
                        namespaces {
                            names = ["kube-system"]
                        }
                        selectors {
                            role  = "pod"
                            label = "k8s-app=kube-dns"
                        }
                    }

                    discovery.relabel "coredns" {
                        targets = discovery.kubernetes.coredns_pods.targets

                        rule {
                            source_labels = ["__meta_kubernetes_pod_ip"]
                            target_label  = "__address__"
                            replacement   = "$1:9153"
                        }
                    }

                    prometheus.scrape "coredns" {
                        job_name   = "coredns"
                        targets    = discovery.relabel.coredns.output
                        forward_to = [prometheus.remote_write.core.receiver]
                    }

                    // Two ports under the same job label, since the chart's rules select on it: 8080
                    // for the kube_* state metrics, 8081 for its own telemetry (kube_state_metrics_*,
                    // read by the four KubeStateMetrics* rules).
                    prometheus.scrape "kube_state_metrics" {
                        job_name   = "kube-state-metrics"
                        targets    = [
                            {"__address__" = "kube-state-metrics.kube-state-metrics.svc.cluster.local:8080"},
                            {"__address__" = "kube-state-metrics.kube-state-metrics.svc.cluster.local:8081"},
                        ]
                        forward_to = [prometheus.remote_write.core.receiver]
                    }

                    // Watches PodMonitor CRDs cluster-wide and scrapes whatever they
                    // reference -- requires the prometheus-operator CRDs to be installed
                    // (base/controllers/prometheus-operator-crds), but not the operator
                    // itself: Alloy interprets the CRDs natively.
                    prometheus.operator.podmonitors "pods" {
                        forward_to = [prometheus.remote_write.core.receiver]
                    }

                    prometheus.remote_write "core" {
                        endpoint {
                            url = "https://prometheus.core.phorge/api/v1/write"

                            basic_auth {
                                username = sys.env("ALLOY_BASIC_AUTH_USERNAME")
                                password = sys.env("ALLOY_BASIC_AUTH_PASSWORD")
                            }

                            tls_config {
                                ca_file = "/etc/alloy-ca/ca.crt"
                            }
                        }

                        external_labels = {
                            cluster = sys.env("CLUSTER_NAME"),
                        }
                    }
            envFrom:
                - secretRef:
                      name: alloy-secrets
            mounts:
                extra:
                    - name: alloy-ca-cert
                      mountPath: /etc/alloy-ca
                      readOnly: true
        controller:
            type: deployment
            replicas: 1
            hostNetwork: true
            dnsPolicy: ClusterFirstWithHostNet
            # Two pods on the same node would fight for the loopback port.
            updateStrategy:
                type: Recreate
            volumes:
                extra:
                    - name: alloy-ca-cert
                      configMap:
                          name: alloy-ca-cert
    postRenderers:
        - kustomize:
              patches:
                  - target:
                        kind: Deployment
                        name: alloy-cluster
                    patch: |-
                        - op: add
                          path: /spec/template/spec/containers/0/readinessProbe/httpGet/host
                          value: 127.0.0.1
