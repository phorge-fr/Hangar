apiVersion: v1
kind: Namespace
metadata:
    name: traefik
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
    name: traefik
    namespace: traefik
spec:
    interval: 24h
    url: https://traefik.github.io/charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
    name: traefik-local
    namespace: traefik
spec:
    interval: 30m
    chart:
        spec:
            chart: traefik
            version: 42.2.0
            sourceRef:
                kind: HelmRepository
                name: traefik
                namespace: traefik
            interval: 12h
    values:
        fullnameOverride: traefik-local
        # The HTTP audit log (docs/explanation/http-audit-log.md): one JSON line per request on the standard output, collected by Alloy into the Loki
        # of core, which adds the country and the network of the client. Only the User-Agent header is kept (never Authorization or
        # Cookie), the Referer is dropped and so is the query string of the path (v3.7.3+): it can hold an OAuth code, a state or a
        # device code.
        accessLog:
            enabled: true
            format: json
            fields:
                defaultMode: keep
                headers:
                    defaultMode: drop
                    names:
                        User-Agent: keep
                queryParameters:
                    defaultMode: drop
        deployment:
            replicas: 2
        podDisruptionBudget:
            enabled: true
            maxUnavailable: 1
        affinity:
            podAntiAffinity:
                preferredDuringSchedulingIgnoredDuringExecution:
                    - weight: 100
                      podAffinityTerm:
                          labelSelector:
                              matchLabels:
                                  app.kubernetes.io/instance: traefik-local-traefik
                          topologyKey: kubernetes.io/hostname
        ingressClass:
            enabled: true
            isDefaultClass: false
            name: traefik-local
        providers:
            kubernetesIngress:
                ingressClass: traefik-local
        service:
            type: LoadBalancer
            annotations:
                lbipam.cilium.io/ips: 10.0.0.10
        ports:
            web:
                http:
                    redirections: {}
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
    name: traefik-public
    namespace: traefik
spec:
    interval: 30m
    chart:
        spec:
            chart: traefik
            version: 42.2.0
            sourceRef:
                kind: HelmRepository
                name: traefik
                namespace: traefik
            interval: 12h
    values:
        fullnameOverride: traefik-public
        # The HTTP audit log (docs/explanation/http-audit-log.md): one JSON line per request on the standard output, collected by Alloy into the Loki
        # of core, which adds the country and the network of the client. Only the User-Agent header is kept (never Authorization or
        # Cookie), the Referer is dropped and so is the query string of the path (v3.7.3+): it can hold an OAuth code, a state or a
        # device code.
        accessLog:
            enabled: true
            format: json
            fields:
                defaultMode: keep
                headers:
                    defaultMode: drop
                    names:
                        User-Agent: keep
                queryParameters:
                    defaultMode: drop
        deployment:
            replicas: 2
        podDisruptionBudget:
            enabled: true
            maxUnavailable: 1
        affinity:
            podAntiAffinity:
                preferredDuringSchedulingIgnoredDuringExecution:
                    - weight: 100
                      podAffinityTerm:
                          labelSelector:
                              matchLabels:
                                  app.kubernetes.io/instance: traefik-public-traefik
                          topologyKey: kubernetes.io/hostname
        ingressClass:
            enabled: true
            isDefaultClass: false
            name: traefik-public
        providers:
            kubernetesIngress:
                ingressClass: traefik-public
        service:
            type: LoadBalancer
            annotations:
                lbipam.cilium.io/ips: 10.0.0.11
        ports:
            web:
                http:
                    redirections:
                        entryPoint:
                            to: websecure
                            scheme: https
                            permanent: true
            websecure:
                proxyProtocol:
                    trustedIPs: []
