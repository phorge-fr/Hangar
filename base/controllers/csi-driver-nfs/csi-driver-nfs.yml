apiVersion: v1
kind: Namespace
metadata:
    name: csi-driver-nfs
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
    name: csi-driver-nfs
    namespace: csi-driver-nfs
spec:
    interval: 24h
    url: https://raw.githubusercontent.com/kubernetes-csi/csi-driver-nfs/master/charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
    name: csi-driver-nfs
    namespace: csi-driver-nfs
spec:
    interval: 30m
    chart:
        spec:
            chart: csi-driver-nfs
            version: 4.13.5
            sourceRef:
                kind: HelmRepository
                name: csi-driver-nfs
                namespace: csi-driver-nfs
            interval: 12h
    values:
        kubeletDir: /var/lib/k0s/kubelet
