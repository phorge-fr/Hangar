apiVersion: v1
kind: Namespace
metadata:
    name: longhorn-system
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
    name: longhorn
    namespace: longhorn-system
spec:
    interval: 24h
    url: https://charts.longhorn.io
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
    name: longhorn
    namespace: longhorn-system
spec:
    interval: 30m
    chart:
        spec:
            chart: longhorn
            version: 1.13.0
            sourceRef:
                kind: HelmRepository
                name: longhorn
                namespace: longhorn-system
            interval: 12h
    values:
        csi:
            attacherReplicaCount: 1
            provisionerReplicaCount: 1
            resizerReplicaCount: 1
            snapshotterReplicaCount: 1
        longhornUI:
            replicas: 1
